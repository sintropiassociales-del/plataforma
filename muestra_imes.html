<head>

<title>Muestra IMES — Sintropía Social</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --purple: #631EEB;
    --purple-dark: #4E17B8;
    --orange: #FF7929;
    --bg: #F5F3FC;
    --card: #FFFFFF;
    --text: #2C2C2C;
    --subtle: #6B6B78;
    --border: #E6E2F5;
    --error: #C0392B;
    --error-bg: #FDECEA;
    --ok: #1E8449;
    --ok-bg: #EAF7EE;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Open Sans', -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.55;
  }
  header.top {
    background: var(--purple); color: #fff; padding: 26px 18px 44px; text-align: center;
    border-radius: 0 0 22px 22px;
  }
  header.top .marca { font-size: 20px; font-weight: 800; letter-spacing: .3px; }
  header.top .marca span { color: var(--orange); }
  header.top .subt { font-size: 13.5px; opacity: .92; margin-top: 6px; max-width: 420px; margin-left: auto; margin-right: auto; }
  main { max-width: 640px; margin: -26px auto 40px; padding: 0 16px; }
  .card {
    background: var(--card); border-radius: 14px; padding: 26px 24px; margin-bottom: 16px;
    box-shadow: 0 6px 20px rgba(99,30,235,.08); border: 1px solid var(--border);
  }
  h1 { font-size: 21px; margin: 0 0 8px; }
  h2 { font-size: 18px; margin: 0 0 4px; color: var(--purple-dark); }
  h3 { font-size: 15px; margin: 22px 0 2px; color: var(--purple-dark); }
  p.subtle, .subtle { color: var(--subtle); font-size: 13.5px; }
  .progreso { display: flex; gap: 6px; margin: 18px 0 22px; }
  .progreso .paso { flex: 1; height: 6px; border-radius: 4px; background: var(--border); }
  .progreso .paso.hecho { background: var(--orange); }
  .progreso .paso.actual { background: var(--purple); }
  label { display: block; font-size: 13.5px; font-weight: 600; margin: 14px 0 5px; }
  label .req { color: var(--orange); }
  input[type=text], input[type=number], input[type=email], select {
    width: 100%; padding: 11px 12px; border: 1.5px solid var(--border); border-radius: 9px;
    font-size: 15px; font-family: inherit; background: #fff; color: var(--text);
  }
  input:focus, select:focus { outline: none; border-color: var(--purple); }
  .hint { font-size: 12px; color: var(--subtle); margin-top: 3px; }
  .fila-botones { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
  button {
    font-family: inherit; font-size: 14.5px; font-weight: 700; border-radius: 999px;
    padding: 12px 24px; border: none; cursor: pointer;
  }
  button.primary { background: var(--purple); color: #fff; }
  button.primary:hover { background: var(--purple-dark); }
  button.secondary { background: #fff; color: var(--purple); border: 1.5px solid var(--purple); }
  button.link { background: none; color: var(--purple); padding: 6px 4px; text-decoration: underline; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { padding: 10px 13px; border-radius: 9px; font-size: 13.5px; margin: 12px 0; }
  .msg.error { background: var(--error-bg); color: var(--error); }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .pantalla-centrada { text-align: center; padding: 6px 4px 12px; }

  /* Bloques de dimensión */
  .bloque-dimension { margin-bottom: 26px; }
  .bloque-dimension .num-bloque { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .5px;
    color: var(--purple); text-transform: uppercase; margin-bottom: 2px; }
  .bloque-dimension .nombre-dimension { font-size: 16px; font-weight: 700; margin: 0 0 14px; }

  /* Escala Likert */
  .likert { border-top: 1px solid var(--border); padding: 16px 0; }
  .likert:first-of-type { border-top: none; padding-top: 4px; }
  .likert-pregunta { font-size: 14.5px; font-weight: 600; margin-bottom: 10px; }
  .likert-escala { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; }
  .likert-opcion { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; cursor: pointer; }
  .likert-opcion input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .likert-circulo {
    width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--border); background: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: var(--subtle);
    transition: background .12s, border-color .12s, color .12s;
  }
  .likert-opcion input:checked + .likert-circulo { background: var(--purple); border-color: var(--purple); color: #fff; }
  .likert-opcion .likert-texto { font-size: 10px; color: var(--subtle); text-align: center; line-height: 1.25; min-height: 26px; }

  /* Consentimiento */
  .consentimiento { display: flex; gap: 10px; align-items: flex-start; margin-top: 18px; background: #FAF8FF;
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .consentimiento input { margin-top: 3px; }
  .consentimiento label { margin: 0; font-weight: 400; font-size: 13px; }

  /* Campo trampa anti-bots — invisible para personas, visible para bots que rellenan todo */
  .campo-trampa { position: absolute; left: -9999px; top: -9999px; opacity: 0; height: 0; overflow: hidden; }

  /* Resultado */
  .resultado-dimension { border: 1.5px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
  .resultado-dimension .banda {
    display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase;
    padding: 3px 10px; border-radius: 999px; margin-bottom: 8px;
  }
  .banda.banda-desarrollo { background: #FDF2E9; color: #B9560A; }
  .banda.banda-proceso { background: #FDF6E3; color: #9A7B0A; }
  .banda.banda-consolidada { background: var(--ok-bg); color: var(--ok); }
  .resultado-dimension .puntaje { font-size: 13px; color: var(--subtle); margin: 0 0 8px; }
  .resultado-dimension p { margin: 0; font-size: 14px; }

  .cta { background: linear-gradient(135deg, var(--purple), var(--purple-dark)); color: #fff; border-radius: 14px;
    padding: 22px 24px; margin-top: 8px; }
  .cta h2 { color: #fff; }
  .cta p { font-size: 13.5px; opacity: .95; }
  .cta a { color: #fff; font-weight: 700; }

  footer.pie { text-align: center; font-size: 12px; color: var(--subtle); padding: 10px 16px 34px; }
  footer.pie .wordmark { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  footer.pie a { color: var(--purple); text-decoration: none; }
</style>
</head>

}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function jsonp(action, params) {
  return new Promise(function (resolve) {
    var cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
    var url = WEB_APP_URL + '?action=' + encodeURIComponent(action) + '&callback=' + cbName;
    params = params || {};
    for (var k in params) {
      if (params[k] !== undefined && params[k] !== null) url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }
    var script = document.createElement('script');
    var cleaned = false;
    function cleanup() { if (cleaned) return; cleaned = true; delete window[cbName]; if (script.parentNode) script.parentNode.removeChild(script); }
    window[cbName] = function (data) { cleanup(); resolve(data); };
    script.onerror = function () { cleanup(); resolve({ ok: false, error: 'No se pudo conectar. Revisa tu conexión a internet e intenta de nuevo.' }); };
    setTimeout(function () { if (!cleaned) { cleanup(); resolve({ ok: false, error: 'La plataforma tardó demasiado en responder. Intenta de nuevo.' }); } }, 25000);
    script.src = url;
    document.body.appendChild(script);
  });
}

  var bloquesHtml = DIMENSIONES_MUESTRA.map(function (dim, di) {
    var itemsHtml = dim.items.map(function (texto, ii) {
      var name = 'd' + di + 'i' + ii;
      var opcionesHtml = [1, 2, 3, 4, 5].map(function (v) {
        var marcado = state.respuestas[name] === v;
        return '<label class="likert-opcion">' +
          '<input type="radio" name="' + name + '" value="' + v + '"' + (marcado ? ' checked' : '') + '>' +
          '<span class="likert-circulo">' + v + '</span>' +
          '<span class="likert-texto">' + etiquetasEscala[v - 1] + '</span>' +
        '</label>';
      }).join('');
      return '<div class="likert" data-name="' + name + '">' +
        '<div class="likert-pregunta">' + escapeHtml(texto) + '</div>' +
        '<div class="likert-escala">' + opcionesHtml + '</div>' +
      '</div>';
    }).join('');
    return '<div class="bloque-dimension">' +
      '<div class="num-bloque">Bloque ' + (di + 1) + ' de ' + DIMENSIONES_MUESTRA.length + '</div>' +
      '<div class="nombre-dimension">' + escapeHtml(dim.nombre) + '</div>' +
      itemsHtml +
    '</div>';
  }).join('');

  app.innerHTML =
    progresoHtml() +
    '<h2>Responde según qué tan de acuerdo estás</h2>' +
    '<p class="subtle" style="margin-top:0">No hay respuestas correctas o incorrectas — responde con lo primero que pienses.</p>' +
    '<div id="secMsg"></div>' +
    bloquesHtml +
    '<div class="fila-botones">' +
      '<button class="secondary" id="btnAtras">Atrás</button>' +
      '<button class="primary" id="btnSiguiente">Continuar</button>' +
    '</div>';

  Array.prototype.forEach.call(app.querySelectorAll('.likert-opcion input'), function (input) {
    input.addEventListener('change', function () {
      state.respuestas[input.name] = Number(input.value);
    });
  });

  document.getElementById('btnAtras').onclick = function () { state.paso = 0; render(); };
  document.getElementById('btnSiguiente').onclick = function () {
    var totalItems = DIMENSIONES_MUESTRA.reduce(function (n, d) { return n + d.items.length; }, 0);
    var respondidos = Object.keys(state.respuestas).length;
    if (respondidos < totalItems) {
      document.getElementById('secMsg').innerHTML = '<div class="msg error">Responde las ' + totalItems + ' preguntas antes de continuar (llevas ' + respondidos + ').</div>';
      return;
    }
    state.paso = 2;
    render();
  };
}

function renderDatos() {
  var opcionesEstado = '<option value="">Selecciona un estado</option>' +
    ESTADOS_MEXICO.map(function (e) { return '<option value="' + escapeHtml(e) + '">' + escapeHtml(e) + '</option>'; }).join('');

  app.innerHTML =
    progresoHtml() +
    '<h2>Ya casi — ¿a dónde te enviamos tu resultado?</h2>' +
    '<p class="subtle" style="margin-top:0">Usamos estos datos únicamente para compartirte tu resultado y, si nos autorizas, para contarte sobre el IMES completo y otros instrumentos de Sintropía Social.</p>' +
    '<div id="secMsg"></div>' +
    '<form id="datosForm">' +
      '<label>Nombre <span class="req">*</span></label><input type="text" id="dNombre">' +
      '<label>Apellido</label><input type="text" id="dApellido">' +
      '<div class="row" style="display:flex;gap:12px">' +
        '<div style="flex:1"><label>Estado</label><select id="dEstado">' + opcionesEstado + '</select></div>' +
        '<div style="flex:1"><label>Municipio</label><select id="dMunicipio"><option value="">Selecciona un estado primero</option></select></div>' +
      '</div>' +
      '<label>Edad</label><input type="number" id="dEdad" min="10" max="99">' +
      '<label>Correo electrónico <span class="req">*</span></label><input type="email" id="dEmail" placeholder="nombre@correo.com">' +
      '<label>Teléfono (opcional)</label><input type="text" id="dTelefono">' +
      '<input type="text" id="dTrampa" class="campo-trampa" tabindex="-1" autocomplete="off">' +
      '<div class="consentimiento">' +
        '<input type="checkbox" id="dConsentimiento">' +
        '<label for="dConsentimiento">Autorizo a Sintropía Social a contactarme para compartirme mi resultado y contarme sobre sus servicios. Puedo pedir que borren mis datos cuando quiera escribiendo a comunicacion@sintropiasocial.com.</label>' +
      '</div>' +
    '</form>' +
    '<div class="fila-botones">' +
      '<button class="secondary" id="btnAtras">Atrás</button>' +
      '<button class="primary" id="btnVerResultado">Ver mi resultado</button>' +
    '</div>';

  document.getElementById('dEstado').onchange = function () {
    var estado = document.getElementById('dEstado').value;
    var selMunicipio = document.getElementById('dMunicipio');
    if (!estado) { selMunicipio.innerHTML = '<option value="">Selecciona un estado primero</option>'; return; }
    var municipios = ESTADOS_MUNICIPIOS[estado] || [];
    selMunicipio.innerHTML = '<option value="">Selecciona un municipio</option>' +
      municipios.map(function (m) { return '<option value="' + escapeHtml(m) + '">' + escapeHtml(m) + '</option>'; }).join('');
  };

  document.getElementById('btnAtras').onclick = function () { state.paso = 1; render(); };
  document.getElementById('btnVerResultado').onclick = async function () {
    var msgBox = document.getElementById('secMsg');
    var nombre = document.getElementById('dNombre').value.trim();
    var email = document.getElementById('dEmail').value.trim();
    var consentimiento = document.getElementById('dConsentimiento').checked;
    if (!nombre) { msgBox.innerHTML = '<div class="msg error">Escribe tu nombre.</div>'; return; }
    if (!email || email.indexOf('@') === -1) { msgBox.innerHTML = '<div class="msg error">Escribe un correo electrónico válido.</div>'; return; }
    if (!consentimiento) { msgBox.innerHTML = '<div class="msg error">Necesitamos tu autorización para poder contactarte con tu resultado.</div>'; return; }

    var resultado = DIMENSIONES_MUESTRA.map(function (dim, di) {
      var puntaje = dim.items.reduce(function (s, _t, ii) { return s + (state.respuestas['d' + di + 'i' + ii] || 0); }, 0);
      var banda = _bandaDimension(puntaje);
      return { nombre: dim.nombre, puntaje: puntaje, banda: banda, texto: dim.interpretacion[banda.clave] };
    });
    state.resultado = resultado;

    var btn = document.getElementById('btnVerResultado');
    btn.disabled = true; btn.textContent = 'Guardando...';
    var resumenNotas = resultado.map(function (r) { return r.nombre + ': ' + r.puntaje + '/30 (' + r.banda.etiqueta + ')'; }).join(' — ');
    await jsonp('capturarInteresadoMuestra', {
      muestra: 'IMES',
      nombre: nombre,
      apellido: document.getElementById('dApellido').value.trim(),
      estado: document.getElementById('dEstado').value,
      municipio: document.getElementById('dMunicipio').value,
      edad: document.getElementById('dEdad').value,
      email: email,
      telefono: document.getElementById('dTelefono').value.trim(),
      consentimiento: 'Sí',
      notas: resumenNotas,
      sitioWebTrampa: document.getElementById('dTrampa').value
    });
    // El resultado se muestra siempre, incluso si el guardado del lead
    // falla por algún motivo de red — no queremos que un problema de
    // conexión le esconda a la persona lo que ya respondió.
    state.paso = 3;
    render();
  };
}

function renderResultado() {
  var bloquesHtml = state.resultado.map(function (r) {
    return '<div class="resultado-dimension">' +
      '<span class="banda ' + r.banda.claseCss + '">' + r.banda.etiqueta + '</span>' +
      '<h3 style="margin:0 0 2px">' + escapeHtml(r.nombre) + '</h3>' +
      '<p class="puntaje">' + r.puntaje + ' de 30 puntos</p>' +
      '<p>' + escapeHtml(r.texto) + '</p>' +
    '</div>';
  }).join('');

  app.innerHTML =
    progresoHtml() +
    '<div class="pantalla-centrada"><h1>Tu resultado</h1>' +
    '<p class="subtle">Esto es solo una muestra — la aplicación completa del IMES (36 reactivos, 6 dimensiones, más preguntas abiertas) da un panorama mucho más completo, acompañado por el equipo de Sintropía Social.</p></div>' +
    bloquesHtml +
    '<div class="cta">' +
      '<h2>¿Quieres el IMES completo para tu organización?</h2>' +
      '<p>El IMES es uno de los 35 instrumentos del Banco Integral de Sintropía Social para investigación social, educación y reclutamiento. Escríbenos y te contamos cómo aplicarlo con tu equipo, grupo o comunidad.</p>' +
      '<p><a href="mailto:comunicacion@sintropiasocial.com">comunicacion@sintropiasocial.com</a> · <a href="https://sintropiassociales-del.github.io/">sintropiassociales-del.github.io</a></p>' +
    '</div>';
}

render();
</script>
</body>
</html>
