<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tres puertas al trabajo | Sintropía Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --morado:#6B21F5; --naranja:#FF6B1A; --papel:#FAF8FF; --tarjeta:#FFFFFF;
  --tinta:#1E1633; --suave:#5C5572; --linea:#E3DDF3; --lila:#F0E9FF; --durazno:#FFEFE4;
  --ok:#17875A; --mal:#C8322A; --sobre-morado:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --morado:#9A6BFF; --naranja:#FF8A45; --papel:#130E22; --tarjeta:#1C1530;
    --tinta:#EFEBFA; --suave:#B3ABCB; --linea:#302650; --lila:#241A40; --durazno:#33201A;
    --ok:#4CC792; --mal:#FF7A70; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --morado:#9A6BFF; --naranja:#FF8A45; --papel:#130E22; --tarjeta:#1C1530;
  --tinta:#EFEBFA; --suave:#B3ABCB; --linea:#302650; --lila:#241A40; --durazno:#33201A;
  --ok:#4CC792; --mal:#FF7A70; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--papel);color:var(--tinta);
  font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.55}
h1,h2,h3{font-family:Montserrat,"Open Sans",system-ui,sans-serif;line-height:1.12;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:900}
h2{font-size:clamp(1.45rem,3.6vw,2rem);font-weight:800}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--morado)}
:focus-visible{outline:3px solid var(--naranja);outline-offset:3px;border-radius:6px}
.wrap{max-width:900px;margin:0 auto;padding:18px 18px 64px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 18px}
.marca{font-family:Montserrat,sans-serif;font-weight:800;font-size:.95rem;color:var(--morado);display:flex;align-items:center;gap:8px}
.marca i{display:inline-block;width:18px;height:18px;border-radius:50%;border:3px solid var(--morado);border-right-color:var(--naranja)}
.miga{font-size:.85rem;color:var(--suave);text-align:right}
.acento{display:flex;align-items:center;gap:6px;margin:14px 0 18px}
.acento span{height:4px;width:34px;border-radius:2px;background:var(--morado)}
.acento b{width:7px;height:7px;border-radius:50%;background:var(--naranja)}
.lede{font-size:1.08rem;color:var(--suave);max-width:60ch}
.stack>*+*{margin-top:14px}
.btn{appearance:none;border:0;border-radius:12px;padding:13px 20px;font-weight:700;cursor:pointer;
  background:var(--naranja);color:#fff;font-family:Montserrat,sans-serif;font-size:.98rem;min-height:48px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--morado);box-shadow:inset 0 0 0 2px var(--morado)}
.btn.lnk{background:transparent;color:var(--suave);padding:10px 4px;min-height:auto;font-weight:600}
.fila{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.volver{margin-bottom:6px}

/* Puertas */
.doors{display:grid;gap:16px;grid-template-columns:1fr;margin-top:28px;perspective:1200px}
@media(min-width:720px){.doors{grid-template-columns:repeat(3,1fr)}}
.door{position:relative;border:0;cursor:pointer;text-align:left;color:#fff;background:var(--morado);
  border-radius:170px 170px 14px 14px;min-height:300px;padding:80px 24px 24px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;
  transform-origin:left center;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
.door::before{content:"";position:absolute;inset:14px;border-radius:156px 156px 8px 8px;border:1.5px solid rgba(255,255,255,.28);pointer-events:none}
.door::after{content:"";position:absolute;right:24px;top:52%;width:12px;height:12px;border-radius:50%;background:var(--naranja)}
.door.d2{background:#4A12B8}
.door.d3{background:var(--naranja)}
.door.d3::after{background:#fff}
.door h3{font-size:1.35rem;font-weight:800;color:#fff}
.door p{font-size:.95rem;opacity:.92;max-width:26ch}
.door small{font-weight:700;font-size:.8rem;opacity:.85}
.door:hover,.door:focus-visible{transform:rotateY(-14deg);box-shadow:18px 0 0 -6px var(--linea)}
@media(max-width:719px){.door{min-height:190px;border-radius:120px 120px 14px 14px;padding-top:56px}.door::before{border-radius:106px 106px 8px 8px}}

/* Tarjetas de elección */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.card{appearance:none;text-align:left;border:0;background:var(--tarjeta);border-radius:16px;padding:16px;cursor:pointer;
  box-shadow:inset 0 0 0 1.5px var(--linea);display:flex;flex-direction:column;gap:6px}
.card:hover{box-shadow:inset 0 0 0 2px var(--morado)}
.card[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--morado);background:var(--lila)}
.card .av{width:100%;max-width:130px;align-self:center}
.card h3{margin-top:4px}
.card p{font-size:.9rem;color:var(--suave)}
.card.crear{background:transparent;box-shadow:inset 0 0 0 2px var(--naranja);border-style:dashed;justify-content:center;align-items:center;text-align:center;min-height:220px}
.card.crear h3{color:var(--naranja)}
.juego{padding:22px;border-radius:20px}
.juego h3{font-size:1.25rem}
.juego.j2{background:var(--durazno);box-shadow:none}
.juego.j1{background:var(--lila);box-shadow:none}
.juego:hover{box-shadow:inset 0 0 0 2px var(--morado)}

.seg{display:inline-flex;background:var(--lila);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:10px 18px;border-radius:9px;cursor:pointer;font-weight:700;font-family:Montserrat,sans-serif;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--morado);color:#fff}
.nota{font-size:.9rem;color:var(--suave)}
.bloque{margin-top:26px}

.empleo .sal{font-family:Montserrat,sans-serif;font-weight:800;font-size:1.25rem;color:var(--tinta)}
.empleo .sal small{font-size:.75rem;font-weight:600;color:var(--suave)}
.empleo.alto .sal{color:var(--ok)}

/* Editor de avatar */
.editor{display:grid;gap:22px;grid-template-columns:1fr}
@media(min-width:720px){.editor{grid-template-columns:260px 1fr}}
.preview{background:var(--lila);border-radius:20px;padding:18px;display:flex;justify-content:center}
.preview svg{width:100%;max-width:220px}
.campo{margin-bottom:16px}
.campo>label,.campo>.et{display:block;font-weight:700;margin-bottom:8px;font-size:.95rem}
.campo input[type=text]{width:100%;max-width:340px;padding:12px 14px;border-radius:10px;border:2px solid var(--linea);background:var(--tarjeta);color:var(--tinta);font:inherit}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--papel),0 0 0 6px var(--morado)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--tarjeta);box-shadow:inset 0 0 0 1.5px var(--linea);border-radius:999px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:.92rem;min-height:40px}
.chip[aria-pressed="true"]{background:var(--morado);color:#fff;box-shadow:none}

/* Entrevista */
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.hud div{background:var(--tarjeta);border-radius:14px;padding:10px 12px;box-shadow:inset 0 0 0 1.5px var(--linea)}
.hud small{display:block;color:var(--suave);font-size:.78rem;font-weight:600}
.hud strong{font-family:Montserrat,sans-serif;font-size:1.3rem;font-weight:800}
.barra{height:8px;border-radius:4px;background:var(--linea);overflow:hidden;margin-top:6px}
.barra i{display:block;height:100%;border-radius:4px;transition:width .5s,background .5s}
.escena{position:relative;background:var(--lila);border-radius:22px;padding:18px 14px 0;overflow:hidden}
.escena .personas{display:grid;grid-template-columns:1fr 1fr;align-items:end;gap:8px;position:relative;z-index:1}
.escena .persona{text-align:center}
.escena .persona svg{width:100%;max-width:170px;display:block;margin:0 auto}
.escena .persona span{display:block;font-size:.82rem;font-weight:700;padding:6px 0 10px;color:var(--suave)}
.escena .escritorio{height:26px;background:var(--morado);margin:0 -14px;position:relative;z-index:2}
.globo{position:relative;background:var(--tarjeta);border-radius:18px;padding:16px 18px;margin-bottom:16px;box-shadow:inset 0 0 0 1.5px var(--linea);z-index:1}
.globo::after{content:"";position:absolute;left:22%;bottom:-10px;width:20px;height:20px;background:var(--tarjeta);transform:rotate(45deg);box-shadow:1.5px 1.5px 0 0 var(--linea)}
.globo .reac{font-size:.92rem;color:var(--suave);font-style:italic;margin-bottom:6px}
.globo .preg{font-family:Montserrat,sans-serif;font-weight:700;font-size:1.12rem}
.escena.enojo .escritorio{background:var(--mal)}
.opciones{display:grid;gap:10px;margin-top:18px}
.op{appearance:none;border:0;text-align:left;background:var(--tarjeta);border-radius:14px;padding:14px 16px;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--linea);font-size:.98rem;min-height:48px}
.op:hover{box-shadow:inset 0 0 0 2px var(--morado)}
.op.elegida{box-shadow:inset 0 0 0 3px var(--morado)}
.op.mejor{box-shadow:inset 0 0 0 3px var(--ok)}
.op[disabled]{cursor:default}
.retro{margin-top:16px;border-radius:16px;padding:16px 18px;background:var(--tarjeta);box-shadow:inset 0 0 0 1.5px var(--linea)}
.retro .cal{font-family:Montserrat,sans-serif;font-weight:800}
.retro .cal.g4,.retro .cal.g3{color:var(--ok)}
.retro .cal.g0,.retro .cal.g1{color:var(--mal)}
.retro .tip{margin-top:6px;color:var(--suave);font-size:.94rem}
.calmar{margin-top:16px;border-radius:16px;padding:16px;background:var(--durazno)}
.calmar h3{margin-bottom:10px}
@keyframes vibra{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.vibra{animation:vibra .25s 2}

/* Habilidades */
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--linea);margin:18px 0 14px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:12px 14px;cursor:pointer;font-weight:700;font-family:Montserrat,sans-serif;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;color:var(--suave)}
.tabs button[aria-selected="true"]{color:var(--morado);border-bottom-color:var(--morado)}
.tabs em{font-style:normal;font-weight:600;font-size:.85rem;margin-left:4px}
.lista{display:flex;flex-wrap:wrap;gap:8px}
.lista .chip small{font-weight:600;opacity:.7;margin-left:6px;font-size:.78rem}
.pie{position:sticky;bottom:0;background:var(--papel);padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));margin-top:22px;border-top:1.5px solid var(--linea);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* Burnout */
.sim{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:720px){.sim{grid-template-columns:230px 1fr}}
.sim .retrato{background:var(--lila);border-radius:20px;padding:16px;text-align:center}
.sim .retrato svg{width:100%;max-width:190px}
.medidor{margin-top:10px;text-align:left}
.medidor small{display:flex;justify-content:space-between;font-weight:700;font-size:.82rem}
.situ{background:var(--tarjeta);border-radius:18px;padding:18px;box-shadow:inset 0 0 0 1.5px var(--linea)}
.situ .mes{font-family:Montserrat,sans-serif;font-weight:800;color:var(--naranja);font-size:.95rem}
.situ h3{margin:6px 0 8px;font-size:1.25rem}

.ruta{list-style:none;margin:12px 0 0;padding:0;font-size:.76rem;display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.ruta li{padding:3px 8px;border-radius:999px;color:var(--suave);box-shadow:inset 0 0 0 1px var(--linea)}
.ruta li.hecha{color:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok)}
.ruta li.actual{color:#fff;background:var(--morado);box-shadow:none;font-weight:700}
.salario{margin-top:18px;border-radius:16px;padding:16px 18px;background:var(--durazno)}
.salario small{display:block;font-weight:700;color:var(--suave);font-size:.85rem}
.salario strong{display:block;font-family:Montserrat,sans-serif;font-weight:800;font-size:1.5rem;margin:2px 0 4px}
.salario p{font-size:.9rem;color:var(--suave)}
.tray{margin:8px 0 0;padding-left:22px}.tray li+li{margin-top:4px}
.vidas{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:10px;justify-content:center}
.vidas span{width:14px;height:14px;border-radius:50%;background:var(--ok)}
.vidas span.usada{background:var(--mal);opacity:.35}
.vidas em{font-style:normal;font-size:.8rem;font-weight:700;color:var(--suave);width:100%;text-align:center}
.estragos{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.estragos li{font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--durazno);color:var(--mal)}
.huella{margin-top:12px;border-radius:12px;padding:12px 14px;background:var(--durazno);font-size:.93rem}
.huella strong{color:var(--mal)}
.situ.rect{box-shadow:inset 0 0 0 2px var(--naranja)}
.situ.rect .mes{color:var(--morado)}
.tray li.r{color:var(--suave);font-size:.93rem;list-style:circle}
/* Resultado */
.final{border-radius:22px;padding:24px;background:var(--tarjeta);box-shadow:inset 0 0 0 1.5px var(--linea)}
.final .cifra{font-family:Montserrat,sans-serif;font-weight:900;font-size:clamp(3rem,10vw,5rem);line-height:1;color:var(--morado)}
.final .cifra small{font-size:.35em;color:var(--suave);font-weight:700}
.final ul{margin:10px 0 0;padding-left:20px}
.final li+li{margin-top:6px}
.prueba{margin-top:20px;border-radius:22px;padding:24px;background:var(--morado);color:#fff}
.prueba h2{color:#fff}
.prueba p{opacity:.95;margin-top:8px;max-width:60ch}
.prueba .btn{margin-top:16px;display:inline-flex;align-items:center;text-decoration:none}
.prueba .btn.sec{color:#fff;box-shadow:inset 0 0 0 2px #fff}
.av svg{display:block}
/* Intake público (captura de datos antes de jugar, sin token de proyecto) */
.intake{background:var(--tarjeta);border-radius:22px;padding:24px;box-shadow:inset 0 0 0 1.5px var(--linea)}
.intake .campo input[type=text],.intake .campo input[type=email],.intake .campo input[type=tel],.intake .campo select{
  width:100%;max-width:420px;padding:12px 14px;border-radius:10px;border:2px solid var(--linea);background:var(--tarjeta);color:var(--tinta);font:inherit}
.intake .campo{margin-bottom:14px}
.intake .campo label{display:block;font-weight:700;margin-bottom:6px;font-size:.92rem}
.intake .campo .req{color:var(--naranja)}
.intake .doscol{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:600px){.intake .doscol{grid-template-columns:1fr 1fr}}
.intake .consent{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;color:var(--suave)}
.intake .consent input{margin-top:3px}
.intake .err{color:var(--mal);font-size:.9rem;margin-top:10px}
.trampa{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.enviando{font-size:.92rem;color:var(--suave);margin-top:10px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="marca"><i aria-hidden="true"></i>Sintropía Social</div>
    <div class="miga" id="miga"></div>
  </header>
  <main id="app" tabindex="-1"></main>
</div>

  ["Si al hacer tu corte de caja te faltan 200 pesos, ¿qué haces?",["Reviso tickets y movimientos del turno y, si no aparece, lo reporto de inmediato explicando lo que revisé.","Cuento otra vez con un compañero como testigo antes de avisar.","Espero al corte del día siguiente; a veces el faltante aparece solo.","Lo pongo de mi dinero para no tener problemas; son solo 200 pesos.","Lo registro como error de la terminal; suele pasar y casi nadie lo revisa."],"Transparencia ante todo: reportar a tiempo, con lo que ya revisaste, protege tu confianza y tu empleo. Pagarlo de tu bolsa esconde un problema que se repetirá."],
  ["Hay una fila larga y un cliente exige que lo atiendas primero. ¿Qué haces?",["Le explico con amabilidad que respeto el turno de todos y le ofrezco otra caja o un tiempo estimado.","Le pido amablemente que espere su turno y sigo atendiendo lo más rápido posible.","Llamo a mi supervisor para que él decida qué hacer con el cliente.","Lo atiendo primero para evitar que se haga un problema mayor.","Le pido a otro cliente de la fila que le ceda su lugar."],"Firmeza amable: sostener la regla y ofrecer una alternativa, sin trasladar el problema a otras personas."],
  ["¿Cómo convencerías a alguien de comprar un producto?",["Le pregunto para qué lo necesita y le recomiendo lo que de verdad le sirve, aunque sea lo más barato.","Le explico los beneficios y le muestro dos opciones para que compare.","Le recomiendo el producto con mejor comisión; también es de buena calidad.","Le digo que la promoción termina hoy para que decida rápido.","Le agrego la garantía extendida desde el inicio; así ya va incluida en el precio."],"Vender es escuchar. La confianza del cliente vale más que una venta forzada o con presión."],
  ["Faltan cinco días para cerrar el mes y vas al 60% de tu meta de ventas. ¿Qué haces?",["Reviso qué productos y horarios venden más, pido ideas a quien sí va en meta y enfoco ahí mis esfuerzos.","Le pregunto a mi supervisor qué estrategia me recomienda para esos días.","Me quedo horas extra esos días para atender a más clientes.","Ofrezco descuentos por mi cuenta para cerrar más ventas.","Registro como mías algunas ventas que ayudé a cerrar con compañeros."],"Analizar datos y aprender de quien lo hace bien es más efectivo que trabajar más horas o improvisar descuentos."]],
 salud:[
  ["Una persona a tu cargo se niega a tomar su medicamento. ¿Qué haces?",["Escucho por qué no quiere, le explico con calma, aviso al personal responsable y lo dejo registrado.","Le explico la importancia del medicamento e intento de nuevo en unos minutos.","Le pido a un familiar que la convenza; a ellos suele hacerles más caso.","Lo dejo para el siguiente turno para no forzarla.","Lo mezclo con su comida para que se lo tome sin darse cuenta."],"Respeto, comunicación y registro. Nunca decidas a solas sobre la salud de otra persona ni la engañes."],
  ["¿Cómo cuidas la información de las personas que atiendes?",["Solo la comparto con el equipo que la necesita para su atención y nunca fuera del trabajo.","Evito comentarla, aunque a veces reviso expedientes de otros casos para aprender.","La platico con compañeros en el comedor, pero sin decir nombres.","Si un familiar me pregunta por teléfono, le doy la información para tranquilizarlo.","Comparto casos interesantes en mis redes, siempre sin fotos ni nombres."],"La confidencialidad es un deber profesional y legal. Revisar expedientes sin necesidad o dar datos por teléfono también la rompe."],
  ["Llevas un turno de 12 horas y ya no puedes más. ¿Qué haces?",["Aviso a mi responsable, pido relevo o apoyo y no pongo en riesgo a nadie por el cansancio.","Tomo un descanso breve, me hidrato y sigo con doble cuidado.","Le pido a un compañero que revise mis registros antes de entregarlos.","Me tomo una bebida energética y continúo hasta terminar.","Sigo como pueda; si me voy, el equipo se queda con menos gente."],"El cansancio causa errores. Reconocer tus límites también protege a quienes atiendes."],
  ["Notas que un compañero registró mal la dosis de un paciente. ¿Qué haces?",["Lo aviso de inmediato al responsable del turno para corregirlo antes de que afecte al paciente.","Se lo digo a mi compañero en privado para que lo corrija enseguida.","Lo corrijo yo en el registro para que no haya problema.","Espero a confirmarlo con el médico en su siguiente ronda.","No digo nada; no me corresponde revisar el trabajo de otros."],"En salud, la seguridad del paciente va primero: avisar al responsable de inmediato. Corregir por tu cuenta o esperar puede causar daño."]],
 tec:[
  ["Si no sabes resolver un problema técnico, ¿qué haces?",["Reviso la documentación, pruebo opciones y, si en un tiempo razonable no avanzo, pido ayuda explicando lo que ya intenté.","Busco en foros y tutoriales hasta encontrar la solución, aunque me lleve toda la tarde.","Le pregunto de inmediato a alguien con más experiencia para no perder tiempo.","Aplico una solución temporal para que funcione y la reviso cuando tenga tiempo.","Lo marco como resuelto y lo retomo si el cliente vuelve a reportarlo."],"Autonomía con límite de tiempo, y saber pedir ayuda con contexto: eso busca un equipo técnico."],
  ["¿Cómo te mantienes al día en tecnología?",["Hago proyectos propios, tomo cursos en línea y comparto lo que aprendo en comunidades.","Tomo cursos cuando el trabajo lo requiere y leo documentación oficial.","Veo tutoriales en video cuando necesito algo específico.","Sigo a creadores de contenido de tecnología en redes sociales.","Me enfoco en dominar bien lo que ya sé; las modas cambian muy rápido."],"En tecnología, lo que aprendiste hace dos años puede ya no servir. Muestra un hábito de aprendizaje constante y práctico."],
  ["Un cliente pide un cambio urgente que no estaba en lo acordado. ¿Qué haces?",["Le explico el impacto en tiempos, propongo priorizarlo frente a otras tareas y lo dejo por escrito.","Lo hago, pero aviso que puede retrasar otras entregas.","Lo consulto con mi jefe antes de responderle al cliente.","Lo hago en la noche para no retrasar nada ni discutir.","Le digo que sí y lo agrego a la lista de pendientes, sin fecha."],"Gestionar el alcance es tan importante como programar. Todo cambio tiene un costo que debe quedar claro."],
  ["Un compañero te pide tu contraseña para terminar algo urgente mientras sales. ¿Qué haces?",["No la comparto; le ayudo a pedir un acceso temporal o lo resuelvo yo al regresar.","Le digo que no puedo y le sugiero que hable con el supervisor.","Se la doy, pero la cambio en cuanto regreso.","Dejo mi sesión abierta para que termine sin conocer la contraseña.","Se la paso por chat; es de confianza y es urgente."],"Las credenciales son personales. Dejar la sesión abierta es igual de riesgoso que compartir la contraseña."]],
 ind:[
  ["Ves que un compañero no usa su equipo de protección. ¿Qué haces?",["Se lo digo con respeto y, si sigue igual, lo reporto: la seguridad es de todos.","Le traigo el equipo del almacén para que se lo ponga en ese momento.","Le hago una seña; es adulto y sabe lo que hace.","Lo comento con el supervisor al final del turno.","No digo nada; si le pasa algo, es su responsabilidad."],"En la industria, un accidente puede cambiar una vida. La seguridad se atiende en el momento, no al final del turno."],
  ["La máquina empieza a hacer un ruido extraño a mitad del turno. ¿Qué haces?",["La detengo según el protocolo y aviso a mantenimiento y a mi supervisor.","Aviso a mi supervisor y espero su indicación antes de seguir.","Le bajo la velocidad y sigo hasta terminar el lote.","Reviso por mi cuenta dónde está el problema para no parar la línea.","Sigo trabajando; el ruido no siempre significa que haya falla."],"Parar a tiempo es más barato que una reparación mayor o un accidente. Reparar sin capacitación es un riesgo."],
  ["Te piden cumplir la meta aunque haya que saltarse un paso de calidad. ¿Qué haces?",["Explico el riesgo, propongo una alternativa para cumplir y no me salto el paso sin autorización por escrito.","Pregunto quién se hace responsable si el producto sale mal.","Lo hago esta vez porque es emergencia, y lo anoto en la bitácora.","Lo hago y reviso las piezas después, si queda tiempo.","Lo hago; si el supervisor lo pide, la responsabilidad es suya."],"La calidad y la seguridad no se negocian. Proponer soluciones te distingue."],
  ["Casi ocurre un accidente en tu área, pero nadie salió lastimado. ¿Qué haces?",["Lo reporto como incidente para que se revise la causa, aunque no haya habido lesionados.","Se lo comento a mi supervisor al final del turno.","Aviso a mis compañeros para que tengan más cuidado.","No lo reporto; si no pasó nada, no vale la pena el papeleo.","Lo dejo pasar para que no afecte el bono de días sin accidentes."],"Los «casi accidentes» son avisos. Reportarlos evita el accidente real."]],
 edu:[
  ["Un grupo no te hace caso durante una actividad. ¿Qué haces?",["Cambio la dinámica, acuerdo reglas claras con el grupo e involucro a quienes están más distraídos.","Hago una pausa, espero en silencio a que se calmen y retomo.","Subo la voz para recuperar la atención y sigo con la actividad.","Sigo con quienes sí ponen atención; los demás se pondrán al corriente.","Les dejo trabajo extra para la siguiente sesión como consecuencia."],"Gestionar grupos es central en educación y cultura: dinámicas y acuerdos antes que castigos."],
  ["Un cliente critica con dureza tu trabajo creativo. ¿Qué haces?",["Pregunto qué no le funciona en relación con su objetivo y propongo ajustes concretos.","Hago los cambios que pide lo más rápido posible.","Le explico mis decisiones de diseño para que entienda mi propuesta.","Le pido referencias de lo que sí le gusta y empiezo de cero.","Le ofrezco un descuento para compensar que no le gustó."],"Separar tu obra de tu persona te permite mejorar el trabajo sin romper la relación."],
  ["Te piden una entrega en un plazo imposible. ¿Qué haces?",["Negocio qué se puede entregar en ese plazo y qué quedaría después, y lo confirmo por escrito.","Aviso que está complicado, pero me comprometo a intentarlo.","Pido ayuda a un colega y dividimos el trabajo sin avisar al cliente.","Me desvelo los días que haga falta para cumplir.","Acepto y entrego lo que alcance, aunque no esté completo."],"Negociar el alcance es una habilidad profesional. Desvelarse como costumbre lleva al desgaste."],
  ["Usan una idea tuya en un proyecto y no te dan crédito. ¿Qué haces?",["Lo hablo en privado con la persona responsable y propongo que se reconozca a quienes participaron.","Guardo evidencia de mi trabajo y la muestro si se vuelve a presentar.","Lo dejo pasar esta vez; lo importante es que el proyecto salió bien.","Lo comento con mis compañeros para que sepan que fue mi idea.","Lo publico en redes para que todos sepan quién la tuvo."],"Defender tu trabajo en privado y con propuestas cuida la relación y tu reputación."]]
};

/* Misma URL de Web App, y el mismo par jsonp()/jsonpPost(), que ya usan

var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxZbLiOP7QXvrgUIDhhVciVGY-Yval3YBvqBHOpQfK8El2wHXNNBtZvsnkbwMaJUss/exec';
function jsonp(action, params, timeoutMs) {
  return new Promise(function (resolve) {
    var cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
    var url = WEB_APP_URL + '?action=' + encodeURIComponent(action) + '&callback=' + cbName;
    params = params || {};
    for (var k in params) {
      if (params[k] !== undefined && params[k] !== null) url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }
    var script = document.createElement('script');
    var cleaned = false;
    function cleanup() { if (cleaned) return; cleaned = true; delete window[cbName]; if (script.parentNode) script.parentNode.removeChild(script); }
    window[cbName] = function (data) { cleanup(); resolve(data); };
    script.onerror = function () { cleanup(); resolve({ ok: false, error: 'No se pudo conectar.' }); };
    setTimeout(function () { if (!cleaned) { cleanup(); resolve({ ok: false, error: 'Tardó demasiado en responder.' }); } }, timeoutMs || 25000);
    script.src = url;
    document.body.appendChild(script);
  });
}
function jsonpPost(action, params, timeoutMs) {
  return new Promise(function (resolve) {
    var timedOut = false;
    var timer = setTimeout(function () { timedOut = true; resolve({ ok: false, error: 'Tardó demasiado en responder.' }); }, timeoutMs || 25000);
    var body = { action: action };
    params = params || {};
    for (var k in params) { if (params[k] !== undefined && params[k] !== null) body[k] = params[k]; }
    fetch(WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (resp) { return resp.json(); })
      .then(function (data) { if (timedOut) return; clearTimeout(timer); resolve(data); })
      .catch(function () { if (timedOut) return; clearTimeout(timer); resolve({ ok: false, error: 'No se pudo conectar.' }); });
  });
}

    <label class="consent"><input type="checkbox" id="inConsent"> Autorizo a Sintropía Social a contactarme por correo para enviarme el resultado de esta simulación y, si aplica, información relacionada con sus servicios.</label>

  </section>`);
  document.getElementById("fIntake").addEventListener("submit",ev=>{

    if(!nombre)return mostrarErr("Escribe tu nombre.");
    if(!correo||!EMAIL_RE.test(correo))return mostrarErr("Escribe un correo electrónico válido.");
    if(!consent)return mostrarErr("Necesitamos tu autorización para poder enviarte el resultado.");
    S.lead={nombre,apellido,edad,correo,telefono,trampa,consent:true};
    jsonp("capturarInteresadoMuestra",{muestra:"Simulacion",nombre,apellido,email:correo,telefono,edad,
      consentimiento:"Sí",sitioWebTrampa:trampa,notas:"Simulación \"Tres puertas al trabajo\" — datos capturados antes de jugar."});
      /* no se espera la respuesta ni se bloquea el avance: si el registro
         del lead falla por red, la persona igual entra a jugar */
    alSiguiente();
  });
}
/* Envía el resultado de un módulo (entrevista o habilidades) por el mismo
   pipeline genérico de Muestras. No bloquea la pantalla de resultado: se
   dispara al mostrarla y sigue en segundo plano (igual que el resto del
   sitio) — si falla, la persona ya vio su resultado en pantalla igual. */
function enviarResultadoSimulacion(opts){
  if(!S.lead||!S.lead.correo)return; /* juego con token de proyecto, o sin intake: no se manda a Muestras */
  const ar=AREAS.find(a=>a.id===S.area);
  const resultados=[{nombre:opts.nombreModulo,puntaje:opts.puntaje,max:opts.max}];
  const secciones=(opts.secciones||[]).slice(0,12);
  const paramsIA={muestra:"Simulacion",email:S.lead.correo,nombre:S.lead.nombre,
    resultados:JSON.stringify(resultados),area:ar?ar.nom:"",dificultad:S.diff,
    resumenDecisiones:(opts.resumenDecisiones||"").slice(0,600),sitioWebTrampa:S.lead.trampa};
  /* GET (jsonp): solo alimenta la ampliación con IA en pantalla, mismo
     patrón que _iniciarCadenaIACorreo en muestra_imes.html — no bloquea. */
  jsonp("generarInterpretacionMuestra",paramsIA);
  /* POST (jsonpPost): valida y ENCOLA el envío del correo — el servidor
     genera su propia interpretación con IA en segundo plano a partir de
     paramsInterpretacionIA, así el correo sale completo aunque la persona
     cierre la ventana antes de que la llamada de arriba responda. */
  jsonpPost("enviarResultadoMuestra",{tipoMuestra:"Simulacion",correo:S.lead.correo,nombre:S.lead.nombre,
    tituloResultado:opts.tituloResultado,resumenTexto:opts.resumenTexto,
    secciones:JSON.stringify(secciones),paramsInterpretacionIA:JSON.stringify(paramsIA),
    sitioWebTrampa:S.lead.trampa});
}

/* ============ JUEGO 1: ENTREVISTA ============ */
function tokens(){
  const ar=AREAS.find(a=>a.id===S.area), t=SCEN[S.scen].tok, j=S.job;
  return {p:lc(j.n),a:lc(ar.nom),e:ar.co,lo:money(Math.round(j.s*.95/500)*500),hi:money(Math.round(j.s*1.1/500)*500),esc:t.esc,yo:t.yo};
}
const fill=(s,t)=>s.replace(/\{(\w+)\}/g,(m,k)=>t[k]??m);

function startEnt(){
  const ar=AREAS.find(a=>a.id===S.area), sc=S.scen[0];
  const N={bajo:10,medio:12,alto:15}[S.diff];
  const ok=q=>!q[0]||q[0]==="F"||q[0]==="L"||q[0].includes(sc);
  const pool=QG.filter(ok);
  const first=pool.find(q=>q[0]==="F"), last=pool.find(q=>q[0]==="L");
  const mid=pool.filter(q=>q[0]!=="F"&&q[0]!=="L");
  const imss=mid.find(q=>q[1].startsWith("Los primeros tres meses"));
  const rest=shuffle(mid.filter(q=>q!==imss));
  const areaQ=AQ[S.area].map(q=>["",...q]);
  let chosen=shuffle([imss,...areaQ,...rest.slice(0,N-2-1-areaQ.length)]);
  const qs=[first,...chosen,last];
  const g=Math.random()<.5?"f":"m";
  I={qs,i:0,pts:100,anger:0,calms:{bajo:3,medio:3,alto:2}[S.diff],answered:false,calming:false,boss:BOSS[g],bg:g,log:[],said:"Buenos días, toma asiento. Empecemos.",mult:{bajo:1,medio:1.25,alto:1.5}[S.diff],tk:tokens()};
  prepQ(); rEnt();
}
function prepQ(){const q=I.qs[I.i];I.opts=shuffle(q[2].map((t,k)=>({t:fill(t,I.tk),g:4-k})));I.q=fill(q[1],I.tk);I.tip=q[3]}
function estado(){const x=I.bg==="f";const a=I.anger;
  return a<30?(x?"Tranquila":"Tranquilo"):a<60?(x?"Impaciente":"Impaciente"):a<80?(x?"Molesta":"Molesto"):(x?"Muy molesta":"Muy molesto")}
function rEnt(){
  const pat=100-I.anger, col=pat>70?"var(--morado)":pat>40?"var(--naranja)":"var(--mal)";
  const quien=I.bg==="f"?"la entrevistadora":"el entrevistador";
  let body="";
  if(I.calming){
    body=`<div class="calmar"><h3>¿Qué le dices para calmar${I.bg==="f"?"la":"lo"}?</h3><div class="opciones" style="margin-top:0">
      ${I.calmOpts.map((o,k)=>`<button class="op" data-act="calmpick" data-v="${k}">${o.t}</button>`).join("")}</div>
      <button class="btn lnk" data-act="calmno" style="margin-top:8px">Mejor sigo con la entrevista</button></div>`;
  } else if(!I.answered){
    body=`<div class="opciones" role="group" aria-label="Respuestas">${I.opts.map((o,k)=>`<button class="op" data-act="ans" data-v="${k}">${o.t}</button>`).join("")}</div>`;
  } else {
    const L=I.last;
    const lab=["La peor opción","Respuesta débil","Respuesta regular","Buena respuesta, puede ser más concreta","La mejor respuesta"][L.g];
    body=`<div class="opciones">${I.opts.map((o,k)=>`<button class="op${k===L.k?" elegida":""}${o.g===4?" mejor":""}" disabled>${o.t}</button>`).join("")}</div>
    <div class="retro" aria-live="polite"><div class="cal g${L.g}">${lab}${L.pen?` (−${L.pen} puntos)`:""}</div><p class="tip">${I.tip}</p></div>
    <div class="fila" style="margin-top:14px"><button class="btn" data-act="sig">${I.pts<=30?"Ver resultado":I.i===I.qs.length-1?"Terminar entrevista":"Siguiente pregunta"}</button></div>`;
  }
  const calmBtn=(!I.calming&&I.anger>=30&&I.calms>0&&I.pts>30&&!(I.answered&&I.i===I.qs.length-1))
    ?`<button class="btn sec" data-act="calm" style="margin-top:14px">Calmar a ${quien} (${I.calms} ${I.calms===1?"intento":"intentos"})</button>`:"";
  paint(`<div class="hud">
    <div><small>Puntos</small><strong>${I.pts}</strong></div>
    <div><small>Pregunta</small><strong>${I.i+1} <span style="font-size:.8rem;color:var(--suave)">de ${I.qs.length}</span></strong></div>
    <div><small>Paciencia: ${estado()}</small><div class="barra"><i style="width:${pat}%;background:${col}"></i></div></div>
  </div>
  <div class="globo" id="globo"><p class="reac">${I.said}</p><h2 class="preg">${I.q}</h2></div>
  <div class="escena${I.anger>=60?" enojo":""}">
    <div class="personas">
      <div class="persona" id="boss">${avatarSVG(I.boss,{anger:I.anger/100,mood:I.anger<20?1:0})}<span>${I.boss.name}</span></div>
      <div class="persona">${avatarSVG(S.av,{mood:I.anger>60?-1:I.anger>30?0:1,sweat:I.anger>=55})}<span>${escH(S.av.name)}</span></div>
    </div><div class="escritorio"></div>
  </div>
  ${body}${calmBtn}`,I.i===0&&!I.answered);
}
const REAC={4:["Excelente, justo lo que buscamos.","Muy bien planteado.","Me gusta esa respuesta."],3:["Bien, aunque esperaba algo más concreto.","De acuerdo.","Correcto."],2:["Mmm... ya veo.","Esperaba algo más elaborado.","Ajá."],1:["No es lo que buscamos.","Eso me preocupa un poco.","(Anota algo en su libreta y frunce el ceño)"],0:["Le pido que se tome esto en serio.","(Suspira y mira el reloj)","Eso no ayuda nada, la verdad."]};
function ans(k){
  const o=I.opts[k], g=o.g;
  let pen=Math.round([14,10,6,3,0][g]*I.mult);
  if(I.anger>=70&&g<4)pen+=S.diff==="alto"?5:3;
  I.anger=clamp(I.anger+[26,18,11,4,-5][g]*I.mult,0,100);
  I.pts=Math.max(0,I.pts-pen);
  I.last={g,pen,k};I.answered=true;
  I.log.push({g,tip:I.tip,q:I.q});
  I.said=REAC[g][Math.floor(Math.random()*3)];
  rEnt();
  if(g<=1){const b=$("#boss");if(b){b.classList.add("vibra")}}
}
function sig(){
  if(I.pts<=30){return finEnt(true)}
  I.i++;
  if(I.i>=I.qs.length)return finEnt(false);
  I.answered=false;
  const pre=I.anger>=60?"(Con tono seco) ":I.anger>=30?"Sigamos. ":"";
  I.said=pre+["Siguiente pregunta.","Muy bien, continuemos.","Ahora dime:","Otra cosa:"][Math.floor(Math.random()*4)];
  prepQ();rEnt();
}
function calm(){I.calming=true;const set=CALM[Math.floor(Math.random()*CALM.length)];I.calmOpts=shuffle(set.map((t,k)=>({t,k})));rEnt()}
function calmPick(v){
  const k=I.calmOpts[v].k;I.calms--;I.calming=false;
  if(k===0){I.anger=clamp(I.anger-32,0,100);I.said="(Relaja los hombros) Está bien, te escucho.";}
  else if(k===1){I.anger=clamp(I.anger-10,0,100);I.said="Mmm, de acuerdo.";}
  else{I.anger=clamp(I.anger+15,0,100);I.pts=Math.max(0,I.pts-Math.round(5*I.mult));I.said="(Cruza los brazos) Eso no ayuda.";}
  if(I.pts<=30)return finEnt(true);
  rEnt();
}
function finEnt(perdio){
  const p=I.pts, ex=I.log.filter(l=>l.g===4).length;
  let v,t,mood;
  if(perdio){v="La entrevista terminó antes de tiempo";t=`Llegaste a ${p} puntos y ${I.bg==="f"?"la entrevistadora":"el entrevistador"} decidió cerrar la conversación. Revisa los consejos de abajo y vuelve a intentarlo.`;mood=-1}
  else if(p>=85){v="Te quedaste con el puesto";t=`Tus respuestas mostraron preparación, claridad y conocimiento de tus derechos. El puesto de ${lc(S.job.n)} es tuyo.`;mood=2}
  else if(p>=65){v="Pasas a la segunda entrevista";t="Vas por buen camino. Afina las respuestas en las que dudaste y llegarás mejor a la siguiente etapa.";mood=1}
  else{v="«Nosotros te llamamos»";t="Lograste terminar, pero tu perfil no convenció. La buena noticia: cada respuesta se puede practicar.";mood=0}
  const malas=I.log.filter(l=>l.g<=2).slice(0,4);
  paint(`<div class="final">
   <div class="fila" style="gap:18px;align-items:center"><div class="av" style="width:110px">${avatarSVG(S.av,{mood})}</div>
   <div><div class="cifra">${p}<small> de 100</small></div></div></div>
   <h2 style="margin-top:14px">${v}</h2>${acento}
   <p>${t}</p>
   <p class="nota" style="margin-top:8px">Respondiste ${ex} de ${I.log.length} preguntas con la mejor opción.</p>
   ${salarioHTML(p>=85&&!perdio)}
   ${malas.length?`<h3 style="margin-top:18px">Para practicar</h3><ul>${malas.map(m=>`<li><strong>${m.q}</strong> ${m.tip}</li>`).join("")}</ul>`:""}
  </div>${cta()}`);
  enviarResultadoSimulacion({
    nombreModulo:"Entrevista de trabajo",puntaje:p,max:100,
    tituloResultado:v,
    resumenTexto:`${v}. ${t} Respondió ${ex} de ${I.log.length} preguntas con la mejor opción.`,
    resumenDecisiones:malas.map(m=>m.q).slice(0,3).join(" / "),
    secciones:[{titulo:"Cómo le fue en la entrevista",parrafos:[t]}].concat(malas.length?[{titulo:"Para practicar",parrafos:malas.map(m=>m.q+" — "+m.tip)}]:[])
  });
}

/* ============ JUEGO 2: HABILIDADES ============ */
function startHab(){
  const ar=AREAS.find(a=>a.id===S.area);
  const L={};
  for(const k of ["h","c","a"])L[k]=shuffle([...parseSk(SKG[k]),...parseSk(ar.sk[k])]);
  H={L,sel:{h:[],c:[],a:[]},tab:"h"};
  rHab();
}
function rHab(){
  const tab=H.tab, tot=H.sel.h.length+H.sel.c.length+H.sel.a.length;
  paint(`<h2>Equipa a ${escH(S.av.name)} para su trabajo como ${lc(S.job.n)}</h2>${acento}
  <p class="lede">Elige 6 de cada eje. Todo suena útil, pero no todo protege tu bienestar.</p>

const MAXERR=4;

function startBurn(){
  const ar=AREAS.find(a=>a.id===S.area);
  const picks=[];for(const k of ["h","c","a"])H.sel[k].forEach(i=>picks.push({...H.L[k][i],eje:k}));
  const R=Math.round(picks.reduce((s,x)=>s+x.r,0)/54*100);
  const W=picks.reduce((s,x)=>s+x.w,0);
  const dm={bajo:.85,medio:1,alto:1.3}[S.diff];
  const strain=ar.st*(S.job.alto?1:1.1)*dm;
  const b=clamp(Math.round(50+W*2.5-(strain-1)*40),28,82);
  const d=clamp(Math.round(30+R*.6),30,88);
  const traps=picks.filter(x=>x.w<=-1);
  const chosen=new Set(picks.map(p=>p.n));
  const faltan=shuffle([...parseSk(ar.sk.h),...parseSk(ar.sk.c)].filter(x=>x.r===3&&!chosen.has(x.n)));
  const gap=R<66&&faltan.length?faltan[0].n:null;
  B={b,d,R,W,dm,strain,picks,traps,gap,stage:0,err:0,rectUsed:{b:[],d:[]},phase:"intro",log:[]};
  B.plan=planEtapas();
  rBurn();
}
/* Las habilidades y el área deciden qué focos rojos aparecen en cada etapa */
function planEtapas(){
  const used=new Set(), plan=[];
  const trapQ=[...new Set(shuffle(B.traps.map(t=>TRAMPA_SIT[t.n]).filter(Boolean)))];
  const libre=(k,s)=>!used.has(k)&&!SIT[k].ar&&k!=="eval"&&SIT[k].st.includes(s);
  for(let s=1;s<=5;s++){
    let pick=null;
    const pendientes=trapQ.filter(k=>!used.has(k));
    if(s%2===1||pendientes.length>2)pick=pendientes[0]||null;
    if(!pick&&s===3&&B.gap)pick="eval";
    if(!pick&&(s===2||s===4)&&Math.random()<.7){const k=S.area+(s===2?"1":"2");if(SIT[k])pick=k}
    if(!pick){const pool=Object.keys(SIT).filter(k=>libre(k,s));pick=pool[Math.floor(Math.random()*pool.length)]}
    if(!pick){const pool=Object.keys(SIT).filter(k=>!used.has(k)&&!SIT[k].ar&&k!=="eval");pick=pool[0]}
    used.add(pick);plan.push(pick);
  }
  return plan;
}
function tiredOf(b){return clamp((75-b)/60,0,1)}
function etiqueta(){return ETAPAS[Math.max(0,B.stage-1)]}
function vidas(){
  return `<div class="vidas" aria-label="Errores: ${B.err} de ${MAXERR} permitidos">${Array.from({length:MAXERR},(_,i)=>`<span class="${i<B.err?"usada":""}"></span>`).join("")}<em>${B.err===0?`Puedes equivocarte ${MAXERR} veces`:B.err<MAXERR?(MAXERR-B.err===1?"Te queda 1 error":`Te quedan ${MAXERR-B.err} errores`):"Un error más y termina tu carrera"}</em></div>`;
}
function estragosHTML(){
  if(!B.err)return "";
  return `<ul class="estragos">${ESTRAGOS.slice(0,Math.min(B.err,4)).map(e=>`<li>${e.t}</li>`).join("")}</ul>`;
}
function rBurn(){
  const b=B.b,d=B.d;
  const col=v=>v>=60?"var(--ok)":v>=35?"var(--naranja)":"var(--mal)";
  const med=`<div class="medidor"><small><span>Bienestar</span><span>${b}</span></small><div class="barra"><i style="width:${b}%;background:${col(b)}"></i></div></div>
   <div class="medidor"><small><span>Desempeño</span><span>${d}</span></small><div class="barra"><i style="width:${d}%;background:${col(d)}"></i></div></div>`;
  const ruta=`<ol class="ruta" aria-label="Etapas">${ETAPAS.map((e,i)=>{const n=i+1;const c=n<B.stage||(n===B.stage&&B.phase==="fb"&&B.next==="stage")?"hecha":n===B.stage?"actual":"";return `<li class="${c}">${e}</li>`}).join("")}</ol>`;
  const ret=`<div class="retrato"><div id="retav">${avatarSVG(S.av,{tired:tiredOf(b),dmg:B.err,mood:b>70?1:b>45?0:-1,sweat:b<35,slouch:true})}</div><p class="nota" style="margin-top:4px">${escH(S.av.name)} a los ${etiqueta()}</p>${vidas()}${estragosHTML()}${med}${ruta}</div>`;
  let main="";
  if(B.phase==="intro"){
    const est=b>=60?"Llega con energía, aunque ya se notan los primeros signos de cansancio.":b>=40?"Se ve cansancio acumulado: duerme poco y le cuesta concentrarse.":"Está al borde del agotamiento: irritabilidad, dolores y ganas de renunciar.";
    main=`<div class="situ"><div class="mes">Tres meses después</div><h3>Así se ve ${escH(S.av.name)} después de tres meses como ${lc(S.job.n)}</h3>
     <p>${est}</p><p class="nota" style="margin-top:8px">Tus elecciones le dieron un desempeño de ${d} y un bienestar de ${b}. Vienen cinco etapas: 3 meses, 11 meses, 1 año y medio, 2 años y medio y 4 años. En cada una aparece un foco rojo con tres caminos que suenan razonables.</p>
     <p class="nota" style="margin-top:8px">Puedes equivocarte hasta ${MAXERR} veces. Cada error deja una huella visible en ${escH(S.av.name)}, pero después de cada error tendrás la oportunidad de rectificar el camino.</p>
     <div class="fila" style="margin-top:14px"><button class="btn" data-act="bnext">Ver el primer foco rojo</button></div></div>`;
  } else if(B.phase==="sit"||B.phase==="rect"){
    const s=B.phase==="sit"?SIT[B.cur]:B.rect;
    const cab=B.phase==="sit"?`${ETAPAS[B.stage-1]}. Etapa ${B.stage} de 5`:`${ETAPAS[B.stage-1]}. Rectificar el camino`;
    main=`<div class="situ${B.phase==="rect"?" rect":""}"><div class="mes">${cab}</div><h3>${s.t}</h3><p>${fill(s.d,{form:SCEN[S.scen].tok.form,gap:B.gap||""})}</p>
      <p class="nota" style="margin-top:8px">${B.phase==="sit"?`¿Qué debería hacer ${escH(S.av.name)}?`:"Todavía puedes corregir el rumbo. ¿Qué hace ahora?"}</p>
      <div class="opciones">${B.opts.map((o,k)=>`<button class="op" data-act="bpick" data-v="${k}">${o.t}</button>`).join("")}</div></div>`;
  } else if(B.phase==="fb"){
    const L=B.last;
    const tit=L.rect?(L.k===0?"Rectificaste el camino":L.k===1?"Corrección a medias":"No lograste rectificar"):(L.k===0?"Buena decisión":L.k===1?"Decisión a medias":"Mala decisión");
    const btn=B.end?"Ver el final":B.next==="rect"?"Rectificar el camino":`Avanzar a ${ETAPAS[B.stage]}`;
    const huella=L.estrago?`<div class="huella"><strong>Nueva huella: ${L.estrago.t}.</strong> ${L.estrago.d}</div>`:"";
    main=`<div class="situ"><div class="mes">${ETAPAS[B.stage-1]}</div><h3>${tit}</h3><p>${L.f}</p>
      ${L.msg?`<p class="nota" style="margin-top:8px">${L.msg}</p>`:""}${huella}
      <div class="fila" style="margin-top:14px"><button class="btn" data-act="bnext">${btn}</button></div></div>`;
  }
  paint(`<div class="sim">${ret}<div>${main}</div></div>`,B.phase!=="fb");
  if(B.phase==="fb"&&B.last.estrago){const r=$("#retav");if(r)r.classList.add("vibra")}
}
function opcionesDe(s){return shuffle(s.o.map((t,k)=>({t,k,f:s.f[k]})))}
function bNext(){
  if(B.end)return finHab(B.end);
  if(B.next==="rect"){
    const tipo=B.rectTipo, pool=RECT[tipo].filter((_,i)=>!B.rectUsed[tipo].includes(i));
    const i=RECT[tipo].indexOf(pool.length?pool[Math.floor(Math.random()*pool.length)]:RECT[tipo][0]);
    B.rectUsed[tipo].push(i);B.rect=RECT[tipo][i];B.opts=opcionesDe(B.rect);B.phase="rect";B.next=null;return rBurn();
  }
  if(B.stage>0){
    /* El tiempo desgasta; las habilidades protectoras frenan el desgaste */
    const decay=Math.max(3,Math.round((9-B.W*.4)*B.strain));
    B.b=clamp(B.b-decay,0,100);
  }
  B.stage++;
  B.cur=B.plan[B.stage-1];
  B.opts=opcionesDe(SIT[B.cur]);
  B.phase="sit";rBurn();
}
function sumarError(tipo){
  B.err++;
  const estrago=ESTRAGOS[Math.min(B.err,5)-1];
  if(B.err>MAXERR)B.end=(tipo==="d"&&B.d<=B.b)||B.d<25?"despido":"terapia";
  return estrago;
}
function bPick(v){
  const o=B.opts[v], dm=B.dm, rect=B.phase==="rect";
  const s=rect?B.rect:SIT[B.cur];
  const tipo=rect?B.rectTipo:s.e;
  const rel=rect?[]:(s.sk||[]).filter(n=>B.picks.some(p=>p.n===n));
  const f=rel.length?.6:1;
  let msg="", estrago=null;
  B.end=null;
  if(o.k===0){
    if(rect){B.b+=12;B.d+=8;msg="Recuperas terreno, aunque las huellas que ya dejó el desgaste siguen ahí."}
    else{B.b+=14;B.d+=6;if(rel.length)msg=`Elegir «${rel[0]}» te ayudó a ver el camino.`}
  } else if(o.k===1){
    if(rect){B.b+=3;B.d+=2;msg="Frenas un poco el deterioro, pero no lo reviertes."}
    else{B.b-=Math.round(10*dm*f);B.d-=Math.round(6*dm*f);msg=rel.length?`«${rel[0]}» amortiguó parte del golpe.`:"Sigues, pero con menos energía para la siguiente etapa."}
  } else {
    if(tipo==="d"){B.d-=Math.round(14*dm*f);B.b-=Math.round(6*dm*f)}else{B.b-=Math.round(14*dm*f);B.d-=Math.round(5*dm*f)}
    estrago=sumarError(tipo);
    if(rel.length&&!B.end)msg=`«${rel[0]}» evitó que el golpe fuera mayor.`;
  }
  B.b=clamp(B.b,0,100);B.d=clamp(B.d,0,100);
  /* Después de un error en un foco rojo, se abre la rectificación; si no, se avanza de etapa */
  B.next=!B.end&&!rect&&o.k===2?"rect":"stage";
  if(B.next==="rect")B.rectTipo=s.e;
  if(!B.end&&B.next==="stage"&&B.stage===5)B.end=B.err===0||(B.b>=45&&B.err<=2)?"bienestar":"estragos";
  B.log.push({s:rect?null:B.cur,t:s.t,rect,k:o.k,etapa:B.stage});
  B.last={k:o.k,f:o.f,msg,rect,estrago};
  B.phase="fb";rBurn();
}

   ${salarioHTML()}

  tab:v=>{H.tab=v;rHab();$(".tabs").scrollIntoView({block:"nearest"})}, sk:v=>toggleSk(+v), trabajar:startBurn,
  bnext:bNext, bpick:v=>bPick(+v),
  again:()=>{S.jobs=null;setup()}
};
function trasAvatar(){
  /* En el flujo público (sin token), se pide el dato de contacto una sola
     vez, justo antes de entrar a los juegos — no antes de elegir avatar,
     para no interponer un formulario antes de que la persona ya esté
     interesada en jugar. */
  const seguir=()=>{if(S.pre){S.game=S.pre;S.jobs=null;setup()}else juegos()};
  if(!tieneToken()&&!S.lead)pantallaIntake(seguir);else seguir();
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t||t.disabled)return;const f=ACT[t.dataset.act];if(f)f(t.dataset.v,t)});
(function(){
  let q={};try{q=Object.fromEntries(new URLSearchParams(location.search))}catch(e){}
  if(SCEN[q.puerta]){S.scen=q.puerta;if(q.juego==="ent"||q.juego==="hab")S.pre=q.juego;avatars()}else home();
})();
</script>
