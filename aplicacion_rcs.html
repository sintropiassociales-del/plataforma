<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Reflexión de Color Sintropía (RCS) — ejercicio breve para candidatos de Reclutamiento y Selección, por Sintropía Social.">
<title>Reflexión de Color Sintropía — Sintropía Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #631EEB; --purple-dark: #4E17B8; --orange: #FF7929;
    --bg: #F5F3FC; --card: #FFFFFF; --text: #2C2C2C; --subtle: #6B6B78; --border: #E6E2F5;
    --error: #C0392B; --error-bg: #FDECEA; --ok: #1E8449; --ok-bg: #EAF7EE;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Open Sans', -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.55; }
  header.top { background: var(--purple); color: #fff; padding: 26px 18px 44px; text-align: center; border-radius: 0 0 22px 22px; }
  header.top .marca { font-size: 20px; font-weight: 800; letter-spacing: .3px; }
  header.top .marca span { color: var(--orange); }
  header.top .subt { font-size: 13.5px; opacity: .92; margin-top: 6px; max-width: 480px; margin-left: auto; margin-right: auto; }
  main { max-width: 700px; margin: -26px auto 40px; padding: 0 16px; }
  .card { background: var(--card); border-radius: 14px; padding: 26px 24px; margin-bottom: 16px; box-shadow: 0 6px 20px rgba(99,30,235,.08); border: 1px solid var(--border); }
  h1 { font-size: 21px; margin: 0 0 8px; }
  p.subtle, .subtle { color: var(--subtle); font-size: 13.5px; }
  .intro-caja { background: #FAF8FF; border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin: 14px 0; }
  .fila-botones { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
  button { font-family: inherit; font-size: 14.5px; font-weight: 700; border-radius: 999px; padding: 12px 24px; border: none; cursor: pointer; }
  button.primary { background: var(--purple); color: #fff; }
  button.primary:hover { background: var(--purple-dark); }
  button.secondary { background: #fff; color: var(--purple); border: 1.5px solid var(--purple); }
  button:disabled { opacity: .5; cursor: default; }
  .msg { padding: 10px 13px; border-radius: 9px; font-size: 13.5px; margin: 12px 0; }
  .msg.error { background: var(--error-bg); color: var(--error); }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .colores-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 18px 0; }
  .swatch { position: relative; aspect-ratio: 1; border-radius: 12px; cursor: pointer; border: 3px solid transparent;
    box-shadow: 0 2px 6px rgba(0,0,0,.12); transition: transform .1s, border-color .12s; }
  .swatch:hover { transform: scale(1.04); }
  .swatch.elegido { border-color: var(--purple-dark); }
  .swatch .badge { position: absolute; top: -8px; right: -8px; background: var(--purple); color: #fff; font-weight: 800;
    font-size: 13px; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 4px rgba(0,0,0,.25); }
  .orden-lista { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; min-height: 30px; }
  .orden-lista .pastilla { display: flex; align-items: center; gap: 6px; background: #fff; border: 1.5px solid var(--border);
    border-radius: 999px; padding: 4px 10px 4px 4px; font-size: 12.5px; font-weight: 600; }
  .orden-lista .pastilla .punto { width: 16px; height: 16px; border-radius: 50%; display: inline-block; }
  .pantalla-centrada { text-align: center; padding: 40px 10px; }
  .pantalla-centrada .icono { font-size: 44px; margin-bottom: 10px; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--purple); border-radius: 50%; animation: girar 0.8s linear infinite; margin: 20px auto; }
  @keyframes girar { to { transform: rotate(360deg); } }
  footer.pie { text-align: center; padding: 20px 16px 40px; font-size: 12px; color: var(--subtle); }
</style>
</head>
<body>

<header class="top">
  <div class="marca">Sintropía <span>Social</span></div>
  <div class="subt">Reflexión de Color Sintropía (RCS) — proceso de Reclutamiento y Selección</div>
</header>

<main>
  <div id="app" class="card">
    <div class="spinner"></div>
    <p class="subtle" style="text-align:center">Cargando...</p>
  </div>
</main>

<footer class="pie">Sintropía Social — tus respuestas se usan únicamente como apoyo dentro de tu proceso de selección.</footer>

<script>
var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxZbLiOP7QXvrgUIDhhVciVGY-Yval3YBvqBHOpQfK8El2wHXNNBtZvsnkbwMaJUss/exec';

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function jsonp(action, params) {
  return new Promise(function (resolve) {
    var cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
    var url = WEB_APP_URL + '?action=' + encodeURIComponent(action) + '&callback=' + cbName;
    params = params || {};
    for (var k in params) { if (params[k] !== undefined && params[k] !== null) url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }
    var script = document.createElement('script');
    var cleaned = false;
    function cleanup() { if (cleaned) return; cleaned = true; delete window[cbName]; if (script.parentNode) script.parentNode.removeChild(script); }
    window[cbName] = function (data) { cleanup(); resolve(data); };
    script.onerror = function () { cleanup(); resolve({ ok: false, error: 'No se pudo conectar. Revisa tu conexión a internet e intenta de nuevo.' }); };
    setTimeout(function () { if (!cleaned) { cleanup(); resolve({ ok: false, error: 'La plataforma tardó demasiado en responder. Intenta de nuevo.' }); } }, 25000);
    script.src = url;
    document.body.appendChild(script);
  });
}
function api(action, params) { params = params || {}; params.token = state.token; return jsonp(action, params); }

/* ============================================================
 * Los 8 colores del RCS — mismos nombres que RCS_COLORES en WebApp.gs
 * (el backend solo valida que el orden enviado sea una permutación de
 * estos 8 nombres; no hay algoritmo de calificación — ver la doc
 * "Baterías Psicométricas Sintropía (RyS)", pestaña 4). Se muestran
 * como recuadros de color SIN el nombre junto a cada uno, para no
 * sesgar la elección — el nombre solo se usa internamente al enviar.
 * ============================================================ */
var COLORES_RCS = [
  { nombre: 'Gris', hex: '#9CA3AF' },
  { nombre: 'Azul', hex: '#1D4ED8' },
  { nombre: 'Verde', hex: '#15803D' },
  { nombre: 'Rojo', hex: '#DC2626' },
  { nombre: 'Amarillo', hex: '#EAB308' },
  { nombre: 'Violeta', hex: '#7C3AED' },
  { nombre: 'Café', hex: '#78350F' },
  { nombre: 'Negro', hex: '#18181B' }
];

var qs = new URLSearchParams(location.search);
var state = { token: qs.get('token') || '', info: null, paso: 'cargando', orden: [] };
var app = document.getElementById('app');

function render() {
  if (state.paso === 'error') return renderError();
  if (state.paso === 'yaCompletado') return renderYaCompletado();
  if (state.paso === 'bienvenida') return renderBienvenida();
  if (state.paso === 'ordenando') return renderOrdenando();
  if (state.paso === 'enviando') return renderEnviando();
  if (state.paso === 'gracias') return renderGracias();
}
function renderError(msgTexto) {
  app.innerHTML = '<div class="pantalla-centrada"><div class="icono">⚠️</div><h1>No pudimos abrir este enlace</h1>' +
    '<p class="subtle">' + escapeHtml(msgTexto || 'Este enlace no es válido o ya no está disponible. Pide a tu contacto en Sintropía Social que te lo comparta de nuevo.') + '</p></div>';
}
function renderYaCompletado() {
  app.innerHTML = '<div class="pantalla-centrada"><div class="icono">✅</div><h1>Ya completaste este ejercicio</h1>' +
    '<p class="subtle">Gracias por tu participación — tu respuesta ya quedó registrada. Ya puedes cerrar esta ventana.</p></div>';
}
function renderBienvenida() {
  app.innerHTML =
    '<h1>Reflexión de Color Sintropía</h1>' +
    '<div class="intro-caja"><p style="margin:0 0 8px">Vas a ver 8 colores. Ordénalos del que más te gusta hoy al que menos te gusta hoy — no hay colores "correctos", y no hay forma de responder mal. Toma menos de 2 minutos.</p>' +
    '<p style="margin:0">Este orden no se califica: lo vamos a platicar directamente contigo en la entrevista.</p></div>' +
    '<p class="subtle">Este enlace es personal e intransferible y está vigente hasta el ' + escapeHtml(state.info.expira) + '.</p>' +
    '<div class="fila-botones"><button class="primary" id="btnComenzar">Comenzar</button></div>';
  document.getElementById('btnComenzar').onclick = function () { state.paso = 'ordenando'; render(); };
}
function renderEnviando() {
  app.innerHTML = '<div class="spinner"></div><p class="subtle" style="text-align:center">Enviando tu respuesta...</p>';
}
function renderGracias() {
  app.innerHTML = '<div class="pantalla-centrada"><div class="icono">🎉</div><h1>Gracias</h1>' +
    '<p class="subtle">Tu respuesta quedó guardada. El equipo de Sintropía Social la retomará en tu entrevista. Ya puedes cerrar esta ventana.</p></div>';
}

function renderOrdenando() {
  var listaHtml = state.orden.length === 0
    ? '<p class="subtle">Todavía no has elegido ningún color.</p>'
    : state.orden.map(function (nombre, i) {
        var c = COLORES_RCS.filter(function (x) { return x.nombre === nombre; })[0];
        return '<div class="pastilla"><span class="punto" style="background:' + c.hex + '"></span>' + (i + 1) + 'º</div>';
      }).join('');

  app.innerHTML =
    '<p class="subtle">Toca los colores en orden: primero el que más te gusta hoy, al final el que menos.</p>' +
    '<div id="secMsg"></div>' +
    '<div class="orden-lista">' + listaHtml + '</div>' +
    '<div class="colores-grid">' + COLORES_RCS.map(function (c) {
      var pos = state.orden.indexOf(c.nombre);
      return '<div class="swatch' + (pos > -1 ? ' elegido' : '') + '" data-color="' + c.nombre + '" style="background:' + c.hex + '" aria-label="' + c.nombre + '">' +
        (pos > -1 ? '<span class="badge">' + (pos + 1) + '</span>' : '') + '</div>';
    }).join('') + '</div>' +
    '<div class="fila-botones">' +
      '<button class="secondary" id="btnReiniciar">Reiniciar orden</button>' +
      '<button class="primary" id="btnFinalizar" ' + (state.orden.length < COLORES_RCS.length ? 'disabled' : '') + '>Finalizar</button>' +
    '</div>';

  app.querySelectorAll('.swatch').forEach(function (el) {
    el.onclick = function () {
      var nombre = el.getAttribute('data-color');
      var pos = state.orden.indexOf(nombre);
      if (pos > -1) { state.orden.splice(pos, 1); } else { state.orden.push(nombre); }
      renderOrdenando();
    };
  });
  document.getElementById('btnReiniciar').onclick = function () { state.orden = []; renderOrdenando(); };
  document.getElementById('btnFinalizar').onclick = async function () {
    if (state.orden.length < COLORES_RCS.length) return;
    await enviar();
  };
}

async function enviar() {
  state.paso = 'enviando'; render();
  var r = await api('enviarRCS', { orden: JSON.stringify(state.orden) });
  if (!r.ok) {
    state.paso = 'ordenando'; render();
    document.getElementById('secMsg').innerHTML = '<div class="msg error">' + escapeHtml(r.error || 'No se pudo enviar. Intenta de nuevo.') + '</div>';
    return;
  }
  state.paso = 'gracias'; render();
}

async function init() {
  if (!state.token) { state.paso = 'error'; render(); return; }
  var r = await api('infoRCS', {});
  if (!r.ok) { renderError(r.error); return; }
  state.info = r;
  state.paso = r.completado ? 'yaCompletado' : 'bienvenida';
  render();
}
init();
</script>
</body>
</html>
