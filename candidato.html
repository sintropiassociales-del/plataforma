<style>

    --ok: #1E8449;

  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  header.top {
    background: var(--purple); color: #fff; padding: 22px 18px 40px; text-align: center;

  header.top .subt { font-size: 13.5px; opacity: .9; margin-top: 4px; }
  main { max-width: 640px; margin: -24px auto 40px; padding: 0 16px; }
  .card {
    background: var(--card); border-radius: 14px; padding: 24px 22px; margin-bottom: 16px;
    box-shadow: 0 6px 20px rgba(99,30,235,.08); border: 1px solid var(--border);
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  h2 { font-size: 17px; margin: 0 0 4px; color: var(--purple-dark); }
  p.subtle, .subtle { color: var(--subtle); font-size: 13.5px; }
  .progreso { display: flex; gap: 6px; margin: 18px 0 22px; }
  .progreso .paso { flex: 1; height: 6px; border-radius: 4px; background: var(--border); }
  .progreso .paso.hecho { background: var(--orange); }
  .progreso .paso.actual { background: var(--purple); }
  label { display: block; font-size: 13.5px; font-weight: 600; margin: 14px 0 5px; }
  label .req { color: var(--orange); }
  input[type=text], input[type=date], input[type=number], input[type=email], select, textarea {
    width: 100%; padding: 11px 12px; border: 1.5px solid var(--border); border-radius: 9px;
    font-size: 15px; font-family: inherit; background: #fff; color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--purple); }
  textarea { min-height: 70px; resize: vertical; }
  .hint { font-size: 12px; color: var(--subtle); margin-top: 3px; }
  .fila-botones { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
  button {
    font-family: inherit; font-size: 14.5px; font-weight: 700; border-radius: 999px;
    padding: 12px 22px; border: none; cursor: pointer;
  }
  button.primary { background: var(--purple); color: #fff; }
  button.primary:hover { background: var(--purple-dark); }
  button.secondary { background: #fff; color: var(--purple); border: 1.5px solid var(--purple); }
  button.link { background: none; color: var(--purple); padding: 6px 4px; text-decoration: underline; }
  button:disabled { opacity: .55; cursor: default; }
  .msg { padding: 10px 13px; border-radius: 9px; font-size: 13.5px; margin: 12px 0; }
  .msg.error { background: var(--error-bg); color: var(--error); }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .integrante-card {
    border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;

  .integrante-acciones button { padding: 7px 12px; font-size: 12.5px; }
  .pantalla-centrada { text-align: center; padding: 40px 10px; }
  .pantalla-centrada .icono { font-size: 44px; margin-bottom: 10px; }
  footer { text-align: center; font-size: 12px; color: var(--subtle); padding: 10px 16px 30px; }

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function jsonp(action, params) {
  return new Promise(function (resolve) {
    var cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
    var url = WEB_APP_URL + '?action=' + encodeURIComponent(action) + '&callback=' + cbName;
    params = params || {};
    for (var k in params) {
      if (params[k] !== undefined && params[k] !== null) url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }
    var script = document.createElement('script');
    var cleaned = false;
    function cleanup() { if (cleaned) return; cleaned = true; delete window[cbName]; if (script.parentNode) script.parentNode.removeChild(script); }
    window[cbName] = function (data) { cleanup(); resolve(data); };
    script.onerror = function () { cleanup(); resolve({ ok: false, error: 'No se pudo conectar. Revisa tu conexión a internet e intenta de nuevo.' }); };
    setTimeout(function () { if (!cleaned) { cleanup(); resolve({ ok: false, error: 'La plataforma tardó demasiado en responder. Intenta de nuevo.' }); } }, 25000);
    script.src = url;
    document.body.appendChild(script);
  });
}
function api(action, params) {
  params = params || {};
  params.token = state.token;
  return jsonp(action, params);
}

function campoHtml(c, valorActual) {
  var v = valorActual == null ? '' : valorActual;
  var reqMark = c.requerido ? ' <span class="req">*</span>' : '';
  var out = '<label for="f_' + c.key + '">' + escapeHtml(c.label) + reqMark + '</label>';
  if (c.tipo === 'select') {
    out += '<select id="f_' + c.key + '"><option value="">Selecciona...</option>' +
      c.opciones.map(function (o) { return '<option value="' + escapeHtml(o) + '"' + (o === v ? ' selected' : '') + '>' + escapeHtml(o) + '</option>'; }).join('') +
      '</select>';
  } else if (c.tipo === 'textarea') {
    out += '<textarea id="f_' + c.key + '" placeholder="' + escapeHtml(c.placeholder || '') + '">' + escapeHtml(v) + '</textarea>';
  } else {
    out += '<input type="' + c.tipo + '" id="f_' + c.key + '" value="' + escapeHtml(v) + '" placeholder="' + escapeHtml(c.placeholder || '') + '">';
  }
  return out;
}

function leerCampos(campos) {
  var datos = {}, faltantes = [];
  campos.forEach(function (c) {
    var el = document.getElementById('f_' + c.key);
    var v = el ? el.value.trim() : '';
    if (c.requerido && !v) faltantes.push(c.label);
    datos[c.key] = v;
  });
  return { datos: datos, faltantes: faltantes };
}

// Igual que leerCampos, pero sin marcar nada como faltante — sirve para leer

// empleos anteriores del CSE-01, que solo son obligatorios hasta el número
// que el propio candidato declaró).
function leerCamposLibre(campos) {
  var datos = {};
  campos.forEach(function (c) {
    var el = document.getElementById('f_' + c.key);
    datos[c.key] = el ? el.value.trim() : '';
  });
  return datos;
}

function tieneMayusYMinusIncorrecto(texto) {
  var letras = String(texto || '').replace(/[^A-Za-zÁÉÍÓÚÑÜáéíóúñü]/g, '');
  if (letras.length < 4) return false; // muy corto para juzgar (iniciales, siglas, etc.)
  var mayus = letras.replace(/[^A-ZÁÉÍÓÚÑÜ]/g, '').length;
  var minus = letras.replace(/[^a-záéíóúñü]/g, '').length;
  return mayus === letras.length || minus === letras.length;
}

function correoValido(correo) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(correo || '').trim());
}

// clave: sección (se02..se06). datos: objeto key->valor ya leído.
// camposDefs: lista de field-defs de esa sección (para mostrar el label real).
// Devuelve un mensaje de error (string) o null si todo está bien.
function validarCandados(clave, datos, camposDefs) {
  if (clave === 'se02' && datos.correo && String(datos.correo).trim() && !correoValido(datos.correo)) {
    return 'El correo electrónico no parece válido — revísalo (ej. nombre@correo.com). Si te equivocaste de dominio (como "gmial.com" o "hotmial.com"), corrígelo antes de continuar.';
  }
  var claves = CAMPOS_MAYUSCULAS[clave] || [];
  for (var i = 0; i < claves.length; i++) {
    var v = datos[claves[i]];
    if (v && tieneMayusYMinusIncorrecto(v)) {
      var def = (camposDefs || []).filter(function (c) { return c.key === claves[i]; })[0];
      var nombreCampo = def ? def.label : claves[i];
      return 'Revisa el campo "' + nombreCampo + '": no lo escribas todo en MAYÚSCULAS ni todo en minúsculas — usa mayúsculas y minúsculas como en un texto normal.';
    }
  }
  return null;
}

function progresoHtml() {
  var total = SECCIONES.length;
  return '<div class="progreso">' + SECCIONES.map(function (s, i) {
    var cls = i < state.paso ? 'hecho' : (i === state.paso ? 'actual' : '');
    return '<div class="paso ' + cls + '" title="' + escapeHtml(s.paso) + '"></div>';
  }).join('') + '</div>';
}

async function init() {
  var params = new URLSearchParams(location.search);
  state.token = params.get('token') || '';
  if (!state.token) {
    app.innerHTML = '<div class="pantalla-centrada"><div class="icono">🔗</div><h1>Enlace incompleto</h1><p class="subtle">Este enlace no incluye la información necesaria. Pide a tu contacto en Sintropía Social que te lo vuelva a compartir.</p></div>';
    return;
  }
  app.innerHTML = '<p class="subtle">Cargando tu información...</p>';
  var r = await api('candidatoSEInfo', {});
  if (!r.ok) {
    app.innerHTML = '<div class="pantalla-centrada"><div class="icono">⚠️</div><h1>No pudimos abrir este enlace</h1><p class="subtle">' + escapeHtml(r.error || 'Ocurrió un error.') + '</p></div>';
    return;
  }
  state.info = r;
  if (r.datos.se02) state.registros.se02 = r.datos.se02;
  if (r.datos.se03) state.registros.se03 = r.datos.se03;
  if (r.datos.se05) state.registros.se05 = r.datos.se05;
  if (r.datos.se06) state.registros.se06 = r.datos.se06;
  state.se04Items = r.datos.se04 || [];
  renderBienvenida();
}

function renderBienvenida() {
  var info = state.info;
  var hayAvance = state.registros.se02 || state.registros.se03 || state.se04Items.length || state.registros.se05 || state.registros.se06;
  app.innerHTML =
    '<h1>Hola' + (info.nombreCandidato ? ', ' + escapeHtml(info.nombreCandidato.split(' ')[0]) : '') + '</h1>' +
    '<p class="subtle">Sintropía Social te invita a llenar tu propio estudio socioeconómico como parte de tu proceso con <b>' + escapeHtml(info.proyectoCliente) + '</b>. Toma entre 10 y 15 minutos. Puedes cerrar la ventana en cualquier momento y continuar después con el mismo enlace — nada se pierde.</p>' +
    '<p class="subtle">Este enlace es personal e intransferible, y está vigente hasta el ' + escapeHtml(info.expira) + '.</p>' +
    (info.completado ? '<div class="msg ok">Ya marcaste este formulario como terminado. Puedes revisarlo o corregir algo si lo necesitas.</div>' : '') +
    '<div class="fila-botones">' +
      '<button class="primary" id="btnComenzar">' + (hayAvance ? 'Continuar donde me quedé' : 'Comenzar') + '</button>' +
    '</div>';
  document.getElementById('btnComenzar').onclick = function () {
    // Retoma en la primera sección sin registro guardado (o la primera, si no hay ninguno).
    var siguiente = 0;
    for (var i = 0; i < SECCIONES.length; i++) {
      var s = SECCIONES[i];
      var tieneAvance = s.repetible ? state.se04Items.length > 0 : !!state.registros[s.clave];
      if (!tieneAvance) { siguiente = i; break; }
      siguiente = i + 1 <= SECCIONES.length - 1 ? i + 1 : i;
    }
    state.paso = hayAvance ? Math.min(siguiente, SECCIONES.length - 1) : 0;
    renderPaso();
  };
}

function renderPaso() {
  var sec = SECCIONES[state.paso];
  if (sec.repetible) { renderPasoSE04(); return; }
  if (sec.clave === 'se03') { renderPasoSE03(); return; }
  var registroActual = state.registros[sec.clave] || {};
  app.innerHTML =
    progresoHtml() +
    '<h2>' + escapeHtml(sec.titulo) + '</h2>' +
    '<p class="subtle" style="margin-top:0">' + escapeHtml(sec.intro) + '</p>' +
    '<div id="secMsg"></div>' +
    '<form id="secForm">' + sec.campos.map(function (c) { return campoHtml(c, registroActual[c.key]); }).join('') + '</form>' +
    '<div class="fila-botones">' +
      (state.paso > 0 ? '<button class="secondary" id="btnAtras">Atrás</button>' : '') +
      '<button class="primary" id="btnSiguiente">Guardar y continuar</button>' +
    '</div>';
  if (state.paso > 0) document.getElementById('btnAtras').onclick = function () { state.paso--; renderPaso(); };
  document.getElementById('btnSiguiente').onclick = function () { guardarSeccionActual(sec, registroActual.codigo); };
}

async function guardarSeccionActual(sec, codigoExistente) {
  var lectura = leerCampos(sec.campos);
  var msgBox = document.getElementById('secMsg');
  if (lectura.faltantes.length) {
    msgBox.innerHTML = '<div class="msg error">Falta completar: ' + escapeHtml(lectura.faltantes.join(', ')) + '.</div>';
    return;
  }
  var errorCandado = validarCandados(sec.clave, lectura.datos, sec.campos);
  if (errorCandado) { msgBox.innerHTML = '<div class="msg error">' + escapeHtml(errorCandado) + '</div>'; return; }
  var btn = document.getElementById('btnSiguiente');
  btn.disabled = true; btn.textContent = 'Guardando...';
  var payload = Object.assign({ instrumento: sec.clave }, lectura.datos);
  if (codigoExistente) payload.codigo = codigoExistente;
  var r = await api('candidatoSEGuardarFila', payload);
  btn.disabled = false; btn.textContent = 'Guardar y continuar';
  if (!r.ok) { msgBox.innerHTML = '<div class="msg error">' + escapeHtml(r.error || 'No se pudo guardar.') + '</div>'; return; }
  state.registros[sec.clave] = Object.assign({}, lectura.datos, { codigo: r.codigo });
  if (state.paso < SECCIONES.length - 1) { state.paso++; renderPaso(); }
  else { state.paso = SECCIONES.length; renderFin(); }
}

/* -------- SE-03: empleo actual + hasta 3 empleos anteriores -------- *
 * El bloque de "empleo actual" solo se pide (y solo es obligatorio) cuando
 * la situación laboral declarada es "Empleado/a" o "Trabajo informal". Los
 * bloques de empleos anteriores se muestran/exigen según lo que el propio
 * candidato declare en "¿Cuántos empleos anteriores has tenido?" — si tuvo
 * menos de 3, puede decirlo y avanzar sin inventar información. Sin el
 * contacto de referencia de cada empleo declarado, no se puede continuar. */
function renderPasoSE03() {
  var sec = SECCIONES[state.paso];
  var reg = state.registros.se03 || {};
  var idxCorte = -1;
  sec.campos.forEach(function (c, i) { if (c.key === 'referencia1' && idxCorte === -1) idxCorte = i; });
  var antes = sec.campos.slice(0, idxCorte);
  var despues = sec.campos.slice(idxCorte);

  var empleoActualHtml = CAMPOS_EMPLEO_ACTUAL_SE03.map(function (c) { return campoHtml(c, reg[c.key]); }).join('');
  var numEmpleosCampo = { key: 'numEmpleosAnteriores', label: '¿Cuántos empleos anteriores has tenido (sin contar el actual)?', tipo: 'select', opciones: CAT_NUM_EMPLEOS_ANTERIORES, requerido: true };
  var bloquesHtml = [1, 2, 3].map(function (n) {
    return '<div class="bloque-empleo-ant" data-bloque="' + n + '" style="display:none">' +
      '<h2 style="font-size:15px;margin:18px 0 2px">Empleo anterior ' + n + '</h2>' +
      bloqueEmpleoAnteriorSE03(n).map(function (c) { return campoHtml(c, reg[c.key]); }).join('') +
      '</div>';
  }).join('');

  app.innerHTML =
    progresoHtml() +
    '<h2>' + escapeHtml(sec.titulo) + '</h2>' +
    '<p class="subtle" style="margin-top:0">' + escapeHtml(sec.intro) + '</p>' +
    '<div id="secMsg"></div>' +
    '<form id="secForm">' +
      antes.map(function (c) { return campoHtml(c, reg[c.key]); }).join('') +
      '<h2 id="tituloEmpleoActual" style="font-size:15px;margin:18px 0 2px">Tu empleo actual</h2>' +
      '<div id="bloqueEmpleoActual">' + empleoActualHtml + '</div>' +
      '<h2 style="font-size:15px;margin:18px 0 2px">Empleos anteriores</h2>' +
      '<p class="hint" style="margin-top:-2px">Necesitamos poder confirmar tu experiencia laboral — por eso pedimos el contacto de tu empleo actual (si tienes) y de tus empleos anteriores, hasta un máximo de 3.</p>' +
      campoHtml(numEmpleosCampo, reg.numEmpleosAnteriores) +
      bloquesHtml +
      despues.map(function (c) { return campoHtml(c, reg[c.key]); }).join('') +
    '</form>' +
    '<div class="fila-botones">' +
      (state.paso > 0 ? '<button class="secondary" id="btnAtras">Atrás</button>' : '') +
      '<button class="primary" id="btnSiguiente">Guardar y continuar</button>' +
    '</div>';

  function actualizarVisibilidadSE03() {
    var elSituacion = document.getElementById('f_situacionLaboral');
    var conEmpleo = elSituacion && (elSituacion.value === 'Empleado/a' || elSituacion.value === 'Trabajo informal');
    document.getElementById('tituloEmpleoActual').style.display = conEmpleo ? '' : 'none';
    document.getElementById('bloqueEmpleoActual').style.display = conEmpleo ? '' : 'none';

    var n = document.getElementById('f_numEmpleosAnteriores').value;
    var requeridos = n === '3 o más' ? 3 : (parseInt(n, 10) || 0);
    [1, 2, 3].forEach(function (i) {
      var div = document.querySelector('.bloque-empleo-ant[data-bloque="' + i + '"]');
      if (div) div.style.display = i <= requeridos ? '' : 'none';
    });
  }
  document.getElementById('f_situacionLaboral').addEventListener('change', actualizarVisibilidadSE03);
  document.getElementById('f_numEmpleosAnteriores').addEventListener('change', actualizarVisibilidadSE03);
  actualizarVisibilidadSE03();

  if (state.paso > 0) document.getElementById('btnAtras').onclick = function () { state.paso--; renderPaso(); };
  document.getElementById('btnSiguiente').onclick = function () { guardarSeccionSE03(reg.codigo); };
}

async function guardarSeccionSE03(codigoExistente) {
  var sec = SECCIONES[state.paso];
  var msgBox = document.getElementById('secMsg');
  var lecturaBase = leerCampos(sec.campos);
  var faltantes = lecturaBase.faltantes.slice();

  var conEmpleo = lecturaBase.datos.situacionLaboral === 'Empleado/a' || lecturaBase.datos.situacionLaboral === 'Trabajo informal';
  var datosActual = leerCamposLibre(CAMPOS_EMPLEO_ACTUAL_SE03);
  if (conEmpleo) {
    CAMPOS_EMPLEO_ACTUAL_SE03.forEach(function (c) { if (!datosActual[c.key]) faltantes.push(c.label); });
  }

  var n = document.getElementById('f_numEmpleosAnteriores').value;
  if (!n) faltantes.push('¿Cuántos empleos anteriores has tenido?');
  var requeridos = n === '3 o más' ? 3 : (parseInt(n, 10) || 0);
  var datosAnt = {}, camposAntTodos = [];
  for (var i = 1; i <= 3; i++) {
    var camposBloque = bloqueEmpleoAnteriorSE03(i);
    camposAntTodos = camposAntTodos.concat(camposBloque);
    var datosBloque = leerCamposLibre(camposBloque);
    Object.assign(datosAnt, datosBloque);
    if (i <= requeridos) {
      camposBloque.forEach(function (c) { if (!datosBloque[c.key]) faltantes.push(c.label); });
    }
  }

  if (faltantes.length) {
    msgBox.innerHTML = '<div class="msg error">Falta completar: ' + escapeHtml(faltantes.join(', ')) + '.</div>';
    return;
  }

  var datosCompletos = Object.assign({}, lecturaBase.datos, datosActual, { numEmpleosAnteriores: n }, datosAnt);
  var camposDefsCompletos = sec.campos.concat(CAMPOS_EMPLEO_ACTUAL_SE03).concat(camposAntTodos);
  var errorCandado = validarCandados('se03', datosCompletos, camposDefsCompletos);
  if (errorCandado) { msgBox.innerHTML = '<div class="msg error">' + escapeHtml(errorCandado) + '</div>'; return; }

  var btn = document.getElementById('btnSiguiente');
  btn.disabled = true; btn.textContent = 'Guardando...';
  var payload = Object.assign({ instrumento: 'se03' }, datosCompletos);
  if (codigoExistente) payload.codigo = codigoExistente;
  var r = await api('candidatoSEGuardarFila', payload);
  btn.disabled = false; btn.textContent = 'Guardar y continuar';
  if (!r.ok) { msgBox.innerHTML = '<div class="msg error">' + escapeHtml(r.error || 'No se pudo guardar.') + '</div>'; return; }
  state.registros.se03 = Object.assign({}, datosCompletos, { codigo: r.codigo });
  if (state.paso < SECCIONES.length - 1) { state.paso++; renderPaso(); }
  else { state.paso = SECCIONES.length; renderFin(); }
}

/* -------- SE-04: sección repetible (varios integrantes del hogar) -------- */
function renderPasoSE04() {
  var sec = SECCIONES[state.paso];
  var listaHtml = state.se04Items.length === 0
    ? '<p class="subtle">Todavía no has agregado a nadie.</p>'
    : state.se04Items.map(function (it) {
        return '<div class="integrante-card"><div class="info"><b>' + escapeHtml(it.nombreIntegrante) + '</b>' +
          '<span>' + escapeHtml(it.parentesco) + ' · ' + escapeHtml(it.edad) + ' años · ' + escapeHtml(it.ocupacion) + '</span></div>' +
          '<div class="integrante-acciones">' +
            '<button class="secondary btnEditarIntegrante" data-codigo="' + escapeHtml(it.codigo) + '">Editar</button> ' +
            '<button class="secondary btnQuitarIntegrante" data-codigo="' + escapeHtml(it.codigo) + '">Quitar</button>' +
          '</div></div>';
      }).join('');

  app.innerHTML =
    progresoHtml() +
    '<h2>' + escapeHtml(sec.titulo) + '</h2>' +
    '<p class="subtle" style="margin-top:0">' + escapeHtml(sec.intro) + '</p>' +
    '<div id="secMsg"></div>' +
    '<div id="listaIntegrantes">' + listaHtml + '</div>' +
    '<div class="fila-botones"><button class="secondary" id="btnAgregarIntegrante">+ Agregar integrante</button></div>' +
    '<div id="formIntegrante"></div>' +
    '<div class="fila-botones" style="margin-top:22px">' +
      (state.paso > 0 ? '<button class="secondary" id="btnAtras">Atrás</button>' : '') +
      '<button class="primary" id="btnSiguiente">Continuar</button>' +
    '</div>';

  if (state.paso > 0) document.getElementById('btnAtras').onclick = function () { state.paso--; renderPaso(); };
  document.getElementById('btnSiguiente').onclick = function () {
    if (state.paso < SECCIONES.length - 1) { state.paso++; renderPaso(); }
    else { state.paso = SECCIONES.length; renderFin(); }
  };
  document.getElementById('btnAgregarIntegrante').onclick = function () { abrirFormIntegrante(null); };
  Array.prototype.forEach.call(document.querySelectorAll('.btnEditarIntegrante'), function (b) {
    b.onclick = function () {
      var it = state.se04Items.filter(function (x) { return x.codigo === b.getAttribute('data-codigo'); })[0];
      abrirFormIntegrante(it);
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.btnQuitarIntegrante'), function (b) {
    b.onclick = async function () {
      if (!confirm('¿Quitar a esta persona de tu composición familiar?')) return;
      var r = await api('candidatoSEEliminarFila', { instrumento: 'se04', codigo: b.getAttribute('data-codigo') });
      if (!r.ok) { alert(r.error); return; }
      state.se04Items = state.se04Items.filter(function (x) { return x.codigo !== b.getAttribute('data-codigo'); });
      renderPasoSE04();
    };
  });
}

function abrirFormIntegrante(itExistente) {
  var sec = SECCIONES[state.paso];
  var caja = document.getElementById('formIntegrante');
  caja.innerHTML =
    '<div class="card" style="margin-top:14px;box-shadow:none;background:#FAF8FF">' +
    '<div id="integranteMsg"></div>' +
    '<form id="formIntegranteForm">' + sec.campos.map(function (c) { return campoHtml(c, itExistente ? itExistente[c.key] : ''); }).join('') + '</form>' +
    '<div class="fila-botones">' +
      '<button class="secondary" id="btnCancelarIntegrante">Cancelar</button>' +
      '<button class="primary" id="btnGuardarIntegrante">' + (itExistente ? 'Guardar cambios' : 'Agregar') + '</button>' +
    '</div></div>';
  document.getElementById('btnCancelarIntegrante').onclick = function () { caja.innerHTML = ''; };
  document.getElementById('btnGuardarIntegrante').onclick = async function () {
    var lectura = leerCampos(sec.campos);
    var msgBox = document.getElementById('integranteMsg');
    if (lectura.faltantes.length) { msgBox.innerHTML = '<div class="msg error">Falta completar: ' + escapeHtml(lectura.faltantes.join(', ')) + '.</div>'; return; }
    var errorCandado = validarCandados('se04', lectura.datos, sec.campos);
    if (errorCandado) { msgBox.innerHTML = '<div class="msg error">' + escapeHtml(errorCandado) + '</div>'; return; }
    var btn = document.getElementById('btnGuardarIntegrante');
    btn.disabled = true; btn.textContent = 'Guardando...';
    var payload = Object.assign({ instrumento: 'se04' }, lectura.datos);
    if (itExistente) payload.codigo = itExistente.codigo;
    var r = await api('candidatoSEGuardarFila', payload);
    btn.disabled = false; btn.textContent = itExistente ? 'Guardar cambios' : 'Agregar';
    if (!r.ok) { msgBox.innerHTML = '<div class="msg error">' + escapeHtml(r.error || 'No se pudo guardar.') + '</div>'; return; }
    var registro = Object.assign({}, lectura.datos, { codigo: r.codigo });
    if (itExistente) {
      state.se04Items = state.se04Items.map(function (x) { return x.codigo === r.codigo ? registro : x; });
    } else {
      state.se04Items.push(registro);
    }
    renderPasoSE04();
  };
}

async function renderFin() {
  app.innerHTML =
    progresoHtml() +
    '<div class="pantalla-centrada"><div class="icono">✅</div><h1>¡Listo!</h1>' +
    '<p class="subtle">Revisamos que toda la información obligatoria esté completa. Cuando estés seguro/a de tus respuestas, presiona "Finalizar" para avisarle al equipo de Sintropía que terminaste.</p></div>' +
    '<div id="finMsg"></div>' +
    '<div class="fila-botones" style="justify-content:center">' +
      '<button class="secondary" id="btnRevisar">Revisar mis respuestas</button>' +
      '<button class="primary" id="btnFinalizar">Finalizar</button>' +
    '</div>';
  document.getElementById('btnRevisar').onclick = function () { state.paso = 0; renderPaso(); };
  document.getElementById('btnFinalizar').onclick = async function () {
    var btn = document.getElementById('btnFinalizar');
    btn.disabled = true; btn.textContent = 'Enviando...';
    var r = await api('candidatoSEFinalizar', {});
    btn.disabled = false; btn.textContent = 'Finalizar';
    var msgBox = document.getElementById('finMsg');
    if (!r.ok) { msgBox.innerHTML = '<div class="msg error">' + escapeHtml(r.error || 'No se pudo finalizar.') + '</div>'; return; }
    app.innerHTML = '<div class="pantalla-centrada"><div class="icono">🎉</div><h1>Gracias</h1><p class="subtle">Tus respuestas quedaron guardadas. El equipo de Sintropía Social se pondrá en contacto contigo con los siguientes pasos. Ya puedes cerrar esta ventana.</p></div>';
  };
}

init();
</script>
