async function abrirModalEnviarCorreo(tipo, codigos) {
  var esClientes = tipo === 'clientes';
  var cfg = esClientes ? CRM_TIPOS.crm_clientes : CRM_TIPOS.crm_interesados;
  var todos = esClientes ? state.crmClientes : state.crmInteresados;
  var campoEmail = esClientes ? 'correo' : 'email';
  var campoNombre = esClientes ? 'organizacion' : 'nombre';

  var campos = cfg.campos.map(function (c) {
    return { key: c.key, tag: c.label.replace(/\s*\*$/, '').trim() };
  });

  var registros = todos.filter(function (r) { return codigos.indexOf(r.codigo) !== -1; });
  var conCorreo = registros.filter(function (r) { return String(r[campoEmail] || '').indexOf('@') !== -1; });
  var sinCorreoCount = registros.length - conCorreo.length;

  var listaNombres = registros.map(function (r) {
    var nombre = esClientes ? r.organizacion : ((r.nombre || '') + ' ' + (r.apellido || '')).trim();
    var tieneCorreo = String(r[campoEmail] || '').indexOf('@') !== -1;
    return escapeHtml(nombre) + (tieneCorreo ? '' : ' <span class="subtle">(sin correo)</span>');
  }).join(', ');

  var chipsHtml = campos.map(function (c) {
    return '<button type="button" class="small secondary tagchip" data-tag="' + escapeHtml('<<' + c.tag + '>>') + '" style="margin:2px">' +
      escapeHtml(c.tag) + '</button>';
  }).join('');

  var botonesRteHtml = BOTONES_RTE_CORREO.map(function (b, i) {
    return '<button type="button" class="small secondary btnRte" data-idx="' + i + '" title="' + escapeHtml(b.titulo) + '" style="margin:0 3px 3px 0">' + b.icono + '</button>';
  }).join('');

  var modal = el(
    '<div class="modal-bg"><div class="modal wide">' +
      '<h2>Enviar correo — ' + registros.length + ' destinatario(s)</h2>' +
      '<p class="subtle">' + listaNombres + '</p>' +
      (sinCorreoCount ? '<div class="msg error">' + sinCorreoCount + ' destinatario(s) no tienen correo registrado y no recibirán el mensaje.</div>' : '') +
      '<div class="toolbar" style="justify-content:space-between;gap:8px;flex-wrap:wrap">' +
        '<label style="margin:0">Plantilla</label>' +
        '<select id="correoPlantillaSel" style="width:auto;flex:1;min-width:160px"><option value="">(ninguna — correo nuevo)</option></select>' +
        '<button class="small secondary" id="btnGuardarPlantilla">Guardar como plantilla</button>' +
        '<button class="small secondary" id="btnBorrarPlantilla" style="display:none">Eliminar plantilla</button>' +
        '<button class="small primary" id="btnAbrirIA" style="margin-left:auto">✨ Generar con IA</button>' +
      '</div>' +
      '<div id="panelIA" style="display:none;background:#F4F0FE;border-radius:8px;padding:12px 14px;margin:8px 0">' +
        '<label style="margin-top:0">Descríbele a la IA qué quieres decir en este correo</label>' +
        '<textarea id="iaInstruccion" rows="2" placeholder="Ej: invita a los interesados en Empleo a un taller gratuito el 10 de septiembre en línea"></textarea>' +
        '<div id="iaMsg"></div>' +
        '<div class="fila-botones" style="display:flex;gap:8px;margin-top:8px">' +
          '<button class="small secondary" id="btnCancelarIA">Cancelar</button>' +
          '<button class="small primary" id="btnGenerarIA">Generar borrador</button>' +
        '</div>' +
      '</div>' +
      '<label>Asunto</label><input type="text" id="correoAsunto" placeholder="Ej: Novedades de <<Organización>>">' +
      '<label>Cuerpo del correo</label>' +
      '<div style="border:1.5px solid #ddd;border-radius:8px 8px 0 0;padding:6px;background:#fafafa">' + botonesRteHtml + '</div>' +
      '<div id="correoCuerpo" contenteditable="true" style="border:1.5px solid #ddd;border-top:none;border-radius:0 0 8px 8px;min-height:150px;padding:10px 12px;font-size:14px;line-height:1.5" data-placeholder="Hola <<Nombre de contacto>>, te escribimos de Sintropía Social..."></div>' +
      '<p class="subtle" style="margin:8px 0 4px">Clic para insertar una etiqueta donde tengas el cursor — se reemplaza por el dato real de cada destinatario:</p>' +
      '<div>' + chipsHtml + '</div>' +
      '<div id="correoVistaPrevia" style="margin-top:14px"></div>' +
      '<div id="correoMsg"></div>' +
      '<div class="modal-actions">' +
        '<button class="secondary" id="correoCancelar">Cerrar</button>' +
        '<button class="primary" id="correoEnviar">Enviar correo</button>' +

  var asuntoInput = modal.querySelector('#correoAsunto');
  var cuerpoDiv = modal.querySelector('#correoCuerpo');

  asuntoInput.addEventListener('focus', function () { campoActivo = asuntoInput; });
  cuerpoDiv.addEventListener('focus', function () { campoActivo = cuerpoDiv; });
  cuerpoDiv.addEventListener('mouseup', guardarRango);
  cuerpoDiv.addEventListener('keyup', guardarRango);
  function guardarRango() {
    var sel = window.getSelection();
    if (sel.rangeCount && cuerpoDiv.contains(sel.anchorNode)) rangoGuardado = sel.getRangeAt(0).cloneRange();
  }
  function restaurarRango() {
    if (!rangoGuardado) return;
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(rangoGuardado);
  }

  Array.prototype.forEach.call(modal.querySelectorAll('.tagchip'), function (chip) {

        var fin = asuntoInput.selectionEnd != null ? asuntoInput.selectionEnd : asuntoInput.value.length;
        var val = asuntoInput.value;
        asuntoInput.value = val.slice(0, inicio) + tag + val.slice(fin);
        asuntoInput.focus();
      } else {
        cuerpoDiv.focus();
        restaurarRango();
        document.execCommand('insertText', false, tag);

  modal.querySelector('#btnBorrarPlantilla').onclick = async function () {

  modal.querySelector('#correoEnviar').onclick = async function () {

    var cuerpo = cuerpoDiv.innerHTML.trim();
    if (!asunto) { msgBox.innerHTML = '<div class="msg error">Falta el asunto del correo.</div>'; return; }

    var r = await api('enviarCorreoCRM', { tipo: tipo, codigos: codigos, asunto: asunto, cuerpo: cuerpo });
    btn.disabled = false; btn.textContent = 'Enviar correo';

    if (!r.ok) { msgBox.innerHTML = '<div class="msg error">' + escapeHtml(r.error || 'No se pudo enviar.') + '</div>'; return; }

    var partes = ['Enviados: ' + r.enviados + '.'];
    if (r.sinCorreo && r.sinCorreo.length) partes.push('Sin correo registrado: ' + r.sinCorreo.length + '.');
    if (r.noEncontrados && r.noEncontrados.length) partes.push('No encontrados: ' + r.noEncontrados.length + '.');
    if (r.fallidos && r.fallidos.length) partes.push('Fallidos: ' + r.fallidos.length + ' (revisa la cuota diaria de correo si son muchos).');
    msgBox.innerHTML = '<div class="msg ok">' + escapeHtml(partes.join(' ')) + '</div>';

    if (esClientes) {
      state.crmClientesSeleccion = [];
      await cargarCRMClientes();
    } else {
      state.crmInteresadosSeleccion = [];
      await cargarCRMInteresados();
    }
  };
}

/* ---------------- USUARIOS (solo Administrador) ---------------- */
async function cargarUsuarios() {
  var r = await api('listarUsuarios', {});
  if (r.ok) state.usuarios = r.data;
}

async function renderUsuarios() {
  await cargarUsuarios();
  var main = document.getElementById('main');
  var filas = state.usuarios.map(function (u) {
    return '<tr>' +
      '<td>' + escapeHtml(u.nombre) + '</td>' +
      '<td>' + escapeHtml(u.email) + '</td>' +
      '<td><span class="badge ' + (u.rol === 'Administrador' ? 'admin' : 'operativo') + '">' + u.rol + '</span></td>' +
      '<td><span class="badge ' + (u.estado === 'Activo' ? 'activo' : 'inactivo') + '">' + u.estado + '</span></td>' +
      '<td>' +
        '<button class="small secondary" data-accion="toggle" data-email="' + escapeHtml(u.email) + '" data-estado="' + u.estado + '">' +
          (u.estado === 'Activo' ? 'Desactivar' : 'Activar') + '</button> ' +
        '<button class="small secondary" data-accion="reset" data-email="' + escapeHtml(u.email) + '">Restablecer contraseña</button>' +
      '</td>' +
    '</tr>';
  }).join('');

  main.innerHTML =
    '<div class="card">' +
      '<div class="toolbar" style="justify-content:space-between">' +
        '<h2 style="margin:0">Usuarios de la plataforma</h2>' +
        '<button class="secondary" id="btnNuevoUsuario">+ Nuevo usuario</button>' +
      '</div>' +
      '<p class="subtle">Máximo recomendado: 5 cuentas operativas + tu cuenta de administrador.</p>' +
      '<table><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th></th></tr></thead><tbody>' + filas + '</tbody></table>' +
    '</div>';

  document.getElementById('btnNuevoUsuario').onclick = abrirModalNuevoUsuario;
  Array.prototype.forEach.call(main.querySelectorAll('[data-accion="toggle"]'), function (b) {
    b.onclick = async function () {
      var nuevoEstado = b.getAttribute('data-estado') === 'Activo' ? 'Inactivo' : 'Activo';
      var r = await api('cambiarEstadoUsuario', { email: b.getAttribute('data-email'), estado: nuevoEstado });
      if (!r.ok) { alert(r.error); return; }
      renderUsuarios();
    };
  });
  Array.prototype.forEach.call(main.querySelectorAll('[data-accion="reset"]'), function (b) {
    b.onclick = async function () {
      if (!confirm('¿Restablecer la contraseña de ' + b.getAttribute('data-email') + '? Se generará una temporal y se le enviará por correo.')) return;
      var r = await api('restablecerPasswordUsuario', { email: b.getAttribute('data-email') });
      if (!r.ok) { alert(r.error); return; }
      alert('Contraseña restablecida.\nContraseña temporal: ' + r.tempPassword + '\n\n(También se envió por correo, si el envío fue posible).');
    };
  });
}

function abrirModalNuevoUsuario() {
  var modal = el(
    '<div class="modal-bg"><div class="modal">' +
      '<h2>Nuevo usuario</h2>' +
      '<label>Nombre *</label><input type="text" id="nuNombre">' +
      '<label>Correo *</label><input type="email" id="nuEmail">' +
      '<label>Rol</label><select id="nuRol"><option value="Operativo">Operativo</option><option value="Administrador">Administrador</option></select>' +
      '<p class="subtle">Se genera una contraseña temporal y se envía por correo (si el envío es posible); la persona deberá cambiarla desde "Mi cuenta".</p>' +
      '<div id="nuMsg"></div>' +
      '<div class="modal-actions">' +
        '<button class="secondary" id="nuCancelar">Cancelar</button>' +
        '<button class="primary" id="nuGuardar">Crear usuario</button>' +
      '</div>' +
    '</div></div>'
  );
  document.body.appendChild(modal);
  modal.querySelector('#nuCancelar').onclick = function () { modal.remove(); };
  modal.querySelector('#nuGuardar').onclick = async function () {
    var nombre = modal.querySelector('#nuNombre').value.trim();
    var email = modal.querySelector('#nuEmail').value.trim();
    var msgBox = modal.querySelector('#nuMsg');
    if (!nombre || !email) { msgBox.innerHTML = '<div class="msg error">Nombre y correo son obligatorios.</div>'; return; }
    var btn = modal.querySelector('#nuGuardar');
    btn.disabled = true; btn.textContent = 'Creando...';
    var r = await api('crearUsuario', { nombre: nombre, email: email, rol: modal.querySelector('#nuRol').value });
    if (!r.ok) { msgBox.innerHTML = '<div class="msg error">' + r.error + '</div>'; btn.disabled = false; btn.textContent = 'Crear usuario'; return; }
    modal.remove();
    alert('Usuario creado.\nContraseña temporal: ' + r.tempPassword + '\n\n(También se envió por correo, si el envío fue posible).');
    renderUsuarios();
  };
}

/* ---------------- INSTRUMENTOS (solo Administrador) ---------------- */
function renderInstrumentos() {
  var main = document.getElementById('main');
  var familiasDisponibles = _familiasConInstalables();
  if (!state.familiaInstrumentosActiva || familiasDisponibles.indexOf(state.familiaInstrumentosActiva) === -1) {
    state.familiaInstrumentosActiva = familiasDisponibles[0];
  }

  var familiasHtml = familiasDisponibles.map(function (f) {
    return '<button data-fam="' + f + '" class="' + (state.familiaInstrumentosActiva === f ? 'active' : '') + '">' + FAMILIAS[f] + '</button>';
  }).join('');

  var filas = _instalablesDeFamilia(state.familiaInstrumentosActiva).map(function (i) {
    var puedeExportar = i.especial || (i.tipos && i.tipos.length);
    var notaExtra = (i.clave === 'CRM')
      ? ' Una vez instalada, no se administra desde aquí ni desde "Proyectos": aparece en su propia pestaña "Clientes" en el menú superior (solo visible para Administrador).'
      : '';
    return '<div class="card" style="margin-bottom:10px">' +
      '<div class="toolbar" style="justify-content:space-between">' +
        '<div><strong>' + i.nombre + '</strong>' +
          '<p class="subtle" style="margin:4px 0 0">Crea la pestaña de datos en el Sheet — solo hace falta una vez, ya nunca hay que volver a Apps Script para esto.' + notaExtra + '</p></div>' +
        '<div style="display:flex;gap:8px;flex-shrink:0">' +
          (puedeExportar ? '<button class="secondary" data-exportar="' + i.clave + '">Descargar instrumento vacío</button>' : '') +
          '<button class="secondary" data-clave="' + i.clave + '">Instalar pestaña de datos</button>' +
        '</div>' +
      '</div>' +
      '<div id="instMsg_' + i.clave + '"></div>' +
    '</div>';
  }).join('');

  main.innerHTML =
    '<h2 style="color:var(--purple);margin:0 0 6px">Instrumentos</h2>' +
    '<p class="subtle">"Instalar pestaña de datos" es un paso técnico único (lo hace un Administrador, crea la pestaña en el Sheet). "Descargar instrumento vacío" es distinto: en cualquier momento descarga un PDF en blanco con las preguntas del instrumento, listo para llenarse en campo o a mano — no requiere tener un proyecto abierto ni haber instalado nada antes.</p>' +
    '<div class="familias">' + familiasHtml + '</div>' +
    (filas || '<p class="subtle">No hay instrumentos pendientes de instalar por ahora.</p>');

  Array.prototype.forEach.call(main.querySelectorAll('[data-fam]'), function (b) {
    b.onclick = function () {
      state.familiaInstrumentosActiva = b.getAttribute('data-fam');
      renderInstrumentos();
    };
  });

  Array.prototype.forEach.call(main.querySelectorAll('[data-clave]'), function (b) {
    b.onclick = async function () {
      var clave = b.getAttribute('data-clave');
      var msgBox = document.getElementById('instMsg_' + clave);
      b.disabled = true; b.innerHTML = '<span class="spinner"></span>Instalando...';
      var r = await api('instalarInstrumento', { instrumento: clave });
      b.disabled = false; b.textContent = 'Instalar pestaña de datos';
      msgBox.innerHTML = r.ok
        ? '<div class="msg ok">' + r.msg + '</div>'
        : '<div class="msg error">' + r.error + '</div>';
    };
  });

  Array.prototype.forEach.call(main.querySelectorAll('[data-exportar]'), function (b) {
    b.onclick = function () { exportarInstrumentoLlenado(b.getAttribute('data-exportar'), b); };
  });
}

// Descarga un PDF en blanco ("instrumento de llenado") de un instrumento del
// catálogo, sin depender de que la pestaña ya esté instalada ni de un
// proyecto activo — se arma a partir de los campos ya declarados en
// INSTRUMENTOS/CRM_TIPOS (frontend), o del formulario especial (IMES).
async function exportarInstrumentoLlenado(clave, btn) {
  var item = INSTRUMENTOS_INSTALABLES.filter(function (i) { return i.clave === clave; })[0];
  if (!item) return;
  var msgBox = document.getElementById('instMsg_' + clave);
  var textoOriginal = btn.textContent;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Generando...';

  var r;
  if (item.especial && clave === 'IMES') {
    r = await api('exportarIMESLlenado', {});
  } else {
    var secciones = item.tipos.map(function (tipo) {
      var cfg = INSTRUMENTOS[tipo];
      return {
        titulo: cfg.titulo,
        campos: cfg.campos.map(function (c) {
          return { label: c.label.replace(/\s*\*$/, ''), tipo: c.tipo, opciones: c.opciones || null };
        })
      };
    });
    r = await api('exportarInstrumentoLlenado', {
      nombreInstrumento: item.nombre.replace(/\s*\([^)]*\)\s*$/, ''),
      secciones: JSON.stringify(secciones)
    });
  }

  btn.disabled = false; btn.textContent = textoOriginal;
  if (!r.ok) {
    if (msgBox) msgBox.innerHTML = '<div class="msg error">' + escapeHtml(r.error || 'No se pudo generar el PDF.') + '</div>';
    return;
  }
  manejarDescargable(r);
}

/* ---------------- MI CUENTA ---------------- */
function renderCuenta() {
  var main = document.getElementById('main');
  main.innerHTML =
    '<div class="card">' +
      '<h2>Mi cuenta</h2>' +
      '<p class="subtle">' + escapeHtml(session.nombre) + ' &middot; ' + escapeHtml(session.email) + '</p>' +
      '<h3>Cambiar mi contraseña</h3>' +
      '<label>Contraseña actual</label><input type="password" id="cActual">' +
      '<label>Contraseña nueva</label><input type="password" id="cNueva">' +
      '<label>Confirmar contraseña nueva</label><input type="password" id="cConfirmar">' +
      '<button class="primary" id="btnCambiarPass">Actualizar contraseña</button>' +
      '<div id="cuentaMsg"></div>' +
    '</div>';

  document.getElementById('btnCambiarPass').onclick = async function () {
    var actual = document.getElementById('cActual').value;
    var nueva = document.getElementById('cNueva').value;
    var confirmar = document.getElementById('cConfirmar').value;
    var msgBox = document.getElementById('cuentaMsg');
    if (!actual || !nueva) { msgBox.innerHTML = '<div class="msg error">Completa ambos campos de contraseña.</div>'; return; }
    if (nueva !== confirmar) { msgBox.innerHTML = '<div class="msg error">La confirmación no coincide con la nueva contraseña.</div>'; return; }
    if (nueva.length < 6) { msgBox.innerHTML = '<div class="msg error">Usa al menos 6 caracteres.</div>'; return; }

    var btn = document.getElementById('btnCambiarPass');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Actualizando...';

    var passHashActual = await sha256(actual);
    var passHashNueva = await sha256(nueva);
    var r = await api('cambiarMiPassword', { passHashActual: passHashActual, passHashNueva: passHashNueva });

    btn.disabled = false; btn.textContent = 'Actualizar contraseña';
    if (!r.ok) { msgBox.innerHTML = '<div class="msg error">' + r.error + '</div>'; return; }
    msgBox.innerHTML = '<div class="msg ok">Contraseña actualizada correctamente.</div>';
    document.getElementById('cActual').value = '';
    document.getElementById('cNueva').value = '';
    document.getElementById('cConfirmar').value = '';
  };
}

/* ============================================================
 * Arranque
 * ============================================================ */
(async function init() {
  if (session) {
    var r = await jsonp('verificarSesion', { token: session.token });
    if (!r.ok) { cerrarSesion(); render(); return; }
    await cargarProyectos();
  }
  render();
})();
</script>
