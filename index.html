<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma Sintropía</title>
<style>
  :root {
    --purple: #631EEB;
    --purple-dark: #4f18bc;
    --orange: #FF7929;
    --dark: #222222;
    --bg: #F7F5FC;
    --card: #FFFFFF;
    --border: #E2DCF4;
    --danger: #C0392B;
    --ok: #1E8449;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    margin: 0; background: var(--bg); color: var(--dark);
  }
  header.topbar {
    background: var(--purple); color: #fff; padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  header.topbar .brand { font-weight: 700; font-size: 18px; letter-spacing: 0.3px; }
  header.topbar .brand span { color: var(--orange); }
  header.topbar .userbox { display: flex; align-items: center; gap: 12px; font-size: 14px; }
  header.topbar button.logout {
    background: var(--orange); color: #fff; border: none; padding: 7px 14px;
    border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  nav.tabs {
    display: flex; gap: 4px; background: #fff; padding: 0 16px; border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  nav.tabs button {
    background: none; border: none; padding: 12px 16px; cursor: pointer; font-size: 14px;
    color: #555; border-bottom: 3px solid transparent; font-weight: 600;
  }
  nav.tabs button.active { color: var(--purple); border-bottom-color: var(--orange); }
  main { max-width: 980px; margin: 0 auto; padding: 22px 16px 60px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; margin-bottom: 18px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; color: var(--purple); }
  h2 { font-size: 17px; margin: 0 0 14px; color: var(--purple); }
  h3 { font-size: 15px; margin: 18px 0 10px; color: var(--dark); }
  p.subtle { color: #666; font-size: 13px; margin-top: 0; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  input[type=text], input[type=email], input[type=password], input[type=date], input[type=number], select, textarea {
    width: 100%; padding: 9px 10px; border: 1px solid #CBC3E3; border-radius: 6px; font-size: 14px;
    font-family: inherit; background: #fff;
  }
  textarea { min-height: 60px; resize: vertical; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 180px; }
  button.primary {
    background: var(--purple); color: #fff; border: none; padding: 10px 18px;
    border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; margin-top: 14px;
  }
  button.primary:hover { background: var(--purple-dark); }
  button.secondary {
    background: #fff; color: var(--purple); border: 1px solid var(--purple); padding: 8px 14px;
    border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  button.small { padding: 5px 10px; font-size: 12px; border-radius: 5px; cursor: pointer; }
  button.small.edit { background: #EFEAFB; border: 1px solid var(--purple); color: var(--purple); }
  button.small.del { background: #FBEAEA; border: 1px solid var(--danger); color: var(--danger); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: #666; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .badge.activo { background: #E4F7EA; color: var(--ok); }
  .badge.inactivo { background: #FBEAEA; color: var(--danger); }
  .badge.admin { background: #FFF1E4; color: var(--orange); }
  .badge.operativo { background: #EFEAFB; color: var(--purple); }
  .msg { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-top: 12px; }
  .msg.error { background: #FBEAEA; color: var(--danger); border: 1px solid #F2C4C0; }
  .msg.ok { background: #E4F7EA; color: var(--ok); border: 1px solid #BEE5CB; }
  .msg.info { background: #EFEAFB; color: var(--purple); border: 1px solid var(--border); }
  .hidden { display: none !important; }
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex;
    align-items: flex-start; justify-content: center; padding: 30px 14px; overflow-y: auto; z-index: 50;
  }
  .modal { background: #fff; border-radius: 10px; padding: 22px; max-width: 560px; width: 100%; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent;
    border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { max-width: 380px; width: 100%; }
  .login-card h1 { text-align: center; }
  .login-card p.subtle { text-align: center; }
  .breadcrumb { font-size: 13px; color: #666; margin-bottom: 10px; cursor: pointer; }
  .breadcrumb span { color: var(--purple); font-weight: 600; }
  .subtabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .subtabs button {
    background: #F1EDFB; border: 1px solid var(--border); padding: 7px 14px; border-radius: 20px;
    cursor: pointer; font-size: 13px; font-weight: 600; color: #555;
  }
  .subtabs button.active { background: var(--purple); color: #fff; border-color: var(--purple); }
  code.small { background: #F1EDFB; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ============================================================
 * CONFIGURACIÓN — cambia esta URL solo si alguna vez haces una

var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxZbLiOP7QXvrgUIDhhVciVGY-Yval3YBvqBHOpQfK8El2wHXNNBtZvsnkbwMaJUss/exec';

var CATS_DIA01 = ['Necesidad percibida', 'Recurso disponible', 'Expectativa del cliente', 'Riesgo inicial', 'Antecedente relevante', 'Restricción / limitante'];

var FORMATOS_DESCARGA = [['pdf', 'PDF'], ['docx', 'Word'], ['gdoc', 'Google Doc'], ['xlsx', 'Excel'], ['gsheet', 'Google Sheet']];
var TIPOS_REACTIVO_DIA02 = ['Opción múltiple', 'Escala Likert (1-5)', 'Sí/No', 'Numérica', 'Abierta (texto corto)', 'Abierta (texto largo)'];

var INSTRUMENTOS = {

      { key: 'urgencia', label: 'Urgencia' }
    ],

      { key: 'categoria', label: 'Categoría', tipo: 'select', opciones: CATS_DIA01 },

      { key: 'urgencia', label: 'Nivel de urgencia / relevancia', tipo: 'select', opciones: URGENCIAS_DIA01 },
      { key: 'fecha', label: 'Fecha de levantamiento', tipo: 'date' },
      { key: 'notas', label: 'Notas', tipo: 'textarea' }

  dia02_estructura: {
    titulo: 'INS-DIA-02 (1/3) Estructura',
    listar: 'listarDIA02Estructura', guardar: 'guardarFilaDIA02Estructura', eliminar: 'eliminarFilaDIA02Estructura',
    validar: 'validarDIA02Estructura', descargar: 'generarDescargableDIA02Estructura',
    columnas: [
      { key: 'codigo', label: 'Código' },
      { key: 'noSeccion', label: 'No.' },
      { key: 'nombreSeccion', label: 'Sección' },
      { key: 'noReactivosEstimado', label: 'Reactivos (est.)' }
    ],
    campos: [
      { key: 'noSeccion', label: 'No. de sección', tipo: 'number' },
      { key: 'nombreSeccion', label: 'Nombre de la sección *', tipo: 'text', requerido: true },
      { key: 'objetivoSeccion', label: 'Objetivo de la sección', tipo: 'textarea' },
      { key: 'noReactivosEstimado', label: 'No. de reactivos estimado', tipo: 'number' }
    ]
  },

    titulo: 'INS-DIA-02 (2/3) Banco de reactivos',
    listar: 'listarDIA02Reactivos', guardar: 'guardarFilaDIA02Reactivos', eliminar: 'eliminarFilaDIA02Reactivos',
    validar: 'validarDIA02Reactivos', descargar: 'generarDescargableDIA02Reactivos',
    columnas: [
      { key: 'codigo', label: 'Código' },
      { key: 'codigoSeccion', label: 'Sección' },
      { key: 'reactivo', label: 'Reactivo' },
      { key: 'tipoReactivo', label: 'Tipo' },
      { key: 'ejeAplicable', label: 'Eje' }
    ],

      { key: 'tipoReactivo', label: 'Tipo de reactivo', tipo: 'select', opciones: TIPOS_REACTIVO_DIA02 },

    ]
  },
  dia02_respuestas: {

    validar: 'validarDIA02Respuestas', descargar: 'generarDescargableDIA02Respuestas',
    columnas: [
      { key: 'codigo', label: 'Código' },
      { key: 'codigoReactivo', label: 'Reactivo' },
      { key: 'idRespondente', label: 'Respondente' },
      { key: 'respuesta', label: 'Respuesta' },
      { key: 'fecha', label: 'Fecha' }
    ],
    campos: [
      { key: 'codigoReactivo', label: 'Código de reactivo (INS-DIA-02 2/3) *', tipo: 'text', requerido: true, placeholder: 'ej. REA-01' },
      { key: 'idRespondente', label: 'ID de respondente (anónimo) *', tipo: 'text', requerido: true, placeholder: 'ej. R001' },
      { key: 'respuesta', label: 'Respuesta *', tipo: 'text', requerido: true },
      { key: 'fecha', label: 'Fecha de aplicación', tipo: 'date' },
      { key: 'aplicador', label: 'Aplicador', tipo: 'text' }
    ]
  },
  pla01: {
    titulo: 'INS-PLA-01 Árbol de problemas',
    listar: 'listarPLA01', guardar: 'guardarFilaPLA01', eliminar: 'eliminarFilaPLA01',
    validar: 'validarPLA01', descargar: 'generarDescargablePLA01',
    columnas: [
      { key: 'codigo', label: 'Código' },
      { key: 'problema', label: 'Problema' },
      { key: 'categoria', label: 'Categoría' },
      { key: 'nivel', label: 'Nivel' },
      { key: 'relacionado', label: 'Relacionado' },
      { key: 'prioridad', label: 'Prioridad' }
    ],
    campos: [

    ]
  },
  pla02: {
    titulo: 'INS-PLA-02 Árbol de objetivos',

    columnas: [
      { key: 'codigo', label: 'Código' },
      { key: 'objetivo', label: 'Objetivo' },

      { key: 'plazo', label: 'Plazo' }
    ],
    campos: [
      { key: 'objetivo', label: 'Objetivo *', tipo: 'textarea', requerido: true },
      { key: 'categoria', label: 'Categoría', tipo: 'select', opciones: CATS_PLA02 },
      { key: 'problemaOrigen', label: 'Código de problema origen (PLA-01)', tipo: 'text', placeholder: 'ej. PRO-01' },
      { key: 'indicador', label: 'Indicador preliminar de éxito', tipo: 'text' },
      { key: 'responsable', label: 'Responsable / actor clave', tipo: 'text' },
      { key: 'plazo', label: 'Plazo estimado', tipo: 'select', opciones: PLAZOS },
      { key: 'notas', label: 'Notas', tipo: 'textarea' }
    ]
  }
};

// Instrumentos cuya pestaña de datos en el Sheet debe instalarse una sola
// vez desde el panel de administración antes de poder usarse (PLA-01 y
// PLA-02 ya vienen instalados desde el arranque del piloto).
var INSTRUMENTOS_INSTALABLES = [
  { clave: 'DIA01', nombre: 'INS-DIA-01 — Ficha de diagnóstico inicial' },
  { clave: 'DIA02', nombre: 'INS-DIA-02 — Cuestionario diagnóstico (3 pestañas: Estructura, Reactivos, Respuestas)' }
];

/* ============================================================
 * Estado de sesión (persistido localmente en este navegador)
 * ============================================================ */
var session = null;
try {
  var raw = localStorage.getItem('sintropia_session');
  if (raw) session = JSON.parse(raw);
} catch (e) { session = null; }

var state = {
  view: 'proyectos',      // proyectos | usuarios | instrumentos | cuenta
  proyectos: [],
  proyectoActivo: null,   // objeto proyecto seleccionado
  subtab: 'dia01',        // clave dentro de INSTRUMENTOS
  filas: {},              // { dia01: [...], pla01: [...], pla02: [...] }
  usuarios: []
};

/* ============================================================
 * Utilidades: hash SHA-256 y llamadas JSONP
 * ============================================================ */
async function sha256(str) {
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
}

function jsonp(action, params) {
  return new Promise(function (resolve) {
    var cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    var url = WEB_APP_URL + '?action=' + encodeURIComponent(action) + '&callback=' + cbName;
    params = params || {};
    for (var k in params) {
      if (params[k] !== undefined && params[k] !== null) {
        url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
      }
    }
    var script = document.createElement('script');
    var cleaned = false;
    function cleanup() {
      if (cleaned) return;
      cleaned = true;
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = function (data) { cleanup(); resolve(data); };
    script.onerror = function () {
      cleanup();
      resolve({ ok: false, error: 'No se pudo conectar con la plataforma (revisa tu conexión a internet).' });
    };
    setTimeout(function () {
      if (!cleaned) { cleanup(); resolve({ ok: false, error: 'La plataforma tardó demasiado en responder. Intenta de nuevo.' }); }
    }, 25000);
    script.src = url;
    document.body.appendChild(script);
  });
}

// Llamada autenticada: agrega el token automáticamente y cierra sesión si expiró.
async function api(action, params) {
  params = params || {};
  params.token = session ? session.token : '';
  var r = await jsonp(action, params);
  if (!r.ok && r.error && /sesión inválida|expirada/i.test(r.error)) {
    cerrarSesion();
    render();
  }
  return r;
}

function guardarSesion(data) {
  session = { token: data.token, email: data.email, nombre: data.nombre, rol: data.rol };
  localStorage.setItem('sintropia_session', JSON.stringify(session));
}

function cerrarSesion() {
  session = null;
  localStorage.removeItem('sintropia_session');
  state.view = 'proyectos';
  state.proyectoActivo = null;
}

function esAdmin() { return session && session.rol === 'Administrador'; }

/* ============================================================
 * Descarga de archivos generados por el backend
 * ============================================================ */
function descargarBase64(filename, mimeType, base64) {
  var link = document.createElement('a');
  link.href = 'data:' + mimeType + ';base64,' + base64;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function manejarDescargable(r) {
  if (!r.ok) { alert('No se pudo generar el descargable: ' + (r.error || 'error desconocido')); return; }
  if (r.formato === 'gdoc' || r.formato === 'gsheet') {
    window.open(r.url, '_blank');
  } else {
    descargarBase64(r.filename, r.mimeType, r.base64);
  }
}

/* ============================================================
 * Render principal
 * ============================================================ */
var root = document.getElementById('app');

function render() {
  if (!session) { renderLogin(); return; }
  renderApp();
}

function el(html) {
  var d = document.createElement('div');
  d.innerHTML = html;
  return d.firstElementChild;
}

/* ---------------- LOGIN ---------------- */
function renderLogin() {
  root.innerHTML =
    '<div class="login-wrap"><div class="card login-card">' +
      '<h1>Plataforma <span style="color:#FF7929">Sintropía</span></h1>' +
      '<p class="subtle">Acceso para equipo interno</p>' +
      '<label>Correo</label>' +
      '<input type="email" id="loginEmail" placeholder="tu@correo.com" autocomplete="username">' +
      '<label>Contraseña</label>' +
      '<input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">' +
      '<button class="primary" id="btnLogin" style="width:100%">Entrar</button>' +
      '<div id="loginMsg"></div>' +
    '</div></div>';

  document.getElementById('btnLogin').onclick = doLogin;
  document.getElementById('loginPass').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  document.getElementById('loginEmail').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
}

async function doLogin() {
  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPass').value;
  var msgBox = document.getElementById('loginMsg');
  msgBox.innerHTML = '';
  if (!email || !pass) { msgBox.innerHTML = '<div class="msg error">Escribe tu correo y contraseña.</div>'; return; }

  var btn = document.getElementById('btnLogin');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Entrando...';

  var passHash = await sha256(pass);
  var r = await jsonp('login', { email: email, passHash: passHash });

  btn.disabled = false; btn.innerHTML = 'Entrar';

  if (!r.ok) { msgBox.innerHTML = '<div class="msg error">' + (r.error || 'No se pudo iniciar sesión.') + '</div>'; return; }
  guardarSesion(r);
  await cargarProyectos();
  render();
}

/* ---------------- APP SHELL ---------------- */
function renderApp() {
  var tabs = '<button data-tab="proyectos" class="' + (state.view === 'proyectos' ? 'active' : '') + '">Proyectos</button>';
  if (esAdmin()) {
    tabs += '<button data-tab="usuarios" class="' + (state.view === 'usuarios' ? 'active' : '') + '">Usuarios</button>';
    tabs += '<button data-tab="instrumentos" class="' + (state.view === 'instrumentos' ? 'active' : '') + '">Instrumentos</button>';
  }
  tabs += '<button data-tab="cuenta" class="' + (state.view === 'cuenta' ? 'active' : '') + '">Mi cuenta</button>';

  root.innerHTML =
    '<header class="topbar">' +
      '<div class="brand">Plataforma <span>Sintropía</span></div>' +
      '<div class="userbox">' +
        '<span>' + session.nombre + ' &middot; <span class="badge ' + (esAdmin() ? 'admin' : 'operativo') + '">' + session.rol + '</span></span>' +
        '<button class="logout" id="btnLogout">Cerrar sesión</button>' +
      '</div>' +
    '</header>' +
    '<nav class="tabs">' + tabs + '</nav>' +
    '<main id="main"></main>';

  document.getElementById('btnLogout').onclick = function () { cerrarSesion(); render(); };
  Array.prototype.forEach.call(root.querySelectorAll('nav.tabs button'), function (b) {
    b.onclick = function () { state.view = b.getAttribute('data-tab'); state.proyectoActivo = null; renderMain(); };
  });

  renderMain();
}

function renderMain() {
  if (state.view === 'proyectos') {
    if (state.proyectoActivo) renderProyectoDetalle(); else renderProyectos();
  } else if (state.view === 'usuarios' && esAdmin()) {
    renderUsuarios();
  } else if (state.view === 'instrumentos' && esAdmin()) {
    renderInstrumentos();
  } else if (state.view === 'cuenta') {
    renderCuenta();
  }
}

/* ---------------- PROYECTOS: LISTA ---------------- */
async function cargarProyectos() {
  var r = await api('listarProyectos', {});
  if (r.ok) state.proyectos = r.data;
}

function renderProyectos() {
  var main = document.getElementById('main');
  var filas = state.proyectos.map(function (p) {
    return '<tr>' +
      '<td>' + p.codigo + '</td>' +
      '<td>' + p.cliente + '</td>' +
      '<td>' + (p.ejeNombre || '—') + '</td>' +
      '<td>' + (p.responsable || '—') + '</td>' +
      '<td>' + (p.fechaInicio || '—') + '</td>' +
      '<td>' + (p.estatus || '—') + '</td>' +
      '<td><button class="small secondary" data-codigo="' + p.codigo + '">Abrir</button></td>' +
    '</tr>';
  }).join('');

  main.innerHTML =
    '<div class="card">' +
      '<div class="toolbar" style="justify-content:space-between">' +
        '<h2 style="margin:0">Proyectos</h2>' +
        '<button class="secondary" id="btnNuevoProyecto">+ Nuevo proyecto</button>' +
      '</div>' +
      (state.proyectos.length === 0
        ? '<p class="subtle">Todavía no hay proyectos. Crea el primero con "+ Nuevo proyecto".</p>'
        : '<table><thead><tr><th>Código</th><th>Cliente</th><th>Eje</th><th>Responsable</th><th>Inicio</th><th>Estatus</th><th></th></tr></thead><tbody>' + filas + '</tbody></table>') +
    '</div>';

  document.getElementById('btnNuevoProyecto').onclick = abrirModalNuevoProyecto;
  Array.prototype.forEach.call(main.querySelectorAll('[data-codigo]'), function (b) {
    b.onclick = function () { abrirProyecto(b.getAttribute('data-codigo')); };
  });
}

function abrirProyecto(codigo) {
  var p = state.proyectos.filter(function (x) { return x.codigo === codigo; })[0];
  state.proyectoActivo = p;
  state.subtab = Object.keys(INSTRUMENTOS)[0];
  renderMain();
  Object.keys(INSTRUMENTOS).forEach(function (tipo) { cargarInstrumento(tipo); });
}

function abrirModalNuevoProyecto() {
  var opcionesEstatus = ESTATUS_PROYECTO.map(function (e) { return '<option>' + e + '</option>'; }).join('');
  var modal = el(
    '<div class="modal-bg"><div class="modal">' +
      '<h2>Nuevo proyecto</h2>' +
      '<label>Cliente / municipio *</label><input type="text" id="npCliente">' +
      '<div class="row">' +
        '<div><label>Código de Eje</label><input type="text" id="npEje" placeholder="ej. EJE-01"></div>' +
        '<div><label>Código de Servicio</label><input type="text" id="npServicio" placeholder="ej. SRV-01 (opcional)"></div>' +
      '</div>' +
      '<p class="subtle">Los códigos de Eje/Servicio están en las pestañas "Ejes" y "Servicios" del Sheet.</p>' +
      '<div class="row">' +
        '<div><label>Responsable</label><input type="text" id="npResponsable"></div>' +
        '<div><label>Fecha de inicio</label><input type="date" id="npFecha"></div>' +
      '</div>' +
      '<label>Estatus</label><select id="npEstatus">' + opcionesEstatus + '</select>' +
      '<div id="npMsg"></div>' +
      '<div class="modal-actions">' +
        '<button class="secondary" id="npCancelar">Cancelar</button>' +
        '<button class="primary" id="npGuardar">Crear proyecto</button>' +
      '</div>' +
    '</div></div>'
  );
  document.body.appendChild(modal);
  modal.querySelector('#npCancelar').onclick = function () { modal.remove(); };
  modal.querySelector('#npGuardar').onclick = async function () {
    var cliente = modal.querySelector('#npCliente').value.trim();
    var msgBox = modal.querySelector('#npMsg');
    if (!cliente) { msgBox.innerHTML = '<div class="msg error">El cliente es obligatorio.</div>'; return; }
    var btn = modal.querySelector('#npGuardar');
    btn.disabled = true; btn.textContent = 'Creando...';
    var r = await api('crearProyecto', {
      cliente: cliente,
      eje: modal.querySelector('#npEje').value.trim(),
      servicio: modal.querySelector('#npServicio').value.trim(),
      responsable: modal.querySelector('#npResponsable').value.trim(),
      fecha: modal.querySelector('#npFecha').value,
      estatus: modal.querySelector('#npEstatus').value
    });
    if (!r.ok) { msgBox.innerHTML = '<div class="msg error">' + r.error + '</div>'; btn.disabled = false; btn.textContent = 'Crear proyecto'; return; }
    modal.remove();
    await cargarProyectos();
    renderMain();
  };
}

/* ---------------- PROYECTO: DETALLE (instrumentos, según catálogo) ---------------- */
function renderProyectoDetalle() {
  var main = document.getElementById('main');
  var p = state.proyectoActivo;
  var subtabsHtml = Object.keys(INSTRUMENTOS).map(function (k) {
    return '<button data-sub="' + k + '" class="' + (state.subtab === k ? 'active' : '') + '">' + INSTRUMENTOS[k].titulo + '</button>';
  }).join('');

  main.innerHTML =
    '<div class="breadcrumb" id="bcVolver">&larr; Volver a <span>Proyectos</span></div>' +
    '<div class="card">' +
      '<h2 style="margin-bottom:2px">' + p.codigo + ' — ' + p.cliente + '</h2>' +
      '<p class="subtle">Eje: ' + (p.ejeNombre || '—') + (p.servicioNombre ? ' &middot; Servicio: ' + p.servicioNombre : '') + '</p>' +
      '<div class="subtabs">' + subtabsHtml + '</div>' +
      '<div id="subContent"></div>' +
    '</div>';

  document.getElementById('bcVolver').onclick = function () { state.proyectoActivo = null; renderMain(); };
  Array.prototype.forEach.call(main.querySelectorAll('[data-sub]'), function (b) {
    b.onclick = function () { state.subtab = b.getAttribute('data-sub'); renderProyectoDetalle(); };
  });

  renderInstrumento(state.subtab);
}

async function cargarInstrumento(tipo) {
  var cfg = INSTRUMENTOS[tipo];
  var r = await api(cfg.listar, { proyecto: state.proyectoActivo.codigo });
  if (r.ok) state.filas[tipo] = r.data;
  if (state.view === 'proyectos' && state.proyectoActivo && state.subtab === tipo) renderInstrumento(tipo);
}

function renderInstrumento(tipo) {
  var box = document.getElementById('subContent');
  if (!box) return;
  var cfg = INSTRUMENTOS[tipo];
  var filas = state.filas[tipo] || [];

  var thead = '<tr>' + cfg.columnas.map(function (c) { return '<th>' + c.label + '</th>'; }).join('') + '<th></th></tr>';
  var trs = filas.map(function (f) {
    var tds = cfg.columnas.map(function (c) {
      var v = f[c.key];
      return '<td>' + (v === undefined || v === null || v === '' ? '—' : escapeHtml(v)) + '</td>';
    }).join('');
    return '<tr>' + tds +
      '<td><button class="small edit" data-codigo="' + f.codigo + '">Editar</button> ' +
      '<button class="small del" data-codigo="' + f.codigo + '">Eliminar</button></td></tr>';
  }).join('');

  var opcionesFormato = FORMATOS_DESCARGA.map(function (f) { return '<option value="' + f[0] + '">' + f[1] + '</option>'; }).join('');

  box.innerHTML =
    '<div class="toolbar" style="justify-content:space-between">' +
      '<button class="secondary" id="btnAgregarFila">+ Agregar fila</button>' +
      '<div style="display:flex;gap:8px;align-items:center">' +
        '<button class="secondary" id="btnValidar">Validar</button>' +
        '<select id="selFormato" style="width:auto">' + opcionesFormato + '</select>' +
        '<button class="primary" id="btnGenerar" style="margin-top:0">Generar descargable</button>' +
      '</div>' +
    '</div>' +
    '<div id="validacionBox"></div>' +
    (filas.length === 0
      ? '<p class="subtle">Todavía no hay filas capturadas. Si al validar o generar aparece un error de pestaña no encontrada, pide a tu administrador que lo instale en "Instrumentos".</p>'
      : '<table><thead>' + thead + '</thead><tbody>' + trs + '</tbody></table>');

  document.getElementById('btnAgregarFila').onclick = function () { abrirModalFila(tipo, null); };
  document.getElementById('btnValidar').onclick = function () { validarInstrumento(tipo); };
  document.getElementById('btnGenerar').onclick = function () { generarDescargable(tipo); };
  Array.prototype.forEach.call(box.querySelectorAll('button.edit'), function (b) {
    b.onclick = function () {
      var codigo = b.getAttribute('data-codigo');
      var fila = filas.filter(function (f) { return f.codigo === codigo; })[0];
      abrirModalFila(tipo, fila);
    };
  });
  Array.prototype.forEach.call(box.querySelectorAll('button.del'), function (b) {
    b.onclick = async function () {
      if (!confirm('¿Eliminar esta fila? No se puede deshacer.')) return;
      var codigo = b.getAttribute('data-codigo');
      var r = await api(cfg.eliminar, { proyecto: state.proyectoActivo.codigo, codigo: codigo });
      if (!r.ok) { alert(r.error); return; }
      await cargarInstrumento(tipo);
    };
  });
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function validarInstrumento(tipo) {
  var accion = INSTRUMENTOS[tipo].validar;
  var r = await api(accion, { proyecto: state.proyectoActivo.codigo });
  var box = document.getElementById('validacionBox');
  if (!r.ok) { box.innerHTML = '<div class="msg error">' + r.error + '</div>'; return; }
  var html = '';
  if (r.bloqueantes.length === 0 && r.advertencias.length === 0) {
    html = '<div class="msg ok">No se detectaron errores ni advertencias. Listo para generar el documento.</div>';
  } else {
    if (r.bloqueantes.length > 0) {
      html += '<div class="msg error"><strong>Errores (impiden generar el documento):</strong><ul style="margin:6px 0 0;padding-left:18px">' +
        r.bloqueantes.map(function (b) { return '<li>' + escapeHtml(b) + '</li>'; }).join('') + '</ul></div>';
    }
    if (r.advertencias.length > 0) {
      html += '<div class="msg info"><strong>Advertencias (no bloquean):</strong><ul style="margin:6px 0 0;padding-left:18px">' +
        r.advertencias.map(function (a) { return '<li>' + escapeHtml(a) + '</li>'; }).join('') + '</ul></div>';
    }
  }
  box.innerHTML = html;
}

async function generarDescargable(tipo) {
  var formato = document.getElementById('selFormato').value;
  var accion = INSTRUMENTOS[tipo].descargar;
  var btn = document.getElementById('btnGenerar');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Generando...';
  var r = await api(accion, { proyecto: state.proyectoActivo.codigo, formato: formato });
  btn.disabled = false; btn.textContent = 'Generar descargable';
  if (!r.ok) {
    var box = document.getElementById('validacionBox');
    var extra = r.bloqueantes ? '<ul style="margin:6px 0 0;padding-left:18px">' + r.bloqueantes.map(function (b) { return '<li>' + escapeHtml(b) + '</li>'; }).join('') + '</ul>' : '';
    box.innerHTML = '<div class="msg error">' + r.error + extra + '</div>';
    return;
  }
  manejarDescargable(r);
}

function abrirModalFila(tipo, fila) {
  var cfg = INSTRUMENTOS[tipo];
  var editando = !!fila;

  var camposHtml = cfg.campos.map(function (c) {
    var id = 'f_' + c.key;
    var val = fila ? (fila[c.key] != null ? fila[c.key] : '') : '';
    if (c.tipo === 'select') {
      var opts = c.opciones.map(function (o) {
        return '<option ' + (fila && fila[c.key] === o ? 'selected' : '') + '>' + o + '</option>';
      }).join('');
      return '<label>' + c.label + '</label><select id="' + id + '">' + opts + '</select>';
    }
    if (c.tipo === 'textarea') {
      return '<label>' + c.label + '</label><textarea id="' + id + '">' + escapeHtml(val) + '</textarea>';
    }
    return '<label>' + c.label + '</label><input type="' + c.tipo + '" id="' + id + '" value="' + escapeHtml(val) + '"' +
      (c.placeholder ? ' placeholder="' + c.placeholder + '"' : '') + '>';
  }).join('');

  var modal = el(
    '<div class="modal-bg"><div class="modal">' +
      '<h2>' + (editando ? 'Editar fila ' + fila.codigo : 'Agregar fila') + '</h2>' +
      camposHtml +
      '<div id="filaMsg"></div>' +
      '<div class="modal-actions">' +
        '<button class="secondary" id="filaCancelar">Cancelar</button>' +
        '<button class="primary" id="filaGuardar">Guardar</button>' +
      '</div>' +
    '</div></div>'
  );
  document.body.appendChild(modal);
  modal.querySelector('#filaCancelar').onclick = function () { modal.remove(); };
  modal.querySelector('#filaGuardar').onclick = async function () {
    var btn = modal.querySelector('#filaGuardar');
    var msgBox = modal.querySelector('#filaMsg');
    var params = { proyecto: state.proyectoActivo.codigo };
    if (editando) params.codigo = fila.codigo;

    var faltante = null;
    cfg.campos.forEach(function (c) {
      var elx = modal.querySelector('#f_' + c.key);
      var v = elx.value;
      if (c.tipo !== 'select' && c.tipo !== 'date') v = v.trim();
      if (c.requerido && !v && !faltante) faltante = c.label;
      params[c.key] = v;
    });
    if (faltante) { msgBox.innerHTML = '<div class="msg error">El campo "' + faltante.replace(' *', '') + '" no puede estar vacío.</div>'; return; }

    btn.disabled = true; btn.textContent = 'Guardando...';
    var r = await api(cfg.guardar, params);
    if (!r.ok) { msgBox.innerHTML = '<div class="msg error">' + r.error + '</div>'; btn.disabled = false; btn.textContent = 'Guardar'; return; }
    modal.remove();
    await cargarInstrumento(tipo);
  };
}

/* ---------------- USUARIOS (solo Administrador) ---------------- */
async function cargarUsuarios() {
  var r = await api('listarUsuarios', {});
  if (r.ok) state.usuarios = r.data;
}

async function renderUsuarios() {
  await cargarUsuarios();
  var main = document.getElementById('main');
  var filas = state.usuarios.map(function (u) {
    return '<tr>' +
      '<td>' + escapeHtml(u.nombre) + '</td>' +
      '<td>' + u.email + '</td>' +
      '<td><span class="badge ' + (u.rol === 'Administrador' ? 'admin' : 'operativo') + '">' + u.rol + '</span></td>' +
      '<td><span class="badge ' + (u.estado === 'Activo' ? 'activo' : 'inactivo') + '">' + u.estado + '</span></td>' +
      '<td>' +
        '<button class="small secondary" data-accion="toggle" data-email="' + u.email + '" data-estado="' + u.estado + '">' +
          (u.estado === 'Activo' ? 'Desactivar' : 'Activar') + '</button> ' +
        '<button class="small secondary" data-accion="reset" data-email="' + u.email + '">Restablecer contraseña</button>' +
      '</td>' +
    '</tr>';
  }).join('');

  main.innerHTML =
    '<div class="card">' +
      '<div class="toolbar" style="justify-content:space-between">' +
        '<h2 style="margin:0">Usuarios de la plataforma</h2>' +
        '<button class="secondary" id="btnNuevoUsuario">+ Nuevo usuario</button>' +
      '</div>' +
      '<p class="subtle">Máximo recomendado: 5 cuentas operativas + tu cuenta de administrador.</p>' +
      '<table><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th></th></tr></thead><tbody>' + filas + '</tbody></table>' +
    '</div>';

  document.getElementById('btnNuevoUsuario').onclick = abrirModalNuevoUsuario;
  Array.prototype.forEach.call(main.querySelectorAll('[data-accion="toggle"]'), function (b) {
    b.onclick = async function () {
      var nuevoEstado = b.getAttribute('data-estado') === 'Activo' ? 'Inactivo' : 'Activo';
      var r = await api('cambiarEstadoUsuario', { email: b.getAttribute('data-email'), estado: nuevoEstado });
      if (!r.ok) { alert(r.error); return; }
      renderUsuarios();
    };
  });
  Array.prototype.forEach.call(main.querySelectorAll('[data-accion="reset"]'), function (b) {
    b.onclick = async function () {
      if (!confirm('¿Restablecer la contraseña de ' + b.getAttribute('data-email') + '? Se generará una temporal y se le enviará por correo.')) return;
      var r = await api('restablecerPasswordUsuario', { email: b.getAttribute('data-email') });
      if (!r.ok) { alert(r.error); return; }
      alert('Contraseña restablecida.\nContraseña temporal: ' + r.tempPassword + '\n\n(También se envió por correo, si el envío fue posible).');
    };
  });
}

function abrirModalNuevoUsuario() {
  var modal = el(
    '<div class="modal-bg"><div class="modal">' +
      '<h2>Nuevo usuario</h2>' +
      '<label>Nombre *</label><input type="text" id="nuNombre">' +
      '<label>Correo *</label><input type="email" id="nuEmail">' +
      '<label>Rol</label><select id="nuRol"><option value="Operativo">Operativo</option><option value="Administrador">Administrador</option></select>' +
      '<p class="subtle">Se genera una contraseña temporal y se envía por correo (si el envío es posible); la persona deberá cambiarla desde "Mi cuenta".</p>' +
      '<div id="nuMsg"></div>' +
      '<div class="modal-actions">' +
        '<button class="secondary" id="nuCancelar">Cancelar</button>' +
        '<button class="primary" id="nuGuardar">Crear usuario</button>' +
      '</div>' +
    '</div></div>'
  );
  document.body.appendChild(modal);
  modal.querySelector('#nuCancelar').onclick = function () { modal.remove(); };
  modal.querySelector('#nuGuardar').onclick = async function () {
    var nombre = modal.querySelector('#nuNombre').value.trim();
    var email = modal.querySelector('#nuEmail').value.trim();
    var msgBox = modal.querySelector('#nuMsg');
    if (!nombre || !email) { msgBox.innerHTML = '<div class="msg error">Nombre y correo son obligatorios.</div>'; return; }
    var btn = modal.querySelector('#nuGuardar');
    btn.disabled = true; btn.textContent = 'Creando...';
    var r = await api('crearUsuario', { nombre: nombre, email: email, rol: modal.querySelector('#nuRol').value });
    if (!r.ok) { msgBox.innerHTML = '<div class="msg error">' + r.error + '</div>'; btn.disabled = false; btn.textContent = 'Crear usuario'; return; }
    modal.remove();
    alert('Usuario creado.\nContraseña temporal: ' + r.tempPassword + '\n\n(También se envió por correo, si el envío fue posible).');
    renderUsuarios();
  };
}

/* ---------------- INSTRUMENTOS (solo Administrador) ---------------- */
function renderInstrumentos() {
  var main = document.getElementById('main');
  var filas = INSTRUMENTOS_INSTALABLES.map(function (i) {
    return '<div class="card" style="margin-bottom:10px">' +
      '<div class="toolbar" style="justify-content:space-between">' +
        '<div><strong>' + i.nombre + '</strong>' +
          '<p class="subtle" style="margin:4px 0 0">Crea la pestaña de datos en el Sheet — solo hace falta una vez, ya nunca hay que volver a Apps Script para esto.</p></div>' +
        '<button class="secondary" data-clave="' + i.clave + '">Instalar pestaña de datos</button>' +
      '</div>' +
      '<div id="instMsg_' + i.clave + '"></div>' +

  }).join('');

  main.innerHTML =
    '<h2 style="color:var(--purple);margin:0 0 6px">Instrumentos</h2>' +

      msgBox.innerHTML = r.ok
        ? '<div class="msg ok">' + r.msg + '</div>'
        : '<div class="msg error">' + r.error + '</div>';

}

/* ---------------- MI CUENTA ---------------- */
function renderCuenta() {
  var main = document.getElementById('main');
  main.innerHTML =
    '<div class="card">' +
      '<h2>Mi cuenta</h2>' +
      '<p class="subtle">' + session.nombre + ' &middot; ' + session.email + '</p>' +
      '<h3>Cambiar mi contraseña</h3>' +
      '<label>Contraseña actual</label><input type="password" id="cActual">' +
      '<label>Contraseña nueva</label><input type="password" id="cNueva">' +
      '<label>Confirmar contraseña nueva</label><input type="password" id="cConfirmar">' +
      '<button class="primary" id="btnCambiarPass">Actualizar contraseña</button>' +
      '<div id="cuentaMsg"></div>' +
    '</div>';

  document.getElementById('btnCambiarPass').onclick = async function () {
    var actual = document.getElementById('cActual').value;
    var nueva = document.getElementById('cNueva').value;
    var confirmar = document.getElementById('cConfirmar').value;
    var msgBox = document.getElementById('cuentaMsg');
    if (!actual || !nueva) { msgBox.innerHTML = '<div class="msg error">Completa ambos campos de contraseña.</div>'; return; }
    if (nueva !== confirmar) { msgBox.innerHTML = '<div class="msg error">La confirmación no coincide con la nueva contraseña.</div>'; return; }
    if (nueva.length < 6) { msgBox.innerHTML = '<div class="msg error">Usa al menos 6 caracteres.</div>'; return; }

    var btn = document.getElementById('btnCambiarPass');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Actualizando...';

    var passHashActual = await sha256(actual);
    var passHashNueva = await sha256(nueva);
    var r = await api('cambiarMiPassword', { passHashActual: passHashActual, passHashNueva: passHashNueva });

    btn.disabled = false; btn.textContent = 'Actualizar contraseña';
    if (!r.ok) { msgBox.innerHTML = '<div class="msg error">' + r.error + '</div>'; return; }
    msgBox.innerHTML = '<div class="msg ok">Contraseña actualizada correctamente.</div>';
    document.getElementById('cActual').value = '';
    document.getElementById('cNueva').value = '';
    document.getElementById('cConfirmar').value = '';
  };
}

/* ============================================================
 * Arranque
 * ============================================================ */
(async function init() {
  if (session) {
    var r = await jsonp('verificarSesion', { token: session.token });
    if (!r.ok) { cerrarSesion(); render(); return; }
    await cargarProyectos();
  }
  render();
