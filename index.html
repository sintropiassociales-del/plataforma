<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma Sintropía</title>
<style>
  :root {
    --purple: #631EEB;
    --purple-dark: #4f18bc;
    --orange: #FF7929;
    --dark: #222222;
    --bg: #F7F5FC;
    --card: #FFFFFF;
    --border: #E2DCF4;
    --danger: #C0392B;
    --ok: #1E8449;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    margin: 0; background: var(--bg); color: var(--dark);
  }
  header.topbar {
    background: var(--purple); color: #fff; padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  header.topbar .brand { font-weight: 700; font-size: 18px; letter-spacing: 0.3px; }
  header.topbar .brand span { color: var(--orange); }
  header.topbar .userbox { display: flex; align-items: center; gap: 12px; font-size: 14px; }
  header.topbar button.logout {
    background: var(--orange); color: #fff; border: none; padding: 7px 14px;
    border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  nav.tabs {
    display: flex; gap: 4px; background: #fff; padding: 0 16px; border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  nav.tabs button {
    background: none; border: none; padding: 12px 16px; cursor: pointer; font-size: 14px;
    color: #555; border-bottom: 3px solid transparent; font-weight: 600;
  }
  nav.tabs button.active { color: var(--purple); border-bottom-color: var(--orange); }
  main { max-width: 980px; margin: 0 auto; padding: 22px 16px 60px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; margin-bottom: 18px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; color: var(--purple); }
  h2 { font-size: 17px; margin: 0 0 14px; color: var(--purple); }
  h3 { font-size: 15px; margin: 18px 0 10px; color: var(--dark); }
  p.subtle { color: #666; font-size: 13px; margin-top: 0; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  input[type=text], input[type=email], input[type=password], input[type=date], input[type=number], select, textarea {
    width: 100%; padding: 9px 10px; border: 1px solid #CBC3E3; border-radius: 6px; font-size: 14px;
    font-family: inherit; background: #fff;
  }
  textarea { min-height: 60px; resize: vertical; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 180px; }
  button.primary {
    background: var(--purple); color: #fff; border: none; padding: 10px 18px;
    border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; margin-top: 14px;
  }
  button.primary:hover { background: var(--purple-dark); }
  button.secondary {
    background: #fff; color: var(--purple); border: 1px solid var(--purple); padding: 8px 14px;
    border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  button.small { padding: 5px 10px; font-size: 12px; border-radius: 5px; cursor: pointer; }
  button.small.edit { background: #EFEAFB; border: 1px solid var(--purple); color: var(--purple); }
  button.small.del { background: #FBEAEA; border: 1px solid var(--danger); color: var(--danger); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: #666; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .badge.activo { background: #E4F7EA; color: var(--ok); }
  .badge.inactivo { background: #FBEAEA; color: var(--danger); }
  .badge.admin { background: #FFF1E4; color: var(--orange); }
  .badge.operativo { background: #EFEAFB; color: var(--purple); }
  .msg { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-top: 12px; }
  .msg.error { background: #FBEAEA; color: var(--danger); border: 1px solid #F2C4C0; }
  .msg.ok { background: #E4F7EA; color: var(--ok); border: 1px solid #BEE5CB; }
  .msg.info { background: #EFEAFB; color: var(--purple); border: 1px solid var(--border); }
  .hidden { display: none !important; }
  [contenteditable][data-placeholder]:empty:before { content: attr(data-placeholder); color: #999; }
  [contenteditable] ul, [contenteditable] ol { padding-left: 22px; margin: 6px 0; }
  [contenteditable]:focus { outline: 2px solid var(--purple); outline-offset: -1px; }
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex;
    align-items: flex-start; justify-content: center; padding: 30px 14px; overflow-y: auto; z-index: 50;
  }
  .modal { background: #fff; border-radius: 10px; padding: 22px; max-width: 560px; width: 100%; }
  .modal.wide { max-width: 920px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent;
    border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { max-width: 380px; width: 100%; }
  .login-card h1 { text-align: center; }
  .login-card p.subtle { text-align: center; }
  .breadcrumb { font-size: 13px; color: #666; margin-bottom: 10px; cursor: pointer; }
  .breadcrumb span { color: var(--purple); font-weight: 600; }
  .familias { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .familias button {
    background: #fff; border: 1.5px solid var(--orange); padding: 6px 14px; border-radius: 20px;
    cursor: pointer; font-size: 12px; font-weight: 700; color: var(--orange); text-transform: uppercase; letter-spacing: 0.3px;
  }
  .familias button.active { background: var(--orange); color: #fff; }
  .subtabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .subtabs button {
    background: #F1EDFB; border: 1px solid var(--border); padding: 7px 14px; border-radius: 20px;
    cursor: pointer; font-size: 13px; font-weight: 600; color: #555;
  }
  .subtabs button.active { background: var(--purple); color: #fff; border-color: var(--purple); }
  code.small { background: #F1EDFB; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>

// Claves de INSTRUMENTOS que pertenecen a una familia, en el mismo orden
// en que aparecen dentro de INSTRUMENTOS.
function _clavesDeFamilia(familia) {
  return Object.keys(INSTRUMENTOS).filter(function (k) { return INSTRUMENTOS[k].familia === familia; });
}

// Solo las familias que ya tienen al menos un instrumento cargado en
// INSTRUMENTOS (para no mostrar botones de familias todavía vacías).
function _familiasConInstrumentos() {
  return FAMILIA_ORDEN.filter(function (f) { return _clavesDeFamilia(f).length > 0; });
}

// A qué familia pertenece una entrada de INSTRUMENTOS_INSTALABLES (para
// agrupar la página admin "Instrumentos" por familia, igual que dentro de
// un proyecto). La mayoría se deriva de INSTRUMENTOS vía su primer "tipo";
// CRM e IMES son casos especiales porque no siguen ese patrón genérico.
function _familiaDeInstalable(item) {
  if (item.clave === 'CRM') return 'CRM';
  if (item.clave === 'IMES') return 'EVA';
  if (item.tipos && item.tipos.length && INSTRUMENTOS[item.tipos[0]]) return INSTRUMENTOS[item.tipos[0]].familia;
  return 'OTRO';
}

function _instalablesDeFamilia(familia) {
  return INSTRUMENTOS_INSTALABLES.filter(function (i) { return _familiaDeInstalable(i) === familia; });
}

function _familiasConInstalables() {
  return FAMILIA_ORDEN_ADMIN.filter(function (f) { return _instalablesDeFamilia(f).length > 0; });
}

/* ============================================================
 * Utilidades: hash SHA-256 y llamadas JSONP
 * ============================================================ */
async function sha256(str) {
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
}

function jsonp(action, params) {
  return new Promise(function (resolve) {
    var cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    var url = WEB_APP_URL + '?action=' + encodeURIComponent(action) + '&callback=' + cbName;
    params = params || {};
    for (var k in params) {
      if (params[k] !== undefined && params[k] !== null) {
        url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
      }
    }
    var script = document.createElement('script');
    var cleaned = false;
    function cleanup() {
      if (cleaned) return;
      cleaned = true;
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = function (data) { cleanup(); resolve(data); };
    script.onerror = function () {
      cleanup();
      resolve({ ok: false, error: 'No se pudo conectar con la plataforma (revisa tu conexión a internet).' });
    };
    setTimeout(function () {
      if (!cleaned) { cleanup(); resolve({ ok: false, error: 'La plataforma tardó demasiado en responder. Intenta de nuevo.' }); }
    }, 25000);
    script.src = url;
    document.body.appendChild(script);
  });
}

// Llamada autenticada: agrega el token automáticamente y cierra sesión si expiró.
async function api(action, params) {
  params = params || {};
  params.token = session ? session.token : '';
  var r = await jsonp(action, params);
  if (!r.ok && r.error && /sesión inválida|expirada/i.test(r.error)) {
    cerrarSesion();
    render();
  }
  return r;
}

function guardarSesion(data) {
  session = { token: data.token, email: data.email, nombre: data.nombre, rol: data.rol };
  localStorage.setItem('sintropia_session', JSON.stringify(session));
}

function cerrarSesion() {
  session = null;
  localStorage.removeItem('sintropia_session');
  state.view = 'proyectos';
  state.proyectoActivo = null;
}

function esAdmin() { return session && session.rol === 'Administrador'; }

/* ============================================================
 * Descarga de archivos generados por el backend
 * ============================================================ */
function descargarBase64(filename, mimeType, base64) {
  var link = document.createElement('a');
  link.href = 'data:' + mimeType + ';base64,' + base64;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function manejarDescargable(r) {
  if (!r.ok) { alert('No se pudo generar el descargable: ' + (r.error || 'error desconocido')); return; }
  if (r.formato === 'gdoc' || r.formato === 'gsheet') {
    window.open(r.url, '_blank');
  } else {
    descargarBase64(r.filename, r.mimeType, r.base64);
  }
}

/* ---------------- LOGIN ---------------- */
function renderLogin() {
  root.innerHTML =
    '<div class="login-wrap"><div class="card login-card">' +
      '<h1>Plataforma <span style="color:#FF7929">Sintropía</span></h1>' +
      '<p class="subtle">Acceso para equipo interno</p>' +
      '<label>Correo</label>' +
      '<input type="email" id="loginEmail" placeholder="tu@correo.com" autocomplete="username">' +
      '<label>Contraseña</label>' +
      '<div style="position:relative">' +
        '<input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" style="padding-right:66px">' +
        '<button type="button" id="btnTogglePass" style="position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--purple);font-size:12px;font-weight:700;cursor:pointer;padding:6px 8px">Mostrar</button>' +
      '</div>' +
      '<button class="primary" id="btnLogin" style="width:100%">Entrar</button>' +
      '<div id="loginMsg"></div>' +
    '</div></div>';

  document.getElementById('btnLogin').onclick = doLogin;
  document.getElementById('loginPass').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  document.getElementById('loginEmail').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  document.getElementById('btnTogglePass').onclick = function () {
    var input = document.getElementById('loginPass');
    var mostrando = input.type === 'text';
    input.type = mostrando ? 'password' : 'text';
    this.textContent = mostrando ? 'Mostrar' : 'Ocultar';
  };
}

async function doLogin() {
  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPass').value;
  var msgBox = document.getElementById('loginMsg');
  msgBox.innerHTML = '';
  if (!email || !pass) { msgBox.innerHTML = '<div class="msg error">Escribe tu correo y contraseña.</div>'; return; }

  var btn = document.getElementById('btnLogin');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Entrando...';

  var passHash = await sha256(pass);
  var r = await jsonp('login', { email: email, passHash: passHash });

  btn.disabled = false; btn.innerHTML = 'Entrar';

  if (!r.ok) { msgBox.innerHTML = '<div class="msg error">' + (r.error || 'No se pudo iniciar sesión.') + '</div>'; return; }
  guardarSesion(r);
  await cargarProyectos();
  render();
}

/* ---------------- APP SHELL ---------------- */
function renderApp() {
  var tabs = '<button data-tab="proyectos" class="' + (state.view === 'proyectos' ? 'active' : '') + '">Proyectos</button>';
  if (esAdmin()) {
    tabs += '<button data-tab="crm" class="' + (state.view === 'crm' ? 'active' : '') + '">Clientes</button>';
    tabs += '<button data-tab="usuarios" class="' + (state.view === 'usuarios' ? 'active' : '') + '">Usuarios</button>';
    tabs += '<button data-tab="instrumentos" class="' + (state.view === 'instrumentos' ? 'active' : '') + '">Instrumentos</button>';
  }
  tabs += '<button data-tab="cuenta" class="' + (state.view === 'cuenta' ? 'active' : '') + '">Mi cuenta</button>';

  root.innerHTML =
    '<header class="topbar">' +
      '<div class="brand">Plataforma <span>Sintropía</span></div>' +
      '<div class="userbox">' +
        '<span>' + escapeHtml(session.nombre) + ' &middot; <span class="badge ' + (esAdmin() ? 'admin' : 'operativo') + '">' + escapeHtml(session.rol) + '</span></span>' +
        '<button class="logout" id="btnLogout">Cerrar sesión</button>' +
      '</div>' +
    '</header>' +
    '<nav class="tabs">' + tabs + '</nav>' +
    '<main id="main"></main>';

  document.getElementById('btnLogout').onclick = function () { cerrarSesion(); render(); };
  Array.prototype.forEach.call(root.querySelectorAll('nav.tabs button'), function (b) {
    b.onclick = function () { state.view = b.getAttribute('data-tab'); state.proyectoActivo = null; renderApp(); };
  });

  renderMain();
}

function renderMain() {
  if (state.view === 'proyectos') {
    if (state.proyectoActivo) renderProyectoDetalle(); else renderProyectos();
  } else if (state.view === 'crm' && esAdmin()) {
    renderCRM();
  } else if (state.view === 'usuarios' && esAdmin()) {
    renderUsuarios();
  } else if (state.view === 'instrumentos' && esAdmin()) {
    renderInstrumentos();
  } else if (state.view === 'cuenta') {
    renderCuenta();
  }
}

async function abrirModalNuevoProyecto() {
  var opcionesEstatus = ESTATUS_PROYECTO.map(function (e) { return '<option>' + e + '</option>'; }).join('');
  var opcionesEstado = '<option value="">Selecciona un estado</option>' +
    ESTADOS_MEXICO.map(function (e) { return '<option value="' + escapeHtml(e) + '">' + escapeHtml(e) + '</option>'; }).join('');
  var opcionesTipoProyecto = '<option value="">Selecciona un tipo</option>' +
    TIPOS_PROYECTO.map(function (t) { return '<option value="' + escapeHtml(t) + '">' + escapeHtml(t) + '</option>'; }).join('');

  // Los códigos de Eje/Servicio se leen en vivo de las pestañas "Ejes" y
  // "Servicios" del Sheet. Si esas pestañas todavía no tienen datos (o no
  // existen), no bloqueamos el alta: caemos de vuelta al campo de texto
  // libre de siempre.
  var resultadosCatalogos = await Promise.all([api('listarEjes', {}), api('listarServicios', {})]);
  var rEjes = resultadosCatalogos[0], rServicios = resultadosCatalogos[1];
  var ejes = (rEjes.ok && rEjes.data && rEjes.data.length) ? rEjes.data : null;

      '</select>'
    : '<label>Código de Eje</label><input type="text" id="npEje" placeholder="ej. EJE-01">';

  var campoServicio = servicios
    ? '<label>Código de Servicio</label><select id="npServicio"><option value="">Selecciona un servicio (opcional)</option>' +
        servicios.map(function (s) { return '<option value="' + escapeHtml(s.codigo) + '">' + escapeHtml(s.codigo) + ' — ' + escapeHtml(s.nombre) + '</option>'; }).join('') +
      '</select>'
    : '<label>Código de Servicio</label><input type="text" id="npServicio" placeholder="ej. SRV-01 (opcional)">';

  var notaCatalogos = (ejes && servicios) ? '' :
    '<p class="subtle">' +
      (!ejes ? 'No se encontraron datos en la pestaña "Ejes" del Sheet (columna A = código, columna B = nombre) — captura el código de Eje a mano por ahora. ' : '') +
      (!servicios ? 'No se encontraron datos en la pestaña "Servicios" del Sheet (columna A = código, columna B = nombre) — captura el código de Servicio a mano por ahora.' : '') +
    '</p>';

  var modal = el(
    '<div class="modal-bg"><div class="modal">' +
      '<h2>Nuevo proyecto</h2>' +
      '<label>Cliente *</label><input type="text" id="npCliente">' +
      '<div class="row">' +
        '<div><label>Estado</label><select id="npEstado">' + opcionesEstado + '</select></div>' +
        '<div><label>Localidad</label><select id="npLocalidad"><option value="">Selecciona un estado primero</option></select></div>' +
      '</div>' +
      '<label>Tipo de proyecto</label><select id="npTipoProyecto">' + opcionesTipoProyecto + '</select>' +
      '<div class="row">' +
        '<div>' + campoEje + '</div>' +
        '<div>' + campoServicio + '</div>' +
      '</div>' +
      notaCatalogos +
      '<div class="row">' +
        '<div><label>Responsable</label><input type="text" id="npResponsable"></div>' +
        '<div><label>Fecha de inicio</label><input type="date" id="npFecha"></div>' +
      '</div>' +
      '<label>Estatus</label><select id="npEstatus">' + opcionesEstatus + '</select>' +
      '<div id="npMsg"></div>' +
      '<div class="modal-actions">' +
        '<button class="secondary" id="npCancelar">Cancelar</button>' +
        '<button class="primary" id="npGuardar">Crear proyecto</button>' +
      '</div>' +
    '</div></div>'
  );
  document.body.appendChild(modal);

  modal.querySelector('#npEstado').onchange = function () {
    var estado = modal.querySelector('#npEstado').value;
    var selLocalidad = modal.querySelector('#npLocalidad');
    if (!estado) { selLocalidad.innerHTML = '<option value="">Selecciona un estado primero</option>'; return; }
    var municipios = ESTADOS_MUNICIPIOS[estado] || [];
    selLocalidad.innerHTML = '<option value="">Selecciona una localidad</option>' +
      municipios.map(function (m) { return '<option value="' + escapeHtml(m) + '">' + escapeHtml(m) + '</option>'; }).join('');
  };

    await cargarProyectos();
    renderMain();
  };

async function cargarInstrumento(tipo) {
  var cfg = INSTRUMENTOS[tipo];

}

/* ---------------- SE-01: enlace de autollenado para candidatos ---------------- */
// Construye la URL pública a partir de la ubicación real de este index.html
// (así funciona sin importar el dominio/subcarpeta donde se publique) —
// candidato.html debe subirse junto a index.html en el mismo GitHub Pages.
function _urlCandidatoSE(token) {
  var base = location.href.replace(/index\.html(\?.*)?(#.*)?$/, '').replace(/\/?$/, '/');
  return base + 'candidato.html?token=' + encodeURIComponent(token);
}

function abrirModalIMESParticipante(fila) {
  var editando = !!fila;
  var respuestasPrevias = fila ? fila.respuestas : {};

  var opcionesEscala = function (valorActual) {
    return '<option value="">Selecciona…</option>' + ESCALA_IMES.map(function (o) {
      return '<option value="' + o.v + '"' + (String(valorActual) === o.v ? ' selected' : '') + '>' + o.t + '</option>';
    }).join('');
  };

  var seccionesHtml = IMES_DIMENSIONES.map(function (d) {
    var itemsHtml = d.items.map(function (it) {
      return '<label>' + it.n + '. ' + it.texto + (it.inverso ? ' <span class="subtle">(puntaje inverso)</span>' : '') + '</label>' +
        '<select id="imes_' + it.n + '">' + opcionesEscala(respuestasPrevias[String(it.n)]) + '</select>';
    }).join('');
    var abiertasHtml = d.abiertas.map(function (a) {
      var val = respuestasPrevias[a.clave] || '';
      return '<label>' + a.clave + '. ' + a.texto + '</label><textarea id="imes_' + a.clave + '">' + escapeHtml(val) + '</textarea>';
    }).join('');
    return '<h3 style="color:var(--purple);margin:16px 0 4px">Sección ' + d.clave + ' — ' + d.nombre + '</h3>' + itemsHtml + abiertasHtml;
  }).join('');

  var cierreHtml = IMES_CIERRE.map(function (c) {
    var val = respuestasPrevias[c.clave] || '';
    return '<label>' + c.clave + '. ' + c.texto + '</label><textarea id="imes_' + c.clave + '">' + escapeHtml(val) + '</textarea>';
  }).join('');

  var modal = el(
    '<div class="modal-bg"><div class="modal wide">' +
      '<h2>' + (editando ? 'Editar participante ' + escapeHtml(fila.idParticipante) : 'Agregar participante') + '</h2>' +
      '<p class="subtle">Transcribe aquí las respuestas de un formulario ya aplicado en papel (ver "Descargar instrumento vacío" en el área de Instrumentos para obtener el formulario en blanco).</p>' +
      '<div class="row">' +
        '<div><label>ID de participante (folio) *</label><input type="text" id="imes_idParticipante" value="' + (fila ? escapeHtml(fila.idParticipante) : '') + '"' + (editando ? ' disabled' : '') + '></div>' +
        '<div><label>Fecha de aplicación</label><input type="date" id="imes_fecha" value="' + (fila && fila.fecha ? escapeHtml(fila.fecha) : '') + '"></div>' +
      '</div>' +
      '<label>Aplicador</label><input type="text" id="imes_aplicador" value="' + (fila ? escapeHtml(fila.aplicador || '') : '') + '">' +
      seccionesHtml +
      '<h3 style="color:var(--purple);margin:16px 0 4px">Cierre y reflexión final</h3>' +
      cierreHtml +
      '<div id="imesMsg"></div>' +
      '<div class="modal-actions">' +
        '<button class="secondary" id="imesCancelar">Cancelar</button>' +
        '<button class="primary" id="imesGuardar">Guardar</button>' +
      '</div>' +
    '</div></div>'
  );
  document.body.appendChild(modal);
  modal.querySelector('#imesCancelar').onclick = function () { modal.remove(); };

  modal.querySelector('#imesGuardar').onclick = async function () {
    var idParticipante = document.getElementById('imes_idParticipante').value.trim();
    var msgBox = document.getElementById('imesMsg');
    if (!idParticipante) { msgBox.innerHTML = '<div class="msg error">El ID de participante (folio) es obligatorio.</div>'; return; }

    var respuestas = {};
    var faltantes = [];
    IMES_DIMENSIONES.forEach(function (d) {
      d.items.forEach(function (it) {
        var v = document.getElementById('imes_' + it.n).value;
        respuestas[String(it.n)] = v;
        if (!v) faltantes.push(it.n);
      });
      d.abiertas.forEach(function (a) {
        respuestas[a.clave] = document.getElementById('imes_' + a.clave).value;
      });
    });
    IMES_CIERRE.forEach(function (c) {
      respuestas[c.clave] = document.getElementById('imes_' + c.clave).value;
    });
    if (faltantes.length > 0) {
      msgBox.innerHTML = '<div class="msg error">Faltan por responder ' + faltantes.length + ' ítem(s) de la escala cuantitativa (1-5).</div>';
      return;
    }

    var btn = document.getElementById('imesGuardar');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Guardando...';
    var r = await api('guardarParticipanteIMES', {
      proyecto: state.proyectoActivo.codigo,
      idParticipante: idParticipante,
      fecha: document.getElementById('imes_fecha').value,
      aplicador: document.getElementById('imes_aplicador').value,
      respuestas: JSON.stringify(respuestas)
    });
    btn.disabled = false; btn.textContent = 'Guardar';
    if (!r.ok) { msgBox.innerHTML = '<div class="msg error">' + escapeHtml(r.error) + '</div>'; return; }
    modal.remove();
    await cargarInstrumento('imes');
  };
}

function escapeHtml(s) {
  // Escapa también comillas dobles/simples: este mismo resultado se usa tanto
  // dentro de texto (<td>...</td>) como dentro de atributos (value="...").
  // Sin escapar comillas, un valor guardado por el usuario que contuviera un
  // " podía "romper" el atributo value="" e inyectar atributos/eventos propios
  // (ej. onfocus=...) — esto ya quedó corregido con este cambio.
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

async function validarInstrumento(tipo) {
  var accion = INSTRUMENTOS[tipo].validar;
  var r = await api(accion, { proyecto: state.proyectoActivo.codigo });
  var box = document.getElementById('validacionBox');
  if (!r.ok) { box.innerHTML = '<div class="msg error">' + r.error + '</div>'; return; }
  var html = '';
  if (r.bloqueantes.length === 0 && r.advertencias.length === 0) {
    html = '<div class="msg ok">No se detectaron errores ni advertencias. Listo para generar el documento.</div>';
  } else {
    if (r.bloqueantes.length > 0) {
      html += '<div class="msg error"><strong>Errores (impiden generar el documento):</strong><ul style="margin:6px 0 0;padding-left:18px">' +
        r.bloqueantes.map(function (b) { return '<li>' + escapeHtml(b) + '</li>'; }).join('') + '</ul></div>';
    }
    if (r.advertencias.length > 0) {
      html += '<div class="msg info"><strong>Advertencias (no bloquean):</strong><ul style="margin:6px 0 0;padding-left:18px">' +
        r.advertencias.map(function (a) { return '<li>' + escapeHtml(a) + '</li>'; }).join('') + '</ul></div>';
    }
  }
  box.innerHTML = html;
}

async function generarDescargable(tipo) {
  var formato = document.getElementById('selFormato').value;
  var accion = INSTRUMENTOS[tipo].descargar;
  var btn = document.getElementById('btnGenerar');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Generando...';
  var r = await api(accion, { proyecto: state.proyectoActivo.codigo, formato: formato });
  btn.disabled = false; btn.textContent = 'Generar descargable';
  if (!r.ok) {
    var box = document.getElementById('validacionBox');
    var extra = r.bloqueantes ? '<ul style="margin:6px 0 0;padding-left:18px">' + r.bloqueantes.map(function (b) { return '<li>' + escapeHtml(b) + '</li>'; }).join('') + '</ul>' : '';
    box.innerHTML = '<div class="msg error">' + r.error + extra + '</div>';
    return;
  }
  manejarDescargable(r);
}

// Familias de instrumentos donde se ofrece ayuda de IA al llenar (las más
// narrativas: diagnóstico, teoría de cambio, planeación, indicadores,
// evaluación, pedagogía). Reutiliza el mismo Gemini del mailing — cualquier
// Aplicador o Administrador con sesión puede usarla, no solo Administrador.
var INSTRUMENTOS_IA_FAMILIAS = ['DIA', 'TER', 'PLA', 'IND', 'EVA', 'PED'];

// opts (todos opcionales): { proyecto: '...', extra: {...}, alGuardar: async fn, titulo: '...' }
// Sin opts, se comporta igual que antes (instrumento dentro de un proyecto).
function abrirModalFila(tipo, fila, opts) {
  opts = opts || {};
  var cfg = _cfgTipo(tipo);
  var editando = !!fila;
  var conIA = INSTRUMENTOS_IA_FAMILIAS.indexOf(cfg.familia) !== -1;
  var proyectoCodigo = ('proyecto' in opts) ? opts.proyecto : (state.proyectoActivo ? state.proyectoActivo.codigo : '');

  var camposHtml = cfg.campos.map(function (c) {
    var id = 'f_' + c.key;
    var val = fila ? (fila[c.key] != null ? fila[c.key] : '') : '';
    if (c.tipo === 'select') {
      var opts2 = c.opciones.map(function (o) {
        return '<option ' + (fila && fila[c.key] === o ? 'selected' : '') + '>' + o + '</option>';
      }).join('');
      return '<label>' + c.label + '</label><select id="' + id + '">' + opts2 + '</select>';
    }
    // Estado/Municipio de México en cascada — mismo catálogo ESTADOS_MUNICIPIOS
    // que ya usa el alta de Proyecto. El <select> de municipio se llena vacío
    // (o precargado con los municipios del estado ya guardado) aquí mismo;
    // el cambio dinámico al elegir otro estado lo conecta _wireEstadoMunicipio
    // después de insertar el modal en el DOM.
    if (c.tipo === 'select-estado') {
      var optsEstado = '<option value="">Selecciona un estado</option>' +
        ESTADOS_MEXICO.map(function (e) {
          return '<option value="' + escapeHtml(e) + '"' + (val === e ? ' selected' : '') + '>' + escapeHtml(e) + '</option>';
        }).join('');
      return '<label>' + c.label + '</label><select id="' + id + '">' + optsEstado + '</select>';
    }
    if (c.tipo === 'select-municipio') {
      var estadoDeLaFila = fila ? (fila.estado || '') : '';
      var municipiosDeLaFila = ESTADOS_MUNICIPIOS[estadoDeLaFila] || [];
      var optsMunicipio = '<option value="">' + (estadoDeLaFila ? 'Selecciona un municipio' : 'Selecciona un estado primero') + '</option>' +
        municipiosDeLaFila.map(function (m) {
          return '<option value="' + escapeHtml(m) + '"' + (val === m ? ' selected' : '') + '>' + escapeHtml(m) + '</option>';
        }).join('');
      return '<label>' + c.label + '</label><select id="' + id + '">' + optsMunicipio + '</select>';
    }
    if (c.tipo === 'textarea') {
      var btnIA = conIA ? ' <button type="button" class="small secondary btn-ia-campo" data-campo-key="' + c.key + '" style="padding:1px 8px;font-size:12px">✨ IA</button>' : '';
      var panelIA = conIA ? '<div class="panelIACampo hidden" data-campo-key="' + c.key + '" style="background:#F4F0FE;border-radius:6px;padding:8px 10px;margin:4px 0 8px">' +
        '<input type="text" class="iaCampoInstruccion" placeholder="¿Qué quieres que diga este campo?" style="width:100%;margin-bottom:6px;box-sizing:border-box">' +
        '<div style="display:flex;gap:6px"><button type="button" class="small secondary iaCampoCancelar">Cancelar</button><button type="button" class="small primary iaCampoGenerar">Generar</button></div>' +
        '<div class="iaCampoMsg" style="margin-top:4px"></div>' +
      '</div>' : '';
      return '<label>' + c.label + btnIA + '</label>' + panelIA + '<textarea id="' + id + '">' + escapeHtml(val) + '</textarea>';
    }
    return '<label>' + c.label + '</label><input type="' + c.tipo + '" id="' + id + '" value="' + escapeHtml(val) + '"' +
      (c.placeholder ? ' placeholder="' + c.placeholder + '"' : '') + '>';
  }).join('');

  var panelEstructurarHtml = conIA ?
    '<div style="margin-bottom:14px">' +
      '<button type="button" class="small secondary" id="btnAbrirIAEstructurar">✨ Llenar con IA desde notas</button>' +
      '<div id="panelIAEstructurar" class="hidden" style="background:#F4F0FE;border-radius:8px;padding:12px 14px;margin-top:8px">' +
        '<label style="font-weight:600">Pega o escribe notas (entrevista, visita de campo, observación...)</label>' +
        '<textarea id="notasIAEstructurar" style="width:100%;min-height:100px;box-sizing:border-box" placeholder="La IA repartirá lo relevante entre los campos de texto de este formulario. Los campos de catálogo/menú no se tocan."></textarea>' +
        '<div style="display:flex;gap:8px;margin-top:8px"><button type="button" class="small secondary" id="btnCancelarIAEstructurar">Cancelar</button><button type="button" class="small primary" id="btnGenerarIAEstructurar">Repartir en los campos</button></div>' +
        '<div id="iaEstructurarMsg" style="margin-top:6px"></div>' +
      '</div>' +
    '</div>' : '';

  // Las fotos se suben aparte (POST directo, no cabe en la URL de jsonp()) y
  // solo una vez que la fila ya existe, porque hace falta su código para
  // saber en qué renglón anotar la URL resultante.
  var fotosHtml = !cfg.fotos ? '' : (!editando ?
    '<p class="subtle" style="margin:14px 0">Guarda la ficha primero — después podrás subir aquí las fotos.</p>' :
    '<div style="margin:16px 0"><h3 style="margin:0 0 8px;font-size:15px">Fotos</h3>' +
      cfg.fotos.map(function (f) {
        var urlActual = fila[f.urlKey];
        return '<div class="foto-slot" data-foto-key="' + f.key + '" style="border:1.5px solid #eee;border-radius:8px;padding:10px 12px;margin-bottom:8px">' +
          '<label style="margin-top:0">' + f.label + '</label>' +
          (urlActual ? '<div style="margin-bottom:6px"><a href="' + escapeHtml(urlActual) + '" target="_blank" rel="noopener">Ver foto actual</a></div>' :
            '<div class="subtle" style="margin-bottom:6px">Sin foto todavía.</div>') +
          '<input type="file" accept="image/jpeg,image/png,image/webp" class="foto-input">' +
          '<button type="button" class="small secondary foto-subir" style="margin-left:8px">Subir foto</button>' +
          '<div class="foto-msg" style="margin-top:6px"></div>' +
        '</div>';
      }).join('') +
    '</div>');

  var modal = el(
    '<div class="modal-bg"><div class="modal">' +
      '<h2>' + (editando ? 'Editar ' + (opts.titulo || 'fila') + ' ' + fila.codigo : 'Agregar ' + (opts.titulo || 'fila')) + '</h2>' +
      panelEstructurarHtml +
      camposHtml +
      fotosHtml +
      '<div id="filaMsg"></div>' +
      '<div class="modal-actions">' +
        '<button class="secondary" id="filaCancelar">Cancelar</button>' +
        '<button class="primary" id="filaGuardar">Guardar</button>' +
      '</div>' +
    '</div></div>'
  );
  document.body.appendChild(modal);
  modal.querySelector('#filaCancelar').onclick = function () { modal.remove(); };

  if (conIA) _wireIAInstrumento(modal, cfg, tipo);
  if (cfg.fotos && editando) _wireFotosInstrumento(modal, cfg, tipo, proyectoCodigo, fila.codigo);
  _wireEstadoMunicipio(modal);

  modal.querySelector('#filaGuardar').onclick = async function () {
    var btn = modal.querySelector('#filaGuardar');
    var msgBox = modal.querySelector('#filaMsg');
    var params = {};
    if (proyectoCodigo) params.proyecto = proyectoCodigo;
    if (opts.extra) Object.keys(opts.extra).forEach(function (k) { params[k] = opts.extra[k]; });
    if (editando) params.codigo = fila.codigo;

    var faltante = null;
    cfg.campos.forEach(function (c) {
      var elx = modal.querySelector('#f_' + c.key);
      var v = elx.value;
      if (c.tipo !== 'select' && c.tipo !== 'select-estado' && c.tipo !== 'select-municipio' && c.tipo !== 'date') v = v.trim();
      if (c.requerido && !v && !faltante) faltante = c.label;
      params[c.key] = v;
    });
    if (faltante) { msgBox.innerHTML = '<div class="msg error">El campo "' + faltante.replace(' *', '') + '" no puede estar vacío.</div>'; return; }

    btn.disabled = true; btn.textContent = 'Guardando...';
    var r = await api(cfg.guardar, params);
    if (!r.ok) { msgBox.innerHTML = '<div class="msg error">' + r.error + '</div>'; btn.disabled = false; btn.textContent = 'Guardar'; return; }
    modal.remove();
    if (opts.alGuardar) { await opts.alGuardar(); } else { await cargarInstrumento(tipo); }
  };
}

// Si el modal tiene un campo "estado" (select-estado) y uno "municipio"
// (select-municipio) — hoy solo CRM_Interesados, pero cualquier instrumento
// futuro con ambas claves lo obtiene gratis — conecta el cambio de estado
// para recargar las opciones de municipio, igual que ya hace el alta de
// Proyecto con #npEstado/#npLocalidad.
function _wireEstadoMunicipio(modal) {
  var selEstado = modal.querySelector('#f_estado');
  var selMunicipio = modal.querySelector('#f_municipio');
  if (!selEstado || !selMunicipio || selEstado.tagName !== 'SELECT') return;
  selEstado.onchange = function () {
    var municipios = ESTADOS_MUNICIPIOS[selEstado.value] || [];
    selMunicipio.innerHTML = '<option value="">' + (selEstado.value ? 'Selecciona un municipio' : 'Selecciona un estado primero') + '</option>' +
      municipios.map(function (m) { return '<option value="' + escapeHtml(m) + '">' + escapeHtml(m) + '</option>'; }).join('');

// Conecta los dos modos de ayuda de IA dentro del modal de abrirModalFila:
// redactar un campo de texto libre desde una instrucción corta, y repartir
// notas largas entre varios campos de texto libre a la vez. En ningún caso
// se guarda nada solo — únicamente llena el formulario para que la persona
// lo revise antes de darle a "Guardar".
function _wireIAInstrumento(modal, cfg, tipo) {
  // --- Campo por campo ---
  Array.prototype.forEach.call(modal.querySelectorAll('.btn-ia-campo'), function (btn) {
    btn.onclick = function () {
      var key = btn.getAttribute('data-campo-key');
      var panel = modal.querySelector('.panelIACampo[data-campo-key="' + key + '"]');
      panel.classList.toggle('hidden');
      if (!panel.classList.contains('hidden')) panel.querySelector('.iaCampoInstruccion').focus();
    };
  });
  Array.prototype.forEach.call(modal.querySelectorAll('.iaCampoCancelar'), function (btn) {
    btn.onclick = function () { btn.closest('.panelIACampo').classList.add('hidden'); };
  });
  Array.prototype.forEach.call(modal.querySelectorAll('.iaCampoGenerar'), function (btn) {
    btn.onclick = async function () {
      var panel = btn.closest('.panelIACampo');
      var key = panel.getAttribute('data-campo-key');
      var campoCfg = cfg.campos.filter(function (c) { return c.key === key; })[0];
      var instruccion = panel.querySelector('.iaCampoInstruccion').value.trim();
      var msgBox = panel.querySelector('.iaCampoMsg');
      if (!instruccion) { msgBox.innerHTML = '<div class="msg error">Escribe qué quieres que diga este campo.</div>'; return; }
      var contexto = {};
      cfg.campos.forEach(function (c) {
        if (c.key === key) return;
        var elx = modal.querySelector('#f_' + c.key);
        if (elx && elx.value && elx.value.trim()) contexto[c.label.replace(/\s*\*\s*$/, '')] = elx.value.trim();
      });
      btn.disabled = true; btn.textContent = 'Generando...'; msgBox.innerHTML = '';
      var r = await api('generarCampoInstrumentoIA', {
        instrumentoLabel: cfg.titulo,
        campoLabel: campoCfg ? campoCfg.label.replace(/\s*\*\s*$/, '') : key,
        instruccion: instruccion,
        contexto: JSON.stringify(contexto)
      });
      btn.disabled = false; btn.textContent = 'Generar';
      if (!r.ok) { msgBox.innerHTML = '<div class="msg error">' + r.error + '</div>'; return; }
      modal.querySelector('#f_' + key).value = r.texto;
      panel.classList.add('hidden');
    };
  });

  // --- Repartir notas largas entre varios campos ---
  var btnAbrir = modal.querySelector('#btnAbrirIAEstructurar');
  if (!btnAbrir) return;
  var panelE = modal.querySelector('#panelIAEstructurar');
  btnAbrir.onclick = function () {
    panelE.classList.toggle('hidden');
    if (!panelE.classList.contains('hidden')) modal.querySelector('#notasIAEstructurar').focus();
  };
  modal.querySelector('#btnCancelarIAEstructurar').onclick = function () { panelE.classList.add('hidden'); };
  modal.querySelector('#btnGenerarIAEstructurar').onclick = async function () {
    var notas = modal.querySelector('#notasIAEstructurar').value.trim();
    var msgBox = modal.querySelector('#iaEstructurarMsg');
    if (!notas) { msgBox.innerHTML = '<div class="msg error">Pega o escribe las notas primero.</div>'; return; }
    var camposTexto = cfg.campos.filter(function (c) { return c.tipo !== 'select'; })
      .map(function (c) { return { key: c.key, label: c.label.replace(/\s*\*\s*$/, '') }; });

    var btn = modal.querySelector('#btnGenerarIAEstructurar');
    btn.disabled = true; btn.textContent = 'Repartiendo...'; msgBox.innerHTML = '';
    var r = await api('estructurarInstrumentoIA', {
      instrumentoLabel: cfg.titulo,
      notas: notas,
      campos: JSON.stringify(camposTexto)
    });
    btn.disabled = false; btn.textContent = 'Repartir en los campos';
    if (!r.ok) { msgBox.innerHTML = '<div class="msg error">' + r.error + '</div>'; return; }

    var llenados = 0;
    Object.keys(r.campos || {}).forEach(function (key) {
      var valor = r.campos[key];
      if (!valor || !String(valor).trim()) return;
      var elx = modal.querySelector('#f_' + key);
      if (!elx) return;
      elx.value = String(valor).trim();
      llenados++;
    });
    msgBox.innerHTML = llenados
      ? '<div class="msg ok">Se llenaron ' + llenados + ' campo(s) — revísalos antes de guardar.</div>'
      : '<div class="msg error">No se encontró información en las notas para ningún campo.</div>';
    if (llenados) panelE.classList.add('hidden');
  };
}

/* ---------------- FOTOS (SE-01 foto infantil, SE-07 evidencia) ----------------
 * Van por POST directo al Web App (no por jsonp(), que manda todo por la URL
 * y no aguanta el tamaño de una foto real) — ver doPost/apiSubirFotoInstrumento
 * en WebApp.gs. Content-Type: text/plain evita que el navegador dispare una
 * petición de verificación (preflight) que Apps Script no sabe responder.
 * ------------------------------------------------------------------------- */

function _leerArchivoComoBase64(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () {
      var resultado = String(reader.result || '');
      var coma = resultado.indexOf(',');
      resolve(coma >= 0 ? resultado.slice(coma + 1) : resultado);
    };
    reader.onerror = function () { reject(new Error('No se pudo leer el archivo.')); };
    reader.readAsDataURL(file);
  });
}

async function _subirFotoInstrumento(instrumento, campo, proyecto, codigo, file) {
  if (!file) return { ok: false, error: 'Selecciona una foto primero.' };
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return { ok: false, error: 'Solo se aceptan fotos JPG, PNG o WEBP.' };
  if (file.size > 8 * 1024 * 1024) return { ok: false, error: 'La foto es demasiado pesada (máximo 8MB) — comprímela o usa una de menor resolución.' };
  var base64;
  try { base64 = await _leerArchivoComoBase64(file); } catch (eLeer) { return { ok: false, error: eLeer.message }; }
  try {
    var resp = await fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'subirFotoInstrumento', token: session ? session.token : '',
        instrumento: instrumento, campo: campo, proyecto: proyecto, codigo: codigo,
        archivoBase64: base64, mimeType: file.type
      })
    });
    return await resp.json();
  } catch (eRed) {
    return { ok: false, error: 'No se pudo conectar con la plataforma para subir la foto (revisa tu conexión a internet).' };
  }
}

function _wireFotosInstrumento(modal, cfg, tipo, proyectoCodigo, codigoFila) {
  Array.prototype.forEach.call(modal.querySelectorAll('.foto-slot'), function (slot) {
    var key = slot.getAttribute('data-foto-key');
    var input = slot.querySelector('.foto-input');
    var btn = slot.querySelector('.foto-subir');
    var msgBox = slot.querySelector('.foto-msg');
    btn.onclick = async function () {
      var file = input.files[0];
      btn.disabled = true; var textoOriginal = btn.textContent; btn.textContent = 'Subiendo...'; msgBox.innerHTML = '';
      var r = await _subirFotoInstrumento(tipo, key, proyectoCodigo, codigoFila, file);
      btn.disabled = false; btn.textContent = textoOriginal;
      if (!r.ok) { msgBox.innerHTML = '<div class="msg error">' + r.error + '</div>'; return; }
      msgBox.innerHTML = '<div class="msg ok">Foto subida — <a href="' + escapeHtml(r.url) + '" target="_blank" rel="noopener">verla</a>.</div>';
    };
  });
}

/* ---------------- IMPORTAR ARCHIVO (CSV / Excel) ----------------
 * Genérico para cualquier instrumento de una sola tabla: reutiliza
 * cfg.campos (misma configuración del modal "Agregar fila") para
 * mapear las columnas del archivo, arma lotes pequeños y llama a la
 * acción de backend "importarFilas" (que a su vez reutiliza la
 * función guardarFilaXXX de ese instrumento fila por fila).
 * ------------------------------------------------------------- */

function _normalizarTexto(s) {
  var base = String(s == null ? '' : s).normalize('NFD');
  var sinAcentos = '';
  for (var i = 0; i < base.length; i++) {
    var code = base.charCodeAt(i);
    if (code >= 768 && code <= 879) continue; // marcas diacríticas combinadas (tildes, diéresis, etc.)
    sinAcentos += base.charAt(i);
  }
  return sinAcentos.toLowerCase().replace(/\s*\*\s*$/, '').trim().replace(/\s+/g, ' ');
}

function _parseCSV(texto) {
  var primeraLinea = (texto.split(/\r\n|\n|\r/)[0] || '');
  var delim = (primeraLinea.split(';').length > primeraLinea.split(',').length) ? ';' : ',';
  var filas = [], fila = [], campo = '', enComillas = false;
  for (var i = 0; i < texto.length; i++) {
    var c = texto[i];
    if (enComillas) {
      if (c === '"') {
        if (texto[i + 1] === '"') { campo += '"'; i++; } else { enComillas = false; }
      } else { campo += c; }
    } else if (c === '"') {
      enComillas = true;
    } else if (c === delim) {
      fila.push(campo); campo = '';
    } else if (c === '\n' || c === '\r') {
      if (c === '\r' && texto[i + 1] === '\n') i++;
      fila.push(campo); campo = '';
      filas.push(fila); fila = [];
    } else {
      campo += c;
    }
  }
  if (campo !== '' || fila.length > 0) { fila.push(campo); filas.push(fila); }
  return filas.filter(function (f) { return f.some(function (c) { return String(c).trim() !== ''; }); });
}

var _xlsxCargando = null;
function _cargarXLSX() {
  if (window.XLSX) return Promise.resolve();
  if (_xlsxCargando) return _xlsxCargando;
  _xlsxCargando = new Promise(function (resolve, reject) {
    var script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.onload = function () { resolve(); };
    script.onerror = function () { _xlsxCargando = null; reject(new Error('No se pudo cargar el lector de Excel (revisa tu conexión a internet). Puedes exportar tu archivo como CSV e intentar de nuevo.')); };
    document.body.appendChild(script);
  });
  return _xlsxCargando;
}

function _leerArchivoComoTabla(file) {
  var nombre = file.name.toLowerCase();
  if (nombre.endsWith('.csv')) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(_parseCSV(String(reader.result))); };
      reader.onerror = function () { reject(new Error('No se pudo leer el archivo.')); };
      reader.readAsText(file, 'UTF-8');
    });
  }
  return _cargarXLSX().then(function () {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var datos = new Uint8Array(reader.result);
          var wb = XLSX.read(datos, { type: 'array' });
          var hoja = wb.Sheets[wb.SheetNames[0]];
          var tabla = XLSX.utils.sheet_to_json(hoja, { header: 1, raw: false, defval: '' });
          resolve(tabla.filter(function (f) { return f.some(function (c) { return String(c).trim() !== ''; }); }));
        } catch (e) { reject(new Error('No se pudo leer el archivo Excel: ' + e.message)); }
      };
      reader.onerror = function () { reject(new Error('No se pudo leer el archivo.')); };
      reader.readAsArrayBuffer(file);
    });
  });
}

function _mapearColumnas(headerRow, campos) {
  return headerRow.map(function (h) {
    var hn = _normalizarTexto(h);
    if (!hn) return null;
    var match = campos.filter(function (c) {
      return _normalizarTexto(c.label) === hn || _normalizarTexto(c.key) === hn;
    })[0];
    return match ? match.key : null;
  });
}

function _filasDesdeTabla(tabla, campos) {
  if (!tabla.length) return { filas: [], noReconocidas: [], faltantes: [] };
  var headerRow = tabla[0];
  var mapa = _mapearColumnas(headerRow, campos);
  var noReconocidas = headerRow.filter(function (h, i) { return h && String(h).trim() && !mapa[i]; });
  var reconocidas = {};
  mapa.forEach(function (k) { if (k) reconocidas[k] = true; });
  var faltantes = campos.filter(function (c) { return c.requerido && !reconocidas[c.key]; })
    .map(function (c) { return c.label.replace(/\s*\*\s*$/, ''); });

  var filas = [];
  for (var r = 1; r < tabla.length; r++) {
    var fila = {}, vacia = true;
    mapa.forEach(function (k, i) {
      if (!k) return;
      var v = tabla[r][i] != null ? String(tabla[r][i]).trim() : '';
      if (v !== '') vacia = false;
      fila[k] = v;
    });
    if (!vacia) filas.push(fila);
  }
  return { filas: filas, noReconocidas: noReconocidas, faltantes: faltantes };
}

function _csvEscape(v) {
  v = String(v == null ? '' : v);
  if (/["\n,;]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
  return v;
}

function descargarPlantilla(tipo) {
  var cfg = _cfgTipo(tipo);
  var headers = cfg.campos.map(function (c) { return c.label.replace(/\s*\*\s*$/, ''); });
  var csv = headers.map(_csvEscape).join(',') + '\r\n';
  var blob = new Blob([String.fromCharCode(65279) + csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'plantilla_' + tipo + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}

// opts (opcional): { proyecto: '...', alTerminar: async fn }. Sin opts,
// se comporta igual que antes (instrumento dentro de un proyecto).
function abrirModalImportar(tipo, opts) {
  opts = opts || {};
  var cfg = _cfgTipo(tipo);
  var estado = { filas: [] };

  var modal = el(
    '<div class="modal-bg"><div class="modal wide">' +
      '<h2>Importar filas — ' + cfg.titulo + '</h2>' +
      '<p class="subtle">Sube un archivo CSV o Excel (.xlsx) con una fila por registro. La primera fila del archivo debe traer los nombres de columna — pueden coincidir con la etiqueta del campo tal como aparece en el formulario de "Agregar fila".</p>' +
      '<p><button class="secondary" type="button" id="btnPlantilla">Descargar plantilla (CSV)</button></p>' +
      '<label>Archivo</label><input type="file" id="impArchivo" accept=".csv,.xlsx,.xls">' +
      '<div id="impPreview"></div>' +
      '<div id="impMsg"></div>' +
      '<div class="modal-actions">' +
        '<button class="secondary" id="impCancelar">Cancelar</button>' +
        '<button class="primary" id="impConfirmar" disabled>Confirmar e importar</button>' +
      '</div>' +
    '</div></div>'
  );
  document.body.appendChild(modal);
  modal.querySelector('#impCancelar').onclick = function () { modal.remove(); };
  modal.querySelector('#btnPlantilla').onclick = function () { descargarPlantilla(tipo); };

  modal.querySelector('#impArchivo').onchange = async function (ev) {
    var file = ev.target.files[0];
    var previewBox = modal.querySelector('#impPreview');
    var msgBox = modal.querySelector('#impMsg');
    var confirmarBtn = modal.querySelector('#impConfirmar');
    confirmarBtn.disabled = true;
    msgBox.innerHTML = '';
    estado.filas = [];
    if (!file) { previewBox.innerHTML = ''; return; }
    previewBox.innerHTML = '<p class="subtle">Leyendo archivo...</p>';
    try {
      var tabla = await _leerArchivoComoTabla(file);
      var res = _filasDesdeTabla(tabla, cfg.campos);
      estado.filas = res.filas;

      var previewFilas = res.filas.slice(0, 15);
      var thead = '<tr>' + cfg.campos.map(function (c) { return '<th>' + c.label.replace(/\s*\*\s*$/, '') + '</th>'; }).join('') + '</tr>';
      var trs = previewFilas.map(function (f) {
        return '<tr>' + cfg.campos.map(function (c) { return '<td>' + escapeHtml(f[c.key] || '') + '</td>'; }).join('') + '</tr>';
      }).join('');

      var avisos = '';
      if (res.faltantes.length) {
        avisos += '<div class="msg error">No se encontró una columna para estos campos obligatorios: ' + res.faltantes.join(', ') + '. Corrige los nombres de columna en el archivo antes de importar.</div>';
      }
      if (res.noReconocidas.length) {
        avisos += '<div class="msg info">Estas columnas del archivo no coinciden con ningún campo del formulario y se ignorarán: ' + res.noReconocidas.join(', ') + '.</div>';
      }

      previewBox.innerHTML =
        '<p class="subtle">' + res.filas.length + ' fila(s) detectada(s)' + (res.filas.length > 15 ? ' (mostrando las primeras 15)' : '') + '.</p>' +
        avisos +
        (res.filas.length ? '<div style="overflow-x:auto"><table><thead>' + thead + '</thead><tbody>' + trs + '</tbody></table></div>' : '');

      confirmarBtn.disabled = !(res.filas.length > 0 && res.faltantes.length === 0);
    } catch (e) {
      previewBox.innerHTML = '';
      msgBox.innerHTML = '<div class="msg error">' + e.message + '</div>';
    }
  };

  modal.querySelector('#impConfirmar').onclick = async function () {
    var btn = modal.querySelector('#impConfirmar');
    var msgBox = modal.querySelector('#impMsg');
    btn.disabled = true;

    var lotes = [], loteActual = [], tamanoActual = 0;
    estado.filas.forEach(function (f) {
      var tam = JSON.stringify(f).length;
      if (loteActual.length && tamanoActual + tam > 3000) { lotes.push(loteActual); loteActual = []; tamanoActual = 0; }
      loteActual.push(f); tamanoActual += tam;
    });
    if (loteActual.length) lotes.push(loteActual);

    var proyectoCodigo = ('proyecto' in opts) ? opts.proyecto : (state.proyectoActivo ? state.proyectoActivo.codigo : '');
    var creadas = 0, procesadas = 0, errores = [];
    for (var i = 0; i < lotes.length; i++) {
      msgBox.innerHTML = '<div class="msg info">Importando... lote ' + (i + 1) + ' de ' + lotes.length + ' (' + procesadas + '/' + estado.filas.length + ' procesadas)</div>';
      var paramsImp = { tipo: tipo, filas: JSON.stringify(lotes[i]) };
      if (proyectoCodigo) paramsImp.proyecto = proyectoCodigo;
      var r = await api('importarFilas', paramsImp);
      procesadas += lotes[i].length;
      if (!r.ok) { errores.push(r.error || 'Error desconocido en un lote.'); continue; }
      creadas += r.creadas || 0;
      if (r.errores && r.errores.length) errores = errores.concat(r.errores);
    }

    msgBox.innerHTML = '<div class="msg ' + (errores.length ? 'info' : 'ok') + '">Se importaron ' + creadas + ' de ' + estado.filas.length + ' fila(s).' +
      (errores.length ? ' ' + errores.length + ' con problemas:<ul style="margin:6px 0 0;padding-left:18px">' +
        errores.slice(0, 20).map(function (e) { return '<li>' + escapeHtml(e) + '</li>'; }).join('') + '</ul>' : '') +
      ' Recuerda usar "Validar" para revisar filas incompletas.</div>';
    btn.textContent = 'Cerrar';
    btn.disabled = false;
    btn.onclick = async function () { modal.remove(); if (opts.alTerminar) { await opts.alTerminar(); } else { await cargarInstrumento(tipo); } };
  };
}

/* ---------------- CRM: Clientes / prospectos / interesados (solo Administrador) ----------------
 * No está ligado a ningún proyecto. Dos sub-vistas dentro de la misma
 * pestaña "Clientes" del menú: Clientes/prospectos (con su historial de
 * Seguimientos, consultado desde el detalle de cada uno para no
 * amontonar columnas) e Interesados (registro genérico de leads).
 * ------------------------------------------------------------------ */

async function cargarCRMClientes() {
  var resultados = await Promise.all([
    api('listarCRMClientes', {}),
    api('listarTodosCRMSeguimientos', {})
  ]);
  var r = resultados[0], rSeg = resultados[1];
  if (r.ok) state.crmClientes = r.data;
  if (rSeg.ok) state.crmSeguimientosTodos = rSeg.data;
}

// Devuelve el seguimiento más reciente de un cliente (o null si no tiene
// ninguno todavía), comparando por fechaOrden (ISO) para que el orden
// cronológico sea correcto sin importar el formato de "fecha" en pantalla.
function _ultimoSeguimientoDe(clienteCodigo) {
  var deEsteCliente = state.crmSeguimientosTodos.filter(function (s) { return s.clienteCodigo === clienteCodigo; });
  if (!deEsteCliente.length) return null;
  deEsteCliente.sort(function (a, b) { return (b.fechaOrden || '').localeCompare(a.fechaOrden || ''); });
  return deEsteCliente[0];
}

async function cargarCRMInteresados() {
  var r = await api('listarCRMInteresados', {});
  if (r.ok) state.crmInteresados = r.data;
}

async function renderCRM() {
  var main = document.getElementById('main');
  main.innerHTML =
    '<div class="subtabs">' +
      '<button data-crmsub="clientes" class="' + (state.crmSubview === 'clientes' ? 'active' : '') + '">Clientes / prospectos</button>' +
      '<button data-crmsub="interesados" class="' + (state.crmSubview === 'interesados' ? 'active' : '') + '">Interesados</button>' +
    '</div>' +
    '<div id="crmContent"><p class="subtle">Cargando...</p></div>';
  Array.prototype.forEach.call(main.querySelectorAll('[data-crmsub]'), function (b) {
    b.onclick = function () { state.crmSubview = b.getAttribute('data-crmsub'); renderCRM(); };
  });
  if (state.crmSubview === 'clientes') { await renderCRMClientes(); } else { await renderCRMInteresados(); }
}

/* ---- Clientes / prospectos ---- */

async function renderCRMClientes() {
  await cargarCRMClientes();
  renderCRMClientesTabla();
}

// El "shell" (barra de herramientas, buscador, chips de estatus) solo se
// construye una vez: así escribir en el buscador no reconstruye el <input>
// en cada tecla (lo que le haría perder el foco). Solo se vuelve a dibujar
// #crmClientesResultados al filtrar/buscar.
function renderCRMClientesTabla() {
  var box = document.getElementById('crmContent');
  if (!box) return;

  if (!box.querySelector('#crmClientesShell')) {
    var chips = ['Todos'].concat(ESTATUS_CRM).map(function (e) {
      return '<button data-filtro="' + escapeHtml(e) + '">' + escapeHtml(e) + '</button>';
    }).join('');
    box.innerHTML =
      '<div id="crmClientesShell">' +
        '<div class="toolbar" style="justify-content:space-between;flex-wrap:wrap;gap:8px">' +
          '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
            '<button class="secondary" id="btnNuevoCliente">+ Agregar cliente</button>' +
            '<button class="secondary" id="btnImportarClientes">Importar archivo</button>' +
            '<button class="secondary" id="btnExportarClientes">Exportar a Excel</button>' +
            '<button class="primary" id="btnEnviarCorreoClientes">Enviar correo</button>' +
          '</div>' +
          '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
            '<select id="filtroEjeCliente">' +
              '<option value="Todos">Todos los ejes de interés</option>' +
              EJES_INTERES_CRM.map(function (e) { return '<option value="' + escapeHtml(e) + '">' + escapeHtml(e) + '</option>'; }).join('') +
            '</select>' +
            '<input type="text" id="buscarCliente" placeholder="Buscar por organización, contacto o correo..." style="max-width:280px">' +
          '</div>' +
        '</div>' +
        '<div class="familias" id="crmChips" style="margin-top:10px">' + chips + '</div>' +
        '<div id="crmClientesResultados"></div>' +
      '</div>';

    document.getElementById('btnNuevoCliente').onclick = function () { abrirModalCliente(null); };
    document.getElementById('btnImportarClientes').onclick = function () {
      abrirModalImportar('crm_clientes', { proyecto: '', alTerminar: async function () { await renderCRMClientes(); } });
    };
    document.getElementById('btnExportarClientes').onclick = async function () {
      var r = await api('exportarCRMClientes', { formato: 'xlsx' });
      manejarDescargable(r);
    };
    document.getElementById('btnEnviarCorreoClientes').onclick = function () {
      if (!state.crmClientesSeleccion.length) { alert('Marca la casilla de al menos un cliente para enviarle un correo.'); return; }
      abrirModalEnviarCorreo('clientes', state.crmClientesSeleccion.slice());
    };
    var buscarInput = document.getElementById('buscarCliente');
    buscarInput.value = state.crmBusqueda;
    buscarInput.oninput = function () { state.crmBusqueda = buscarInput.value; _renderCRMClientesResultados(); };
    var filtroEjeSel = document.getElementById('filtroEjeCliente');
    filtroEjeSel.value = state.crmFiltroEje;
    filtroEjeSel.onchange = function () { state.crmFiltroEje = filtroEjeSel.value; _renderCRMClientesResultados(); };
    Array.prototype.forEach.call(box.querySelectorAll('[data-filtro]'), function (b) {
      b.onclick = function () { state.crmFiltroEstatus = b.getAttribute('data-filtro'); _marcarChipCRMActivo(); _renderCRMClientesResultados(); };
    });
  }
  _marcarChipCRMActivo();
  _renderCRMClientesResultados();
}

function _marcarChipCRMActivo() {
  var box = document.getElementById('crmChips');
  if (!box) return;
  Array.prototype.forEach.call(box.querySelectorAll('button'), function (b) {
    b.classList.toggle('active', b.getAttribute('data-filtro') === state.crmFiltroEstatus);
  });
}

function _renderCRMClientesResultados() {
  var resBox = document.getElementById('crmClientesResultados');
  if (!resBox) return;
  var filtro = state.crmFiltroEstatus;
  var filtroEje = state.crmFiltroEje;
  var busqueda = _normalizarTexto(state.crmBusqueda);
  var lista = state.crmClientes.filter(function (c) {
    if (filtro !== 'Todos' && c.estatus !== filtro) return false;
    if (filtroEje !== 'Todos' && c.ejeInteres !== filtroEje) return false;
    if (!busqueda) return true;
    var campo = _normalizarTexto((c.organizacion || '') + ' ' + (c.nombreContacto || '') + ' ' + (c.correo || ''));
    return campo.indexOf(busqueda) !== -1;
  });

  var todosMarcados = lista.length > 0 && lista.every(function (c) { return state.crmClientesSeleccion.indexOf(c.codigo) !== -1; });
  var thead = '<tr><th style="width:28px"><input type="checkbox" id="crmSelAllClientes"' + (todosMarcados ? ' checked' : '') + '></th>' +
    '<th>Organización</th><th>Categoría</th><th>Contacto</th><th>Estatus</th><th>Último seguimiento</th><th></th></tr>';
  var trs = lista.map(function (c) {
    var ultimo = _ultimoSeguimientoDe(c.codigo);
    var celdaUltimo;
    if (!ultimo) {
      celdaUltimo = '<span class="subtle">Sin información</span>';
    } else {
      var notasCorta = String(ultimo.notas || '').slice(0, 60) + (String(ultimo.notas || '').length > 60 ? '…' : '');
      celdaUltimo = '<strong>' + escapeHtml(ultimo.fecha) + '</strong>' +
        (notasCorta ? '<br><span class="subtle">' + escapeHtml(notasCorta) + '</span>' : '');
    }
    var marcado = state.crmClientesSeleccion.indexOf(c.codigo) !== -1;
    return '<tr>' +
      '<td><input type="checkbox" class="crm-sel-cliente" data-codigo="' + c.codigo + '"' + (marcado ? ' checked' : '') + '></td>' +
      '<td>' + escapeHtml(c.organizacion) + '</td>' +
      '<td>' + escapeHtml(c.categoria || '—') + '</td>' +
      '<td>' + escapeHtml(c.nombreContacto || '—') + '</td>' +
      '<td>' + _badgeEstatusCRM(c.estatus) + '</td>' +
      '<td>' + celdaUltimo + '</td>' +
      '<td><button class="small" data-ver="' + c.codigo + '">Ver / seguimientos</button> ' +
        '<button class="small del" data-del="' + c.codigo + '">Eliminar</button></td>' +
    '</tr>';
  }).join('');

  resBox.innerHTML =
    '<p class="subtle">' + lista.length + ' de ' + state.crmClientes.length + ' cliente(s)/prospecto(s).' +
      (state.crmClientesSeleccion.length ? ' · ' + state.crmClientesSeleccion.length + ' seleccionado(s) para correo.' : '') + '</p>' +
    (lista.length === 0
      ? '<p class="subtle">No hay clientes que coincidan. Puedes agregarlos uno por uno, o usar "Importar archivo" para cargar varios desde un CSV/Excel.</p>'
      : '<div style="overflow-x:auto"><table><thead>' + thead + '</thead><tbody>' + trs + '</tbody></table></div>');

  var elSelAll = resBox.querySelector('#crmSelAllClientes');
  if (elSelAll) {
    elSelAll.onchange = function () {
      var marcar = elSelAll.checked;
      lista.forEach(function (c) {
        var idx = state.crmClientesSeleccion.indexOf(c.codigo);
        if (marcar && idx === -1) state.crmClientesSeleccion.push(c.codigo);
        if (!marcar && idx !== -1) state.crmClientesSeleccion.splice(idx, 1);
      });
      _renderCRMClientesResultados();
    };
  }
  Array.prototype.forEach.call(resBox.querySelectorAll('.crm-sel-cliente'), function (chk) {
    chk.onchange = function () {
      var codigo = chk.getAttribute('data-codigo');
      var idx = state.crmClientesSeleccion.indexOf(codigo);
      if (chk.checked && idx === -1) state.crmClientesSeleccion.push(codigo);
      if (!chk.checked && idx !== -1) state.crmClientesSeleccion.splice(idx, 1);
      _renderCRMClientesResultados();
    };
  });
  Array.prototype.forEach.call(resBox.querySelectorAll('[data-ver]'), function (b) {
    b.onclick = function () {
      var cliente = state.crmClientes.filter(function (c) { return c.codigo === b.getAttribute('data-ver'); })[0];
      abrirModalCliente(cliente);
    };
  });
  Array.prototype.forEach.call(resBox.querySelectorAll('[data-del]'), function (b) {
    b.onclick = async function () {
      if (!confirm('¿Eliminar este cliente/prospecto? Su historial de seguimientos quedará huérfano en el Sheet (ya no se podrá consultar desde aquí). No se puede deshacer.')) return;
      var r = await api('eliminarFilaCRMClientes', { codigo: b.getAttribute('data-del') });
      if (!r.ok) { alert(r.error); return; }
      await renderCRMClientes();
    };
  });
}

function abrirModalCliente(cliente) {
  var editando = !!cliente;
  var cfg = CRM_TIPOS.crm_clientes;

  var camposHtml = cfg.campos.map(function (c) {
    var id = 'cf_' + c.key;
    var val = cliente ? (cliente[c.key] != null ? cliente[c.key] : '') : '';
    if (c.tipo === 'select') {
      var opts = c.opciones.map(function (o) {
        return '<option ' + (cliente && cliente[c.key] === o ? 'selected' : '') + '>' + o + '</option>';
      }).join('');
      return '<label>' + c.label + '</label><select id="' + id + '">' + opts + '</select>';
    }
    if (c.tipo === 'textarea') {
      return '<label>' + c.label + '</label><textarea id="' + id + '">' + escapeHtml(val) + '</textarea>';
    }
    return '<label>' + c.label + '</label><input type="' + c.tipo + '" id="' + id + '" value="' + escapeHtml(val) + '">';
  }).join('');

  var modal = el(
    '<div class="modal-bg"><div class="modal wide">' +
      '<h2>' + (editando ? 'Editar cliente — ' + escapeHtml(cliente.organizacion) : 'Agregar cliente / prospecto') + '</h2>' +
      camposHtml +
      '<div id="clienteMsg"></div>' +
      '<div class="modal-actions">' +
        '<button class="secondary" id="clienteCancelar">Cerrar</button>' +
        '<button class="primary" id="clienteGuardar">Guardar</button>' +
      '</div>' +
      (editando ?
        '<hr style="margin:20px 0;border:none;border-top:1px solid #eee">' +
        '<div style="display:flex;justify-content:space-between;align-items:center">' +
          '<h3 style="margin:0">Seguimientos</h3>' +
          '<button class="secondary small" id="btnNuevoSeguimiento">+ Agregar seguimiento</button>' +
        '</div>' +
        '<p class="subtle">Cada seguimiento queda como su propio registro con fecha y acuerdos — así puedes llevar 30+ sin que esto se haga eterno.</p>' +
        '<div id="seguimientosBox"><p class="subtle">Cargando...</p></div>'
        : '') +
    '</div></div>'
  );
  document.body.appendChild(modal);
  modal.querySelector('#clienteCancelar').onclick = async function () {
    modal.remove();
    // Recarga antes de re-pintar la tabla: si dentro del modal se agregó, editó
    // o borró un seguimiento, la columna "Último seguimiento" debe reflejarlo
    // de inmediato, no hasta que se recargue la pestaña completa.
    await cargarCRMClientes();
    renderCRMClientesTabla();
  };
  modal.querySelector('#clienteGuardar').onclick = async function () {
    var btn = modal.querySelector('#clienteGuardar');
    var msgBox = modal.querySelector('#clienteMsg');
    var params = {};
    if (editando) params.codigo = cliente.codigo;
    var faltante = null;
    cfg.campos.forEach(function (c) {
      var elx = modal.querySelector('#cf_' + c.key);
      var v = elx.value;
      if (c.tipo !== 'select' && c.tipo !== 'date') v = v.trim();
      if (c.requerido && !v && !faltante) faltante = c.label;
      params[c.key] = v;
    });
    if (faltante) { msgBox.innerHTML = '<div class="msg error">El campo "' + faltante.replace(' *', '') + '" no puede estar vacío.</div>'; return; }

    btn.disabled = true; btn.textContent = 'Guardando...';
    var r = await api('guardarFilaCRMClientes', params);
    btn.disabled = false; btn.textContent = 'Guardar';
    if (!r.ok) { msgBox.innerHTML = '<div class="msg error">' + r.error + '</div>'; return; }
    msgBox.innerHTML = '<div class="msg ok">Guardado.</div>';
    await cargarCRMClientes();
    if (!editando) { modal.remove(); renderCRMClientesTabla(); }
  };

  if (editando) {
    modal.querySelector('#btnNuevoSeguimiento').onclick = function () {
      abrirModalSeguimiento(cliente.codigo, null, function () { return _cargarYRenderSeguimientos(cliente.codigo, modal); });
    };
    _cargarYRenderSeguimientos(cliente.codigo, modal);
  }
}

async function _cargarYRenderSeguimientos(clienteCodigo, modal) {
  var box = modal.querySelector('#seguimientosBox');
  if (!box) return;
  var r = await api('listarCRMSeguimientos', { cliente: clienteCodigo });
  if (!r.ok) { box.innerHTML = '<div class="msg error">' + r.error + '</div>'; return; }
  var filas = r.data.slice().sort(function (a, b) { return String(b.fecha || '').localeCompare(String(a.fecha || '')); });
  if (filas.length === 0) {
    box.innerHTML = '<p class="subtle">Todavía no hay seguimientos registrados para este cliente.</p>';
    return;
  }
  box.innerHTML = '<div style="max-height:280px;overflow-y:auto;border:1px solid #eee;border-radius:8px;padding:2px 12px">' +
    filas.map(function (s) {
      return '<div style="padding:10px 0;border-bottom:1px solid #f0f0f0">' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">' +
          '<strong>' + escapeHtml(s.fecha || '—') + (s.tipoContacto ? '  ·  ' + escapeHtml(s.tipoContacto) : '') + '</strong>' +
          '<span style="white-space:nowrap"><button class="small secondary" data-editseg="' + s.codigo + '">Editar</button> ' +
            '<button class="small del" data-delseg="' + s.codigo + '">Eliminar</button></span>' +
        '</div>' +
        '<div>' + escapeHtml(s.notas) + '</div>' +
        (s.proximaAccion ? '<div class="subtle">Próxima acción: ' + escapeHtml(s.proximaAccion) + (s.fechaProximo ? ' (' + escapeHtml(s.fechaProximo) + ')' : '') + '</div>' : '') +
        (s.responsable ? '<div class="subtle">Responsable: ' + escapeHtml(s.responsable) + '</div>' : '') +
      '</div>';
    }).join('') +
  '</div>';

  Array.prototype.forEach.call(box.querySelectorAll('[data-editseg]'), function (b) {
    b.onclick = function () {
      var seg = filas.filter(function (s) { return s.codigo === b.getAttribute('data-editseg'); })[0];
      abrirModalSeguimiento(clienteCodigo, seg, function () { return _cargarYRenderSeguimientos(clienteCodigo, modal); });
    };
  });
  Array.prototype.forEach.call(box.querySelectorAll('[data-delseg]'), function (b) {
    b.onclick = async function () {
      if (!confirm('¿Eliminar este seguimiento? No se puede deshacer.')) return;
      var r2 = await api('eliminarFilaCRMSeguimientos', { codigo: b.getAttribute('data-delseg') });
      if (!r2.ok) { alert(r2.error); return; }
      await _cargarYRenderSeguimientos(clienteCodigo, modal);
    };
  });
}

function abrirModalSeguimiento(clienteCodigo, seguimiento, alGuardar) {
  abrirModalFila('crm_seguimientos', seguimiento, {
    proyecto: '',
    extra: { clienteCodigo: clienteCodigo },
    titulo: 'seguimiento',
    alGuardar: alGuardar
  });
}

            '<button class="secondary" id="btnNuevoInteresado">+ Agregar interesado</button>' +

function _crmInteresadosFiltrados() {
  var q = state.crmBusquedaInteresados.trim().toLowerCase();
  return state.crmInteresados.filter(function (i) {
    if (state.crmFiltroInteresInteresados && i.interes !== state.crmFiltroInteresInteresados) return false;
    if (state.crmFiltroFuenteInteresados && i.fuente !== state.crmFiltroFuenteInteresados) return false;
    if (!q) return true;
    var texto = [(i.nombre || '') + ' ' + (i.apellido || ''), i.estado, i.municipio, i.email].join(' ').toLowerCase();
    return texto.indexOf(q) !== -1;
  });
}

function _renderCRMInteresadosResultados() {
  var caja = document.getElementById('crmInteresadosResultados');
  if (!caja) return;
  var filas = _crmInteresadosFiltrados();
  var todosMarcados = filas.length > 0 && filas.every(function (i) { return state.crmInteresadosSeleccion.indexOf(i.codigo) !== -1; });
  var thead = '<tr><th style="width:28px"><input type="checkbox" id="crmSelAllInteresados"' + (todosMarcados ? ' checked' : '') + '></th>' +
    '<th>Nombre</th><th>Estado</th><th>Municipio</th><th>Interesado en</th><th>Email</th><th></th></tr>';
  var trs = filas.map(function (i) {
    var marcado = state.crmInteresadosSeleccion.indexOf(i.codigo) !== -1;
    return '<tr>' +
      '<td><input type="checkbox" class="crm-sel-interesado" data-codigo="' + i.codigo + '"' + (marcado ? ' checked' : '') + '></td>' +
      '<td>' + escapeHtml(((i.nombre || '') + ' ' + (i.apellido || '')).trim()) + '</td>' +
      '<td>' + escapeHtml(i.estado || '—') + '</td>' +
      '<td>' + escapeHtml(i.municipio || '—') + '</td>' +
      '<td>' + escapeHtml(i.interes || '—') + '</td>' +
      '<td>' + escapeHtml(i.email || '—') + '</td>' +
      '<td><button class="small edit" data-codigo="' + i.codigo + '">Editar</button> ' +
        '<button class="small del" data-codigo="' + i.codigo + '">Eliminar</button></td>' +
    '</tr>';
  }).join('');

  caja.innerHTML =
    '<p class="subtle">' + filas.length + ' de ' + state.crmInteresados.length + ' interesado(s).' +
      (state.crmInteresadosSeleccion.length ? ' · ' + state.crmInteresadosSeleccion.length + ' seleccionado(s) para correo.' : '') + '</p>' +
    (filas.length === 0
      ? '<p class="subtle">Ningún interesado coincide con el criterio. Ajusta el buscador o los filtros.</p>'
      : '<div style="overflow-x:auto"><table><thead>' + thead + '</thead><tbody>' + trs + '</tbody></table></div>');

  var elSelAllInt = document.getElementById('crmSelAllInteresados');
  if (elSelAllInt) {
    elSelAllInt.onchange = function () {
      var marcar = elSelAllInt.checked;
      filas.forEach(function (i) {
        var idx = state.crmInteresadosSeleccion.indexOf(i.codigo);
        if (marcar && idx === -1) state.crmInteresadosSeleccion.push(i.codigo);
        if (!marcar && idx !== -1) state.crmInteresadosSeleccion.splice(idx, 1);
      });
      _renderCRMInteresadosResultados();
    };
  }
  Array.prototype.forEach.call(caja.querySelectorAll('.crm-sel-interesado'), function (chk) {
    chk.onchange = function () {
      var codigo = chk.getAttribute('data-codigo');
      var idx = state.crmInteresadosSeleccion.indexOf(codigo);
      if (chk.checked && idx === -1) state.crmInteresadosSeleccion.push(codigo);
      if (!chk.checked && idx !== -1) state.crmInteresadosSeleccion.splice(idx, 1);
      _renderCRMInteresadosResultados();
    };
  });
  Array.prototype.forEach.call(caja.querySelectorAll('button.edit'), function (b) {
    b.onclick = function () {
      var codigo = b.getAttribute('data-codigo');
      var fila = filas.filter(function (f) { return f.codigo === codigo; })[0];
      abrirModalFila('crm_interesados', fila, { proyecto: '', titulo: 'interesado', alGuardar: async function () { await renderCRMInteresados(); } });
    };
  });
  Array.prototype.forEach.call(caja.querySelectorAll('button.del'), function (b) {
    b.onclick = async function () {
      if (!confirm('¿Eliminar este interesado? No se puede deshacer.')) return;
      var r = await api('eliminarFilaCRMInteresados', { codigo: b.getAttribute('data-codigo') });
      if (!r.ok) { alert(r.error); return; }
      await renderCRMInteresados();
    };
  });
}

// Sustituye <<Etiqueta>> por el valor real del registro. Se usa solo para la
// vista previa en el navegador; el backend hace su propia sustitución sobre
// datos frescos del Sheet al momento de enviar (nunca confía en lo que ya
// tenía cacheado el frontend).
function _reemplazarTagsPreview(texto, registro, campos) {
  var resultado = String(texto || '');
  campos.forEach(function (c) {
    var valor = registro[c.key] != null ? String(registro[c.key]) : '';
    var tagEsc = c.tag.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    // Igual que en el backend: el cuerpo puede traer <<Etiqueta>> literal o
    // &lt;&lt;Etiqueta&gt;&gt; (así queda al leer innerHTML del editor).
    var patron = '(?:<<|&lt;&lt;)\\s*' + tagEsc + '\\s*(?:>>|&gt;&gt;)';
    resultado = resultado.replace(new RegExp(patron, 'g'), valor);
  });
  return resultado;
}
